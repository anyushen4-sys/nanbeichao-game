<script>
// ===== 确定性 RNG 模块 (mulberry32) =====
// rngFromSeed(seed: number) → { next(): float[0,1), shuffle(arr), pick(arr) }
function rngFromSeed(seed){
  let state=seed|0;
  // mulberry32: fast, good distribution, 32-bit state
  function next(){
    state|=0; state=state+0x6D2B79F5|0;
    let t=Math.imul(state^state>>>15,1|state);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  }
  return{
    next,
    shuffle(arr){
      const a=arr.slice();
      for(let i=a.length-1;i>0;i--){
        const j=Math.floor(next()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
      }
      return a;
    },
    pick(arr){return arr[Math.floor(next()*arr.length)]}
  };
}

// random() 全局入口: 多人模式下若 G._rng 存在则走确定性RNG, 否则 Math.random()
function random(){
  return (window.G&&G._rng)?G._rng.next():Math.random();
}

function getCardCategory(card){
  if(!card.ability) return 'commander';
  const t=card.ability.split(':')[0];
  if(t==='boost_row'||t==='weaken_row'||t==='discard'||t==='combo_boost'||t==='destroy'||t==='resurrect'||t==='protect'||t==='spy'||t==='draw_extra') return 'strategy';
  if(t==='draw'||t==='gain_provisions') return 'weather';
  return 'commander';
}

function getCardRarity(card){
  if(card.strength>=8) return 'gold';
  if(card.strength>=6) return 'purple';
  if(card.strength>=4) return 'blue';
  return 'gray';
}

function getCategoryIcon(card){
  return ROW_ICONS[getCardCategory(card)];
}

let uid=0;
function makeCard(c){return{...c,uid:++uid}}
function getCardCost(s){return Math.ceil(s/3)}

// ===== 02: state-migration-expand — 引入 players[] 数组 + 保留旧别名 =====
// players[0] = 玩家, players[1] = AI
// 旧别名 playerHand/aiHand/... 通过 Object.defineProperty getter/setter 桥接到 players[idx]
window.G={
players:[
  {deck:[],hand:[],board:{infantry:[],cavalry:[],navy:[],strategy:[]},leader:null,passed:false},
  {deck:[],hand:[],board:{infantry:[],cavalry:[],navy:[],strategy:[]},leader:null,passed:false}
],

// 顶层属性（无需桥接 — 不属于单个玩家）
phase:'menu',round:0,scores:[0,0],
provisions:[30,30],
currentTurn:'player',
selectedCard:null,logs:[],turnCount:0,
globalBuffs:{playerArmor:0,aiArmor:0,playerUnify:0,aiUnify:0,ambushTriggered:false,playerFarm:0,aiFarm:0,playerBerserkCard:null,aiBerserkCard:null},
graveyard:[],
mulliganSelected:new Set(),
leaderAbilityUsed:[false,false]
};

// 别名 getter/setter — 旧代码通过 playerHand/aiHand/... 读写等价于 players[idx].hand
(function(){
  const ALIAS=['Deck','Hand','Board','Leader','Passed'];
  const idxes={player:0,ai:1};
  for(const prefix in idxes){
    const i=idxes[prefix];
    for(const a of ALIAS){
      const aliasName=prefix+a;
      const propName=a.charAt(0).toLowerCase()+a.slice(1); // Deck→deck, Hand→hand, etc.
      Object.defineProperty(window.G,aliasName,{
        enumerable:true,configurable:true,
        get(){return window.G.players[i][propName];},
                set(v){window.G.players[i][propName]=v;}
      });
    }
  }
})();

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function buildDeck(faction){
  const fc=CARDS_DATA.filter(c=>c.faction===faction);
  const commonCards=CARDS_DATA.filter(c=>c.faction==='common');
  shuffle(commonCards);
  const deck=[...fc,...commonCards];
  shuffle(deck);
  return deck.map(c=>makeCard(c));
}

function applyLeaderDeckAbility(leader,deck){
  const a=leader.ability;
  if(a.type==='row_boost') deck.forEach(c=>{if(c&&c.row===a.row)c.strength+=a.value});
  if(a.type==='all_boost') deck.forEach(c=>{if(c)c.strength+=a.value});
}

function applyRoundStartAbilities(){
  applyLeaderAbilityForRound(G.playerLeader,0);
  applyLeaderAbilityForRound(G.aiLeader,1);
}

function applyLeaderAbilityForRound(leader,playerIdx){
  if(!leader)return;
  const a=leader.ability;
  if(a.type==='extra_draw') drawCards(playerIdx,a.value);
  if(a.type==='extra_provisions') G.provisions[playerIdx]+=a.value;
  if(a.type==='opponent_discard'){
    const opp=1-playerIdx;
    const h=getHand(opp);
    for(let i=0;i<a.value&&h.length>0;i++){
      const idx=Math.floor(random()*h.length);
      addLog(`【${leader.name}】效果：${opp===0?'你':'AI'}弃掉了${h[idx].name}`);
      h.splice(idx,1);
    }
  }
  if(a.type==='row_boost' && a.row==='any'){
    const myBoard=getBoard(playerIdx);
    const rows=['infantry','cavalry','navy','strategy'];
    let maxPower=-1,bestRow='infantry';
    rows.forEach(r=>{
      const p=getRowPower(myBoard[r],playerIdx);
      if(p>maxPower){maxPower=p;bestRow=r}
    });
    myBoard[bestRow].forEach(c=>{if(c)c.strength+=a.value});
    addLog(`【${leader.name}】效果：${ROW_NAMES[bestRow]}行+${a.value}`);
  }
}

function getHand(p){
  // 返回原始数组引用 - 调用者必须自己处理 undefined
  // (历史原因: 此函数曾加 filter 但破坏了 drawCards 的 push)
  return p===0?G.playerHand:G.aiHand;
}

function getHandSafe(p){
  // 只读操作, 过滤掉 undefined
  return getHand(p).filter(c=>c&&typeof c==='object');
}
function getDeck(p){return p===0?G.playerDeck:G.aiDeck}
function getBoard(p){return p===0?G.playerBoard:G.aiBoard}
function getBoardSafe(p){
  const b=getBoard(p);
  const clean=r=>Array.isArray(r)?r.filter(c=>c&&typeof c==='object'):[];
  return{infantry:clean(b.infantry),cavalry:clean(b.cavalry),navy:clean(b.navy),strategy:clean(b.strategy)};
}

function drawCards(playerIdx,count){
  // 不能用 getHand() 因为它返回 .filter() 的新数组, push 会失败
  // 必须直接引用 G.playerHand/G.aiHand 数组
  const realHand=playerIdx===0?G.playerHand:G.aiHand;
  const deck=playerIdx===0?G.playerDeck:G.aiDeck;
  for(let i=0;i<count&&realHand.length<10&&deck.length>0;i++) realHand.push(deck.shift());
}

function getRowPower(cards,playerIdx){
  const buffs=G.globalBuffs;
  const armor=playerIdx===0?buffs.playerArmor:buffs.aiArmor;
  const unify=playerIdx===0?buffs.playerUnify:buffs.aiUnify;
  return cards.reduce((s,c)=>s+(c?Math.max(1,c.strength+armor+Math.floor(unify*0.5)):0),0);
}
function getBoardPower(board,playerIdx){return getRowPower(board.infantry,playerIdx)+getRowPower(board.cavalry,playerIdx)+getRowPower(board.navy,playerIdx)+getRowPower(board.strategy,playerIdx)}

function weakestOpponentRow(opponentBoard,oppIdx){
  const rows=['infantry','cavalry','navy','strategy'];
  let min=Infinity,wk='infantry';
  rows.forEach(r=>{const p=getRowPower(opponentBoard[r],oppIdx);if(p<min){min=p;wk=r}});
  return wk;
}

function triggerAbility(card,playerIdx){
  if(!card.ability)return;
  const[t,v]=card.ability.split(':');
  const n=parseInt(v);
  const opp=1-playerIdx;
  const myBoard=getBoard(playerIdx);
  const oppBoard=getBoard(opp);
  switch(t){
    case'draw':
      drawCards(playerIdx,n);
      addLog(`${card.name}的效果：抽${n}张牌`);
      break;
    case'discard':{
      const oppH=getHand(opp);
      for(let i=0;i<n&&oppH.length>0;i++){
        const idx=Math.floor(random()*oppH.length);
        addLog(`${card.name}的效果：${opp===0?'你':'AI'}弃掉了${oppH[idx].name}`);
        oppH.splice(idx,1);
      }
      break;}
    case'boost_row':
      myBoard[card.row].forEach(c=>{if(c&&c.uid!==card.uid)c.strength+=n});
      addLog(`${card.name}的效果：本行+${n}`);
      break;
    case'weaken_row':{
      const wk=weakestOpponentRow(oppBoard,opp);
      oppBoard[wk].forEach(c=>{if(c)c.strength=Math.max(1,c.strength-n)});
      addLog(`${card.name}的效果：${opp===0?'你':'AI'}${ROW_NAMES[wk]}行-${n}`);
      break;}
    case'gain_provisions':
      G.provisions[playerIdx]+=n;
      addLog(`${card.name}的效果：+${n}粮草`);
      break;
    case'ambush':
      if(G.turnCount===0&&!G.globalBuffs.ambushTriggered){
        myBoard.infantry.forEach(c=>{if(c)c.strength+=n});
        G.globalBuffs.ambushTriggered=true;
        addLog(`${card.name}的效果：突袭！步兵行+${n}`);
      }
      break;
    case'command':{
      const cmdH=getHand(playerIdx);
      if(cmdH.length>0){
        let weakIdx=0,weakStr=Infinity;
        cmdH.forEach((c,i)=>{if(c&&c.strength<weakStr){weakStr=c.strength;weakIdx=i}});
        const discarded=cmdH.splice(weakIdx,1)[0];
        addLog(`${card.name}的效果：弃掉了${discarded.name}（${discarded.strength}）`);
        if(cmdH.length>0){
          drawCards(playerIdx,n);
          addLog(`${card.name}的效果：抽${n}张牌`);
        }
      }
      break;}
    case'control':{
      let ctrlMaxP=-1,ctrlMaxRow='infantry';
      ['infantry','cavalry','navy','strategy'].forEach(r=>{
        const p=getRowPower(oppBoard[r],opp);
        if(p>ctrlMaxP){ctrlMaxP=p;ctrlMaxRow=r}
      });
      oppBoard[ctrlMaxRow].forEach(c=>{if(c)c.strength=Math.max(1,c.strength-1)});
      addLog(`${card.name}的效果：离间计！${opp===0?'你':'AI'}${ROW_NAMES[ctrlMaxRow]}行-1`);
      break;}
    case'skirmish':
      if(playerIdx===0) G.aiPassed=true;
      else G.playerPassed=true;
      addLog(`${card.name}的效果：${opp===0?'你':'AI'}被迫跳过`);
      break;
    case'shield':
      ['infantry','cavalry','navy','strategy'].forEach(r=>{
        myBoard[r].forEach(c=>{if(c)c.strength+=n});
      });
      addLog(`${card.name}的效果：全场+${n}`);
      break;
    case'navy_boost':
      myBoard.navy.forEach(c=>{if(c&&c.uid!==card.uid)c.strength+=n});
      addLog(`${card.name}的效果：水军行+${n}`);
      break;
    case'farm':
      if(playerIdx===0) G.globalBuffs.playerFarm=n;
      else G.globalBuffs.aiFarm=n;
      addLog(`${card.name}的效果：每回合+${n}粮草`);
      break;
    case'fortify':
      myBoard[card.row].forEach(c=>{if(c&&c.uid!==card.uid)c.strength+=n});
      addLog(`${card.name}的效果：本行+${n}`);
      break;
    case'flex':
      addLog(`${card.name}的效果：可放入任意行`);
      break;
    case'assimilate':{
      let aMinCard=null,aMinStr=Infinity,aMinRow=null;
      ['infantry','cavalry','navy','strategy'].forEach(r=>{
        oppBoard[r].forEach(c=>{
          if(c.strength<aMinStr){aMinStr=c.strength;aMinCard=c;aMinRow=r}
        });
      });
      if(aMinCard){
        oppBoard[aMinRow]=oppBoard[aMinRow].filter(c=>c.uid!==aMinCard.uid);
        getHandSafe(playerIdx).push(aMinCard);
        addLog(`${card.name}的效果：吸收了${opp===0?'你':'AI'}的${aMinCard.name}`);
      }
      break;}
    case'armor':
      if(playerIdx===0) G.globalBuffs.playerArmor+=n;
      else G.globalBuffs.aiArmor+=n;
      addLog(`${card.name}的效果：全军护甲+${n}`);
      break;
    case'siege':{
      let sMaxP=-1,sMaxRow='infantry';
      ['infantry','cavalry','navy','strategy'].forEach(r=>{
        const p=getRowPower(oppBoard[r],opp);
        if(p>sMaxP){sMaxP=p;sMaxRow=r}
      });
      oppBoard[sMaxRow].forEach(c=>{if(c)c.strength=Math.max(1,c.strength-n)});
      addLog(`${card.name}的效果：围城！${opp===0?'你':'AI'}${ROW_NAMES[sMaxRow]}行-${n}`);
      break;}
    case'coordinate':
      myBoard[card.row].forEach(c=>{
        if(c.uid!==card.uid&&c.faction===card.faction) c.strength+=n;
      });
      addLog(`${card.name}的效果：联防，同阵营+${n}`);
      break;
    case'ambush_card':{
      drawCards(playerIdx,1);
      const ambH=getHand(opp);
      if(ambH.length>0){
        const idx=Math.floor(random()*ambH.length);
        addLog(`${card.name}的效果：${opp===0?'你':'AI'}弃掉了${ambH[idx].name}`);
        ambH.splice(idx,1);
      }
      addLog(`${card.name}的效果：抽1牌，对手弃1牌`);
      break;}
    case'berserk':
      card.strength*=2;
      if(playerIdx===0) G.globalBuffs.playerBerserkCard=card.uid;
      else G.globalBuffs.aiBerserkCard=card.uid;
      addLog(`${card.name}的效果：狂攻！战力翻倍为${card.strength}`);
      break;
    case'crit':{
      let cMaxCard=null,cMaxStr=-1,cMaxRow=null;
      ['infantry','cavalry','navy','strategy'].forEach(r=>{
        oppBoard[r].forEach(c=>{
          if(c.strength>cMaxStr){cMaxStr=c.strength;cMaxCard=c;cMaxRow=r}
        });
      });
      if(cMaxCard){
        oppBoard[cMaxRow]=oppBoard[cMaxRow].filter(c=>c.uid!==cMaxCard.uid);
        addLog(`${card.name}的效果：消灭了${opp===0?'你':'AI'}的${cMaxCard.name}（${cMaxStr}）`);
      }
      break;}
    case'unify':
      if(playerIdx===0) G.globalBuffs.playerUnify+=1;
      else G.globalBuffs.aiUnify+=1;
      addLog(`${card.name}的效果：统一之力+1`);
      break;
    case'anti_south':{
      const southFactions=['song','qi','liang','chen'];
      const oppLeaderFaction=(playerIdx===0?G.aiLeader:G.playerLeader)?.faction||'';
      if(southFactions.includes(oppLeaderFaction)){
        card.strength+=n;
        addLog(`${card.name}的效果：灭${oppLeaderFaction}！战力+${n}`);
      }
      break;}
    case'combo_boost':{
      const sameType=Object.values(myBoard).flat().filter(c=>c.uid!==card.uid&&c.ability&&c.ability.split(':')[0]==='combo_boost');
      sameType.forEach(c=>{if(c)c.strength+=n});
      addLog(`${card.name}的效果：连携！友方连携卡+${n}`);
      break;}
    case'destroy':{
      const oppAll=Object.entries(oppBoard).flatMap(([r,cards])=>cards.map(c=>({...c,_row:r})));
      for(let i=0;i<n&&oppAll.length>0;i++){
        const ri=Math.floor(random()*oppAll.length);
        const target=oppAll.splice(ri,1)[0];
        oppBoard[target._row]=oppBoard[target._row].filter(c=>c.uid!==target.uid);
        G.graveyard.push(target);
        addLog(`${card.name}的效果：消灭了${opp===0?'你':'AI'}的${target.name}`);
      }
      break;}
    case'resurrect':{
      for(let i=0;i<n&&G.graveyard.length>0;i++){
        const ri=Math.floor(random()*G.graveyard.length);
        const card2=G.graveyard.splice(ri,1)[0];
        getHandSafe(playerIdx).push(card2);
        addLog(`${card.name}的效果：从墓地回收了${card2.name}`);
      }
      break;}
    case'protect':
      card.protectArmor=(card.protectArmor||0)+n;
      addLog(`${card.name}的效果：获得${n}点护甲`);
      break;
    case'spy':{
      const oppH2=getHand(opp);
      if(oppH2.length>0){
        let spyMax=-1,spyIdx=0;
        oppH2.forEach((c,i)=>{if(c&&c.strength>spyMax){spyMax=c.strength;spyIdx=i}});
        const discarded=oppH2.splice(spyIdx,1)[0];
        G.graveyard.push(discarded);
        addLog(`${card.name}的效果：间谍行动，${opp===0?'你':'AI'}弃掉了${discarded.name}（${discarded.strength}）`);
      }
      break;}
    case'draw_extra':
      drawCards(playerIdx,n);
      addLog(`${card.name}的效果：额外抽${n}张牌`);
      break;
  }
}

function triggerAbilityWithFlash(card,playerIdx,row){
  triggerAbility(card,playerIdx);
  const board=getBoard(playerIdx);
  const cards=board[row];
  const lastCard=cards[cards.length-1];
  if(lastCard){
    setTimeout(()=>{
      const els=document.querySelectorAll('.card-mini');
      for(const el of els){
        const nameEl=el.querySelector('.c-name');
        if(nameEl&&nameEl.textContent===card.name){
          el.classList.add('skill-flash');
          setTimeout(()=>el.classList.remove('skill-flash'),700);
          break;
        }
      }
    },50);
  }
}

function playCard(playerIdx,handIdx,row){
  const hand=getHand(playerIdx);
  if(!hand[handIdx])return;  // 防御：手牌索引可能已失效
  const card=hand.splice(handIdx,1)[0];
  if(!card)return;  // 防御：splice 结果不应为 undefined（双保险）

  const berserkKey=playerIdx===0?'playerBerserkCard':'aiBerserkCard';
  const berserkUid=G.globalBuffs[berserkKey];
  if(berserkUid!=null){
    const board=getBoard(playerIdx);
    for(const r of ['infantry','cavalry','navy','strategy']){
      const bCard=board[r].find(c=>c.uid===berserkUid);
      if(bCard){
        bCard.strength=Math.max(1,bCard.strength-2);
        addLog(`${bCard.name} 狂攻反噬，战力-2`);
        break;
      }
    }
    G.globalBuffs[berserkKey]=null;
  }

  const board=getBoard(playerIdx);
  board[row].push(card);
  G.provisions[playerIdx]-=getCardCost(card.strength);
  G._lastPlayedUid=card.uid;
  G._lastPlayedBy=playerIdx;
  const name=playerIdx===0?'你':'AI';
  addLog(`${name}打出了 ${card.name}（${ROW_NAMES[row]} ${card.strength}）`);
  setTimeout(()=>{
    const rowEl=document.querySelector('.row[data-row="'+row+'"]')||document.querySelectorAll('.row')[getRowIdx(row)];
    const cardEl=card.uid?getCardEl(card.uid):null;
    try{playCardEffect(card,rowEl,{cardEl});}catch(e){}
  },50);
  if(playerIdx===1){
    setTimeout(()=>triggerAbilityWithFlash(card,playerIdx,row),650);
  }else{
    triggerAbilityWithFlash(card,playerIdx,row);
  }
}

function startRound(){
  G.round++;
  G.playerPassed=false;
  G.aiPassed=false;
  G.selectedCard=null;
  G.turnCount=0;
  // 粮草不再重置——开局30跨局共享（仅 confirmLeader/resetGame 初始化）
  G.playerBoard={infantry:[],cavalry:[],navy:[],strategy:[]};
  G.aiBoard={infantry:[],cavalry:[],navy:[],strategy:[]};
  G.globalBuffs={playerArmor:0,aiArmor:0,playerUnify:0,aiUnify:0,ambushTriggered:false,playerFarm:0,aiFarm:0,playerBerserkCard:null,aiBerserkCard:null};
  G.graveyard=[];
  G.logs=[];
  // 第1局不自动抽牌（换牌阶段已经处理）
  const drawCount=G.round<=1?0:4;
  if(drawCount>0){
    drawCards(0,drawCount);
    drawCards(1,drawCount);
  }
  applyRoundStartAbilities();
  G.currentTurn='player';
  addLog(`═══ 第${G.round}局开始 ═══`);
  if(drawCount>0) addLog(`双方各抽${drawCount}张牌`);
  render();
}

function playerPlayCard(handIdx,row){
  if(G.phase!=='playing'||G.currentTurn!=='player'||G.playerPassed)return;
  const card=G.playerHand[handIdx];
  if(!card)return;  // 防御：手牌可能已被 splice
  if(getCardCost(card.strength)>G.provisions[0])return;
  playCard(0,handIdx,row);
  G.selectedCard=null;
  G.turnCount++;
  afterPlayerTurn();
}

function playerPass(){
  if(G.phase!=='playing')return;
  if(G.playerPassed)return;
  if(G.currentTurn!=='player')return;
  // 直接放弃：去掉确认弹窗(防止误以为 Pass 没生效),改为 toast 提示
  G.playerPassed=true;
  G.selectedCard=null;
  addLog('你放弃了本局');
  showToast('已放弃本局,等待 AI');
  if(G.aiPassed){endRound();return}
  G.currentTurn='ai';
  render();
  setTimeout(aiTurn,800);
}

function afterPlayerTurn(){
  // 如果玩家没有可出的牌，自动Pass
  if(!hasPlayableCard(0)){
    addLog('你没有可出的牌了');
    G.playerPassed=true;
    G.selectedCard=null;
    if(G.aiPassed){endRound();return}
    G.currentTurn='ai';
    render();
    setTimeout(aiTurn,600);
    return;
  }
  if(G.aiPassed){
    if(G.playerPassed){
      endRound();return;
    }
    G.currentTurn='player';
    render();
    return;
  }
  G.currentTurn='ai';
  if(G.globalBuffs.aiFarm>0){
    G.provisions[1]+=G.globalBuffs.aiFarm;
    addLog(`AI获得${G.globalBuffs.aiFarm}粮草（屯田）`);
  }
  render();
  setTimeout(aiTurn,600);
}

function hasPlayableCard(p){
  const hand=getHand(p);
  const prov=G.provisions[p];
  return hand.some(c=>c&&getCardCost(c.strength)<=prov);
}

function aiTurn(){
  try{
  if(G.phase!=='playing')return;
  // 防御性检查: 如果AI粮草为0且手牌无费用可出，立即pass
  if(G.provisions[1]<=0 && !hasPlayableCard(1)){
    G.aiPassed=true;
    addLog('AI无粮草可出，自动放弃');
    if(G.playerPassed){endRound();return}
    G.currentTurn='player';
    render();return;
  }
  if(G.aiPassed){
    if(G.playerPassed){endRound();return}
    G.currentTurn='player';
    render();
    return;
  }
  if(!hasPlayableCard(1)){
    G.aiPassed=true;
    addLog('AI无牌可出，放弃了');
    if(G.playerPassed){endRound();return}
    G.currentTurn='player';
    render();return;
  }
  if(G.leaderAbilityUsed[1]===false&&random()<0.4){
    useLeaderAbility(1);
    render();
  }
  if(aiShouldPass()){
    G.aiPassed=true;
    addLog('AI放弃了本局');
    if(G.playerPassed){endRound();return}
    G.currentTurn='player';
    render();return;
  }
  const choice=aiChooseCard();
  if(!choice){G.aiPassed=true;addLog('AI放弃了');if(G.playerPassed){endRound();return}G.currentTurn='player';render();return}
  setTimeout(()=>{
    try{
      if(G.phase!=='playing'||G.aiPassed)return;
      playCard(1,choice.handIdx,choice.row);
    }catch(e){
      console.error('[AI playCard]',e);
      addLog('AI出牌失败:'+e.message);
    }
    try{
      G.turnCount++;
      if(G.playerPassed){endRound();return}
      G.currentTurn='player';
      if(G.globalBuffs.playerFarm>0){
        G.provisions[0]+=G.globalBuffs.playerFarm;
        addLog(`你获得${G.globalBuffs.playerFarm}粮草（屯田）`);
      }
    }catch(e){}
    render();
  },600);
  }catch(e){
    console.error('[aiTurn outer]',e);
    addLog('AI 出现异常:'+e.message);
    G.currentTurn='player';
    render();
  }
}

function aiShouldPass(){
  // 早期几轮不让 AI 主动放弃(避免一上来就 Pass 太弱)
  if(G.turnCount<3)return false;
  const aiP=getBoardPower(G.aiBoard,1);
  const plP=getBoardPower(G.playerBoard,0);
  const prov=G.provisions[1];
  // 无牌可出必 Pass
  if(!hasPlayableCard(1))return true;
  // 局势判断:AI 落后 5+ 战力,且剩余粮草只够出低费牌 → 战略性 Pass 让 AI 把赢面留给下一局
  if(aiP < plP - 5 && prov <= 4)return true;
  // 双方都已 Pass 会进入结算,这里不必处理
  return false;
}

function aiChooseCard(){
  const hand=G.aiHand;
  const prov=G.provisions[1];
  const playable=hand.map((c,i)=>({card:c,idx:i})).filter(x=>x.card&&getCardCost(x.card.strength)<=prov);
  if(!playable.length)return null;
  const aiP=getBoardPower(G.aiBoard,1);
  const plP=getBoardPower(G.playerBoard,0);
  let best=null,bestScore=-9999;
  for(const{card,idx}of playable){
    let score=card.strength;
    const rp={infantry:getRowPower(G.aiBoard.infantry,1),cavalry:getRowPower(G.aiBoard.cavalry,1),navy:getRowPower(G.aiBoard.navy,1),strategy:getRowPower(G.aiBoard.strategy,1)};
    const minR=Object.keys(rp).reduce((a,b)=>rp[a]<rp[b]?a:b);
    let targetRow=card.row;
    if(card.row===minR)score+=4;
    if(card.ability){
      const[t]=card.ability.split(':');
      if(t==='ambush')score+=(G.turnCount===0?5:0);
      if(t==='command')score+=3;
      if(t==='control')score+=5;
      if(t==='skirmish')score+=4;
      if(t==='shield')score+=4;
      if(t==='navy_boost')score+=3;
      if(t==='farm')score+=3;
      if(t==='fortify')score+=3;
      if(t==='flex'){score+=2;targetRow=minR}
      if(t==='assimilate')score+=5;
      if(t==='armor')score+=4;
      if(t==='siege')score+=4;
      if(t==='coordinate')score+=3;
      if(t==='ambush_card')score+=3;
      if(t==='berserk')score+=(aiP<plP?5:2);
      if(t==='crit')score+=6;
      if(t==='unify')score+=3;
      if(t==='anti_south'){
        const oppFaction=G.playerLeader?G.playerLeader.faction:'';
        if(['song','qi','liang','chen'].includes(oppFaction))score+=4;
      }
      if(t==='boost_row')score+=3;
      if(t==='weaken_row')score+=4;
      if(t==='discard')score+=3;
      if(t==='draw')score+=2;
      if(t==='gain_provisions')score+=1;
      if(t==='combo_boost')score+=3;
      if(t==='destroy')score+=5;
      if(t==='resurrect')score+=4;
      if(t==='protect')score+=3;
      if(t==='spy')score+=5;
      if(t==='draw_extra')score+=3;
    }
    if(aiP<plP)score+=card.strength*0.5;
    score+=random()*2;
    if(score>bestScore){bestScore=score;best={handIdx:idx,row:targetRow}}
  }
  return best;
}

function endRound(){
  const pP=getBoardPower(G.playerBoard,0);
  const aP=getBoardPower(G.aiBoard,1);
  let winner;
  if(pP>aP){winner=0;G.scores[0]++}
  else if(aP>pP){winner=1;G.scores[1]++}
  else{winner=-1}
  const winText=winner===0?'你赢了本局！':winner===1?'AI赢了本局！':'本局平局！';
  addLog(`═══ 第${G.round}局结束 ═══`);
  addLog(`你的战力：${pP} vs AI战力：${aP} → ${winText}`);
  G.phase='round_result';
  G._roundResult={playerPower:pP,aiPower:aP,winner};
  render();
  showNotification(winText);
}

function checkGameEnd(){
  if(G.scores[0]>=2||G.scores[1]>=2||G.round>=3){
    G.phase='game_result';
    render();
    const winText=G.scores[0]>G.scores[1]?'你赢得了天下！':G.scores[0]===G.scores[1]?'棋逢对手，不分胜负！':'AI赢得了天下！';
    showNotification(winText,3000);
  }else{
    G.phase='playing';
    setTimeout(startRound,1500);
  }
}

function nextRoundOrGame(){
  checkGameEnd();
}

function playCardEffect(card,rowEl,opts={}){
  const color=getCardElColor(card);
  const cardEl=opts.cardEl||null;
  const start=cardEl?getRectCenter(cardEl):{x:window.innerWidth/2,y:window.innerHeight-100};
  const end=rowEl?getRectCenter(rowEl):{x:window.innerWidth/2,y:window.innerHeight/2};
  if(!start||!end)return;
  playArcParticles(start.x,start.y,end.x,end.y,color,8);
  if(card.row==='navy')playNavyWave(end.x,end.y);
  const ab=card.ability||'';const abType=ab.split(':')[0];
  switch(abType){
    case'draw':{const ha=document.querySelector('.hand-area');if(ha){const r=ha.getBoundingClientRect();playDrawTalismans(start.x,start.y,r.left+r.width/2,r.top+30,Math.min(parseInt(ab.split(':')[1]||'1',10)*2,6));}break;}
    case'draw_extra':{const ha=document.querySelector('.hand-area');if(ha){const r=ha.getBoundingClientRect();playDrawBurst(start.x,start.y,r.left+r.width/2,r.top+30,12);}break;}
    case'boost_row':case'navy_boost':case'combo_boost':{playRowArrows(start.x,start.y,end.x,end.y,color,8);break;}
    case'destroy':{playDestroyVortex(end.x,end.y);break;}
    case'shield':case'protect':{playShield(end.x,end.y);break;}
    case'gain_provisions':{const n=parseInt(ab.split(':')[1]||'1',10);for(let i=0;i<n;i++)setTimeout(()=>playProvisionsBag(start.x+10*(i%3-1),start.y+5*(i-Math.floor(n/2))),i*200);break;}
    case'ambush':{playAmbushParticles(start.x,start.y,end.x,end.y,6);break;}
    case'crit':{playCritStar(end.x,end.y);break;}
    case'berserk':{playBerserkFlash(end.x,end.y);break;}
    case'resurrect':{playResurrectBeam(end.x,end.y);break;}
    case'discard':{playDiscardChains(start.x,start.y,end.x,end.y,3);break;}
    case'skirmish':{playSkirmishRing(end.x,end.y);break;}
    case'weaken_row':{playWeakenShadow(end.x,end.y);break;}
    case'command':{playCommandBanner(end.x,end.y);break;}
    case'assimilate':{playAssimilateTentacles(end.x,end.y,3);break;}
    case'spy':{playSpySmoke(end.x,end.y);break;}
    case'control':{playControlChain(end.x,end.y);break;}
    case'fortify':{playFortifyBlocks(end.x,end.y);break;}
    case'siege':{playSiegeRocks(start.x,start.y,end.x,end.y);break;}
    case'farm':{playFarmGrains(end.x,end.y);break;}
    case'unify':{playUnifyOrbs(end.x,end.y);break;}
    case'flex':{playFlexFlip(end.x,end.y);break;}
    case'anti_south':{playAntiFire(end.x,end.y);break;}
    case'ambush_card':{playAmbushGrass(end.x,end.y);break;}
    case'coordinate':{playCoordinateLines(start.x,start.y,end.x,end.y,color);break;}
    case'armor':{playArmorPlates(end.x,end.y);break;}
  }
}

function render(){
  const app=document.getElementById('app');
  const lastUid=G._lastPlayedUid;
  const lastBy=G._lastPlayedBy;
  G._lastPlayedUid=null;
  G._lastPlayedBy=null;
  switch(G.phase){
      case'menu':renderMenu(app);break;
      case'tutorial':renderTutorial(app);break;
      case'leader_select':renderLeaderSelect(app);break;
      case'mulligan':renderMulligan(app);break;
      case'playing':renderGame(app,lastUid,lastBy);break;
      case'round_result':renderRoundResult(app);break;
      case'game_result':renderGameResult(app);break;

function leaderImgFallback(img, fallbackSrc, color, initial){
  // Three-level fallback: PNG -> existing PNG -> placeholder color block
  if(img._fallbackLevel === undefined) img._fallbackLevel = 0;
  img._fallbackLevel++;
  if(img._fallbackLevel === 1){
    img.onerror=null;
    img.src=fallbackSrc;
    img.onerror=function(){leaderImgFallback(this, null, color, initial)};
  } else {
    img.style.display='none';
    const ph=img.parentNode.querySelector('.placeholder-block');
    if(ph) ph.style.display='flex';
  }
}

function useLeaderAbility(playerIdx){
  if(G.leaderAbilityUsed[playerIdx])return;
  const leader=playerIdx===0?G.playerLeader:G.aiLeader;
  if(!leader)return;
  const ability=leader.ability;
  switch(ability.type){
    case'row_boost':
      getBoard(playerIdx)[ability.row].forEach(c=>{if(c)c.strength+=ability.value});
      addLog(`【${leader.name}】技能：${ROW_NAMES[ability.row]}行+${ability.value}`);
      break;
    case'extra_draw':
      drawCards(playerIdx,ability.value);
      addLog(`【${leader.name}】技能：抽${ability.value}张牌`);
      break;
    case'opponent_discard':{
      const opp=1-playerIdx;
      const oppH=getHand(opp);
      for(let i=0;i<ability.value&&oppH.length>0;i++){
        const ri=Math.floor(random()*oppH.length);
        addLog(`【${leader.name}】技能：对手弃${oppH[ri].name}`);
        oppH.splice(ri,1);
      }
      break;}
    case'extra_provisions':
      G.provisions[playerIdx]+=ability.value;
      addLog(`【${leader.name}】技能：粮草+${ability.value}`);
      break;
    case'all_boost':
      ['infantry','cavalry','navy','strategy'].forEach(r=>getBoard(playerIdx)[r].forEach(c=>{if(c)c.strength+=ability.value}));
      addLog(`【${leader.name}】技能：全场+${ability.value}`);
      break;
    case'double_edge':{
      const myBoard=getBoard(playerIdx);
      const rows=['infantry','cavalry','navy','strategy'];
      let maxP=-1,bestR='infantry',minP=Infinity,worstR='infantry';
      rows.forEach(r=>{
        const p=getRowPower(myBoard[r],playerIdx);
        if(p>maxP){maxP=p;bestR=r}
        if(p<minP){minP=p;worstR=r}
      });
      if(bestR===worstR) bestR=rows.find(r=>r!==worstR)||'infantry';
      myBoard[bestR].forEach(c=>{if(c)c.strength+=ability.value});
      myBoard[worstR].forEach(c=>{if(c)c.strength=Math.max(1,c.strength-1)});
      addLog(`【${leader.name}】技能：${ROW_NAMES[bestR]}行+${ability.value}，${ROW_NAMES[worstR]}行-1`);
      break;}
    case'hand_boost':{
      const hand=getHand(playerIdx);
      const shuffled=[...hand].sort(()=>random()-0.5);
      const cnt=Math.min(ability.value,shuffled.length);
      for(let i=0;i<cnt;i++) shuffled[i].strength+=2;
      addLog(`【${leader.name}】技能：手牌${cnt}张+2`);
      break;}
  }
  G.leaderAbilityUsed[playerIdx]=true;
  render();
}

    if(playerWin){
      await steamSetStat('STAT_TOTAL_WINS',(Number(localStorage.getItem('steam_total_wins')||0))+1);
      localStorage.setItem('steam_total_wins',String(Number(localStorage.getItem('steam_total_wins')||0)+1));
      await steamUnlock('ACH_FIRST_WIN');
    } else if(!isDraw){
      await steamSetStat('STAT_TOTAL_LOSSES',(Number(localStorage.getItem('steam_total_losses')||0))+1);
      localStorage.setItem('steam_total_losses',String(Number(localStorage.getItem('steam_total_losses')||0)+1));
    }
    if(G.scores[0]===2&&G.scores[1]===0)await steamUnlock('ACH_PERFECT_ROUND');
    const total=Number(localStorage.getItem('steam_total_games')||0);
    if(total>=10)await steamUnlock('ACH_VETERAN');
  })();
  el.innerHTML=`
  <div class="game-result">
    <div class="menu-seal" style="margin:0 auto 30px">${playerWin?'胜利':isDraw?'平局':'败北'}</div>
    <h1 class="${playerWin?'victory':isDraw?'draw':'defeat'}">${playerWin?'天下归一':isDraw?'棋逢对手':'功败垂成'}</h1>
    <div class="final-score">${G.scores[0]} : ${G.scores[1]}</div>
    <div class="detail">
      ${G.players[0].leader.name}（${FACTIONS[G.players[0].leader.faction].name}）VS ${G.players[1].leader.name}（${FACTIONS[G.players[1].leader.faction].name}）
    </div>
    <div class="decorative-line" style="width:200px;margin:20px auto"></div>
        <p style="color:#8B7355;margin:20px 0 30px;letter-spacing:2px;line-height:1.8">
          ${playerWin?'运筹帷幄之中，决胜千里之外。':isDraw?'将遇良才，棋逢对手。':'胜败乃兵家常事，再接再厉。'}
        </p>
        <button class="btn btn-primary" onclick="resetGame()">再 战 一 局</button>
          </div>`;
        }

        // ===== 06: mode-router — 多人模式 / 热座模式渲染空壳 =====
        function renderMultiplayerLobby(el){
      el.innerHTML='<div class="multiplayer-lobby"><h2>多人对战大厅</h2><p>即将推出...</p></div>';
    }

    function renderMultiplayerPlaying(el){
      el.innerHTML='<div class="multiplayer-playing"><h2>多人对战</h2><p>即将推出...</p></div>';
    }

    function renderHotSeatPlaying(el){
      el.innerHTML='<div class="hot-seat-playing"><h2>热座模式</h2><p>即将推出...</p></div>';
    }

    function resetGame(){
  uid=0;
  G.phase='menu';G.round=0;G.scores=[0,0];
  G.playerLeader=null;G.aiLeader=null;
  G.playerDeck=[];G.aiDeck=[];
  G.playerHand=[];G.aiHand=[];
  G.playerBoard={infantry:[],cavalry:[],navy:[],strategy:[]};
  G.aiBoard={infantry:[],cavalry:[],navy:[],strategy:[]};
  G.provisions=[30,30];G.currentTurn='player';
  G.playerPassed=false;G.aiPassed=false;
  G.selectedCard=null;G.logs=[];G.turnCount=0;
  G.globalBuffs={playerArmor:0,aiArmor:0,playerUnify:0,aiUnify:0,ambushTriggered:false,playerFarm:0,aiFarm:0,playerBerserkCard:null,aiBerserkCard:null};
  G.graveyard=[];
  G._selectedLeader=null;G._roundResult=null;G._lastPlayedBy=null;
  G.mulliganSelected=new Set();G.leaderAbilityUsed=[false,false];
  render();
}

function showConfirmModal(title, msg, onYes){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-modal-overlay';
  overlay.innerHTML = `<div class="confirm-modal">
    <div class="confirm-title">${title}</div>
    <div class="confirm-msg">${msg}</div>
    <div class="confirm-btns">
      <button class="confirm-btn confirm-no">取消</button>
      <button class="confirm-btn confirm-yes">确认</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.querySelector('.confirm-no').onclick = close;
  overlay.querySelector('.confirm-yes').onclick = () => { close(); onYes(); };
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
}

document.addEventListener('DOMContentLoaded',()=>render());
</script>
</body>
