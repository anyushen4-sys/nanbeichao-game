                                                    var api = typeof electronAPI !== 'undefined' && electronAPI.multiplayer;
                                                    if (!api) return;
                                                    api.onP2PMessage().then(function(r) {
                                                      if (r.ok && r.messages) {
                                                        r.messages.forEach(function(m) {
                                                          var msg;
                                                          try {
                                                            msg = typeof m.data === 'string' ? JSON.parse(m.data) : m.data;
                                                          } catch (e) { return; }
                                                          msg._fromSteamId = m.steamId;
                                                          handleMultiplayerMessage(msg);
                                                        });
                                                      }
                                                    }).catch(function() {});
                                                  }, 100);
                                                }

                                                function stopMultiplayerPolling() {
                                                  if (G._mpPollTimer) {
                                                    clearInterval(G._mpPollTimer);
                                                    G._mpPollTimer = null;
                                                  }
                                                }

                                                /**
                                                 * 多人 leader select / mulligan 流程
                                                 */
                                                function multiplayerPickLeader() {
                                                  if (!G._selectedLeader) return;
                                                  var mp = G._mpState;
                                                  var l = LEADERS_DATA.find(function(x) { return x.id === G._selectedLeader; });
                                                  G.players[mp._myLocalIdx].leader = l;
                                                  G._selectedLeader = null;
                                                  // 本地 leader 确认
                                                  var pkt = packMessage('action', { action: 'leader_pick', data: { leader: l.id, n: l.name } });
                                                  sendP2P(pkt, mp.peerId);
                                                  // 等待对方
                                                  G._mpLeaderPhase = 1;
                                                  showNotification('主将已选，等待对方...', 2000);
                                                  render();
                                                }

                                                /**
                                                 * 玩家换牌确认 (host-authority)
                                                 */
                                                function multiplayerMulliganConfirm(p) {
                                                  var sel = G.mulliganSelected;
                                                  var hand = getHand(p);
                                                  var keeperIdx = new Set();
                                                  sel.forEach(function(idx) { if (idx < hand.length) keeperIdx.add(idx); });
                                                  var i = 0;
                                                  while (i < hand.length) {
                                                    if (keeperIdx.has(i)) { i++; continue; }
                                                    hand.splice(i, 1);
                                                  }
                                                  var cnt = 7 - keeperIdx.size;
                                                  if (cnt > 0) drawCards(p, cnt);
                                                  addLog(t('ui.log.cards_swapped', {count: cnt}));
                                                  G.mulliganSelected = new Set();
                                                  if (p === 0 && G._mpState.isHost) {
                                                    // host 等 guest mulligan
                                                    showNotification('等待对方换牌...', 2000);
                                                    return;
                                                  }

                                                  // 广播换牌结果
                                                  var pkt = packMessage('action', {
                                                    action: 'mulligan_done',
                                                    data: { idx: p, r: cnt }
                                                  });
                                                  sendP2P(pkt, G._mpState.peerId);
                                                  if (G.otherMulliganDone || p !== 0) {
                                                    startMultiplayerGame();
                                                  }
                                                }

                                                function startMultiplayerGame() {
                                                  G._mpPhase = 'game';
                                                  G.activePlayer = G._firstPlayer || 0;
                                                  G.players[0].passed = false; G.players[1].passed = false;
                                                  G.selectedCard = null;
                                                  G.turnCount = 0;
                                                  G.playerTurn = G.activePlayer === 0;
                                                  // 记录 settlement 中…
                                                  G._settlementLogs = [];
                                                  // host 不等待 guest 确认时跳过
                                                  if (!G._mpState.isHost) {
                                                    // guest 等待 host 的 state_diff
                                                  }
                                                  addLog(t('ui.log.battle_start'));
                                                  render();
                                                }

                                                function handleMultiplayerPlayCard(handIdx, row) {
                                                  if (!G.players[0].passed && !G.players[1].passed) {
                                                    if (G._mpState && G.playerTurn) {
                                                      var localIdx = G._mpState.localPlayerIdx !== undefined ? G._mpState.localPlayerIdx :
                                                        (G._mpState._myLocalIdx !== undefined ? G._mpState._myLocalIdx : 0);
                                                      var card = getHand(localIdx)[handIdx];
                                                      if (!card) return;
                                                      if (getCardCost(card.strength) > G.provisions[localIdx]) return;
                                                      if (card.row !== row) return;
                                                      if (!G._mpState.isHost) {
                                                        sendP2P(packMessage('action', {
                                                          type: 'play_card',
                                                          payload: { cardId: card.id, row: row, handIdx: handIdx }
                                                        }), G._mpState.peerId);
                                                        return;
                                                      }
                                                      playCard(localIdx, handIdx, row);
                                                      G.selectedCard = null;
                                                      G.turnCount++;
                                                      G._playerTurn = false;
                                                      checkBothPassed();
                                                    }
                                                  }
                                                }

                                                function multiplayerPassTurn() {
                                                  var p = 0;
                                                  G.players[p].passed = true;
                                                  addLog(t('ui.log.host_pass'));
                                                  G.selectedCard = null;
                                                  if (G._mpState && !G._mpState.isHost) {
                                                    sendP2P(packMessage('action', { action: 'pass', data: { i: p } }), G._mpState.peerId);
                                                  }
                                                  checkBothPassed();
                                                }

                                                function checkBothPassed() {
                                                  if (G.players[0].passed && G.players[1].passed) {
                                                    endMultiplayerRound();
                                                  } else {
                                                    render();
                                                  }
                                                }

                                                function endMultiplayerRound() {
                                                  var pP = getBoardPower(G.players[0].board, 0);
                                                  var aP = getBoardPower(G.players[1].board, 1);
                                                  var winner;
                                                  if (pP > aP) { winner = 0; G.scores[0]++; }
                                                  else if (aP > pP) { winner = 1; G.scores[1]++; }
                                                  else { winner = -1; }
                                                  addLog(t('ui.log.round_end', {round: G.round+1}));
                                                  if (winner === 0) addLog(t('ui.log.you_win_battle', {player: pP, opponent: aP}));
                                                  else if (winner === 1) addLog(t('ui.log.you_lose_battle', {player: pP, opponent: aP}));
                                                  else addLog(t('ui.log.tie_battle', {player: pP, opponent: aP}));
                                                  G._roundResult = { playerPower: pP, aiPower: aP, winner: winner };

                                                  // host sends match_result
                                                  if (G._mpState.isHost) {
                                                    var gameOver = G.scores[0] >= 2 || G.scores[1] >= 2 || G.round >= 3;
                                                    var sh = gameOver ? _computeSettlementHash() : '';
                                                    var msg = packMessage('match_result', {
                                                      winnerIdx: winner,
                                                      finalScore: G.scores,
                                                      settlementHash: sh
                                                    });
                                                    sendP2P(msg, G._mpState.peerId);
                                                  }

                                                  G._mpPhase = 'round_result';
                                                  render();
                                                }

                                                function checkMultiplayerGameEnd() {
                                                  if (G.scores[0] >= 2 || G.scores[1] >= 2 || G.round >= 3) {
                                                    G._mpPhase = 'game_result';
                                                    render();
                                                    var txt = G.scores[0] > G.scores[1] ? '你赢得了天下！' :
                                                      G.scores[0] === G.scores[1] ? t('ui.log.game_over_tie') : '对方赢得了天下！';
                                                    showNotification(txt, 4000);
                                                    return true;
                                                  } else {
                                                    G.round++;
                                                    G.players[0].passed = false; G.players[1].passed = false;
                                                    G.selectedCard = null; G.turnCount = 0;
                                                    G.players[0].board = {infantry:[],cavalry:[],navy:[],strategy:[]};
                                                    G.players[1].board = {infantry:[],cavalry:[],navy:[],strategy:[]};
                                                    G.globalBuffs = {playerArmor:0,aiArmor:0,playerUnify:0,aiUnify:0,ambushTriggered:false,
                                                      playerFarm:0,aiFarm:0,playerBerserkCard:null,aiBerserkCard:null};
                                                    G.graveyard = [];
                                                    G.logs = [];
                                                    G.leaderAbilityUsed = [false, false];
                                                    G.activePlayer = 0;
                                                    G.currentTurn = 'player';
                                                    var drawCount = G.round <= 1 ? 0 : 4;
                                                    if (drawCount > 0) { drawCards(0, drawCount); drawCards(1, drawCount); }
                                                    applyRoundStartAbilities();
                                                    addLog(t('ui.log.round_start', {round: G.round}));
                                                    if (drawCount > 0) addLog(t('ui.log.both_draw', {count: drawCount}));
                                                    G._mpPhase = 'playing';
                                                    render();
                                                    return false;
                                                  }
                                                }

                                                function _computeSettlementHash() {
                                                  var s = '';
                                                  G.logs.slice(-20).forEach(function(l) { s += l; });
                                                  s += 'score:' + G.scores[0] + '-' + G.scores[1];
                                                  return _quickHash(s);
                                                }

                                                function _quickHash(s) {
                                                  var hash = 0;
                                                  for (var i = 0; i < s.length; i++) {
                                                    hash = ((hash << 5) - hash + s.charCodeAt(i)) | 0;
                                                  }
                                                  return 'h' + (hash >>> 0).toString(36);
                                                }

                                                function processMatchResult(payload) {
                                                  // guest 端校验 settlement hash
                                                  G._remoteWinner = payload.winnerIdx;
                                                  var remoteHash = payload.settlementHash || '';
                                                  var localHash = _computeSettlementHash();
                                                  G._mpRemoteHash = remoteHash;
                                                  G._mpLocalHash = localHash;
                                                  if (remoteHash !== localHash) {
                                                    showSettlementToast(remoteHash, localHash);
                                                  }
                                                  G._mpPhase = 'game_result';
                                                  G.scores = payload.finalScore || G.scores;
                                                  G.phase = 'multiplayer_playing';
                                                  render();
                                                }

                                                function showSettlementToast(remoteHash, localHash) {
                                                  // 非阻塞 toast
                                                  var toast = document.createElement('div');
                                                  toast.className = 'mp-settlement-toast';
                                                  toast.innerHTML = '<div class="mp-toast-title">🛡 结算不一致</div>' +
                                                    '<div class="mp-toast-msg">' + t('tui.mp_settlement_msg') + '</div>' +
                                                    '<div class="mp-toast-details">对方: ' + remoteHash + ' vs 你: ' + localHash + '</div>' +
                                                    '<div class="mp-toast-actions">' +
                                                      '<button class="mp-toast-btn" onclick="dismissSettlementToast()">我知道了</button>' +
                                                    '</div>';
                                                  document.body.appendChild(toast);
                                                  setTimeout(function() { if (toast.parentNode) toast.remove(); }, 12000);
                                                }

                                                // 30s 重连等待 UI + concede 投降
                                                G._mpReconnectTimer = null;

                                                function startReconnectWaiting() {
                                                  if (G._mpReconnectTimer) return;
                                                  G._mpReconnectCountdown = 30;
                                                  G._mpReconnectTimer = setInterval(function() {
                                                    G._mpReconnectCountdown--;
                                                    if (G._mpReconnectCountdown <= 0) {
                                                      timeoutReconnect();
                                                    }
                                                    render();
                                                  }, 1000);
                                                }

                                                function stopReconnectTimer() {
  if (G._mpReconnectTimer) {
    clearInterval(G._mpReconnectTimer);
    G._mpReconnectTimer = null;
  }
}

function timeoutReconnect() {
                                                  stopReconnectTimer();
                                                  showNotification('对方超时未响应，判定你获胜', 5000);
                                                  // concede host
                                                  var msg = packMessage('concede', { reason: 'timeout' });
                                                  sendP2P(msg, G._mpState.peerId);
                                                  var localIdx = G._mpState && G._mpState.localPlayerIdx !== undefined ? G._mpState.localPlayerIdx : 0;
                                                  G.scores[localIdx] = 2;
                                                  G._mpPhase = 'game_result';
                                                  G.phase = 'multiplayer_playing';
                                                  render();
                                                }

                                                function multipConcede() {
                                                  var msg = packMessage('concede', { reason: 'forfeit' });
                                                  sendP2P(msg, G._mpState.peerId);
                                                  G.scores[1] = 2;
                                                  G._mpPhase = 'game_result';
                                                  G.phase = 'multiplayer_playing';
                                                  render();
                                                }

                                                // ===== 08: hot-seat — 同机双人完整流程 =====
            function initHotSeat(){
                          // RNG seed 在双方 leader 选完后生成 (spec T8 §5)
                          delete G._rng;  // 清除旧 seed，leader_select 后用 Math.random()
                          G.phase='hot_seat_playing';
                          G.activePlayer=0;
                          G._hsPhase='leader_select';
                          G._hsLeaderPicks=[null,null];
                          G.scores=[0,0]; G.round=0;
                          G.provisions=[30,30];
                          G.leaderAbilityUsed=[false,false];
                          render();
                        }

            function hotSeatPickLeader(){
                          if(!G._selectedLeader)return;
                          var p=G.activePlayer;
                          var l=LEADERS_DATA.find(function(x){return x.id===G._selectedLeader});
                          G._hsLeaderPicks[p]=l;
                          G.players[p].leader=l;
                          G._selectedLeader=null;
                          if(p===0){
                            G.activePlayer=1;
                            showTransferModal(1, t('ui.hotseat.transfer_leader',{player:2}), 'leaderselect');
                            render();
                            return;
                          }
                          // Both done: setup game
                          hotSeatSetup();
                        }

    function hotSeatSetup(){
                  // Called after both leaders confirmed
                  // RNG seed: 双方 leader 选完后再生成 (spec T8 §5)
                  const p0=G.players[0].leader, p1=G.players[1].leader;
                  G.players[0].deck=buildDeck(p0.faction);
                  G.players[1].deck=buildDeck(p1.faction);
                  applyLeaderDeckAbility(p0,G.players[0].deck);
                  applyLeaderDeckAbility(p1,G.players[1].deck);
                  G.scores=[0,0]; G.round=0;
                  G.players[0].passed=false; G.players[1].passed=false;
                  G.selectedCard=null; G.logs=[]; G.turnCount=0;
                  G.globalBuffs={playerArmor:0,aiArmor:0,playerUnify:0,aiUnify:0,ambushTriggered:false,
                    playerFarm:0,aiFarm:0,playerBerserkCard:null,aiBerserkCard:null};
                  G.graveyard=[];
                  G.mulliganSelected=new Set();
                  G.leaderAbilityUsed=[false,false];
                                    // 双方依次换牌 (玩家1 先 → 玩家2 后) — 不随机先手
                                    G.activePlayer=0;
                                    // 生成确定性 RNG seed（用于对局内所有随机调用）
                                    const seed=Math.floor(Math.random()*2147483647);
                                    G._rng=rngFromSeed(seed);
                                    // Mulligan-like: both draw 7
                                    drawCards(0,7); drawCards(1,7);
                                    G._hsPhase='mulligan';
                                    G._firstPlayer=0;
                                    addLog(t('ui.log.hotseat_mulligan'));
                                    addLog(t('ui.log.hotseat_p1_first'));
                                    render();
                                  }

                              function hotSeatConfirmMulligan(){
                                                                var p=G.activePlayer;
                                                                var hand=getHand(p);
                                                                // 玩家 1 模式: 删除未保留的牌 + 每删一张补一张 (与 AI 对战 confirmMulligan 一致)
                                                                var sortedIdx=Array.from(G.mulliganSelected||new Set()).sort(function(a,b){return b-a});
                                                                var cnt=sortedIdx.length;
                                                                if(cnt>0){
                                                                  sortedIdx.forEach(function(idx){
                                                                    if(hand.length>idx) hand.splice(idx,1);
                                                                    drawCards(p,1);
                                                                  });
                                                                }else{
                                                                  // 玩家没选任何保留 — 按 spec 默认换 3 张
                                                                  for(var k=0;k<3&&hand.length>0;k++){
                                                                    hand.splice(0,1);
                                                                    drawCards(p,1);
                                                                  }
                                                                  cnt=3;
                                                                }
                                                                addLog((p===0?t('ui.hotseat.player1_label'):t('ui.hotseat.player2_label'))+'换了'+cnt+'张牌');
                                                                G.mulliganSelected=new Set();
                                                                // 玩家1 换完 → 切到玩家2
                                                                if(G.activePlayer===0){
                                                                  G.activePlayer=1;
                                                                  showTransferModal(1,t('ui.hotseat.transfer_mulligan',{player:2}),'mulligan');
                                                                  render();
                                                                  return;
                                                                }
                                                                // 玩家2 换完 → 随机决定先手 + 进入 game
                                                                                                  G._firstPlayer=Math.floor(Math.random()*2);
                                                                                                  G.round=0;
                                                                                                  G._hsPhase='game';
                                                                                                  G.activePlayer=G._firstPlayer;
                                                                                                  G.players[0].passed=false; G.players[1].passed=false;
                                                                                                  G.selectedCard=null;
                                                                                                  G.turnCount=0;
                                                                                                  addLog(t('ui.log.mulligan_end_p') + (G._firstPlayer+1)+'先手 ═══');
                                                                                                  render();
                                                                                                  // 双方移交控制: 先手方需点"开始我的回合"才能进入主界面
                                                                                                  showTransferModal(G._firstPlayer,t('ui.hotseat.transfer_turn',{player:G._firstPlayer+1}),'gamestart');
                                                                                                }

            function hotSeatToggleMulligan(idx){
              if(G.mulliganSelected.has(idx)) G.mulliganSelected.delete(idx);
              else G.mulliganSelected.add(idx);
              render();
            }

            function hotSeatPassTurn(){
                          const a=G.activePlayer;
                          G.players[a].passed=true;
                          addLog((a===0?t('ui.hotseat.player1_label'):t('ui.hotseat.player2_label'))+'放弃了本局');
                          G.selectedCard=null;
                          const b=1-a;
                          if(G.players[b].passed){
                            hotSeatEndRound();
                          }else{
                            G.activePlayer=b;
                            showTransferModal(b,t('ui.hotseat.transfer_turn',{player:b+1}),'turnevent');
                            render();
                          }
                        }

            function hotSeatEndRound(){
              const pP=getBoardPower(G.players[0].board,0);
              const aP=getBoardPower(G.players[1].board,1);
              let winner;
              if(pP>aP){winner=0;G.scores[0]++}
              else if(aP>pP){winner=1;G.scores[1]++}
              else{winner=-1}
              addLog(t('ui.log.round_end', {round: G.round}));
              if(winner===0) addLog(t('ui.log.hotseat_p1_win', {p1: pP, p2: aP}));
              else if(winner===1) addLog(t('ui.log.hotseat_p2_win', {p1: pP, p2: aP}));
              else addLog(t('ui.log.hotseat_tie', {p1: pP, p2: aP}));
              G._roundResult={playerPower:pP,aiPower:aP,winner};
              G._hsPhase='round_result';
              render();
            }

            function hotSeatCheckGameEnd(){
              if(G.scores[0]>=2||G.scores[1]>=2||G.round >= 3){
                G._hsPhase='game_result';
                render();
                const txt=G.scores[0]>G.scores[1]?'玩家1赢得了天下！':
                  G.scores[0]===G.scores[1]?t('ui.log.game_over_tie'):'玩家2赢得了天下！';
                showNotification(txt,3000);
              }else{
                G.round++;
                G.players[0].passed=false; G.players[1].passed=false;
                G.selectedCard=null; G.turnCount=0;
                G.players[0].board={infantry:[],cavalry:[],navy:[],strategy:[]};
                G.players[1].board={infantry:[],cavalry:[],navy:[],strategy:[]};
                G.globalBuffs={playerArmor:0,aiArmor:0,playerUnify:0,aiUnify:0,ambushTriggered:false,
                  playerFarm:0,aiFarm:0,playerBerserkCard:null,aiBerserkCard:null};
                G.graveyard=[];
                G.logs=[];
                G.leaderAbilityUsed=[false,false];
                G.activePlayer=0;
                G.currentTurn='player';
                const drawCount=G.round<=1?0:4;
                if(drawCount>0){drawCards(0,drawCount);drawCards(1,drawCount);}
                applyRoundStartAbilities();
                addLog(t('ui.log.round_start', {round: G.round}));
                if(drawCount>0) addLog(t('ui.log.both_draw', {count: drawCount}));
                G._hsPhase='game';
                render();
              }
            }

            function hotSeatPlayCard(handIdx,row){
                          if(G._hsPhase!=='game')return;
                          const a=G.activePlayer;
                          const card=getHand(a)[handIdx];
                          if(!card)return;
                          if(getCardCost(card.strength)>G.provisions[a])return;
                          if(card.row!==row)return;
                          playCard(a,handIdx,row);
                          G.selectedCard=null;
                          G.turnCount++;
                          // check if opponent has any playable card
                          const opp=1-a;
                          if(!hasPlayableCard(opp)){
                            G.players[opp].passed=true;
                            addLog(t('ui.log.player_no_cards', {player: opp+1}));
                          }
                          if(G.players[0].passed&&G.players[1].passed){
                            hotSeatEndRound();
                          }else{
                            // Switch player
                            let next=1-a;
                            // Skip passed player
                            if(G.players[next].passed) next=1-next;
                            if(G.players[next].passed){
                              hotSeatEndRound();
                            return;
                            }
                            G.activePlayer=next;
                            // force re-render game + modal overlay
                            render();
                            showTransferModal(next,t('ui.hotseat.transfer_turn',{player:next+1}),'turnevent');
                          }
                        }

            function showTransferModal(playerIdx, msg, reason){
                                      // transfer-modal: 全屏遮罩 + 玩家 N 头像 + 「开始我的回合」按钮 (spec T8 §3)
                                      // 防御: 先删除旧 overlay 防止重复
                                      const old=document.getElementById('hs-transfer-overlay');
                                      if(old) old.remove();
                                      const overlay=document.createElement('div');
                                      overlay.className='transfer-modal-overlay';
                                      overlay.id='hs-transfer-overlay';
                                      const colors=['#4A90D9','#E23E57'];
                                      const icons=['🔵','🔴'];
                                      overlay.innerHTML='<div class="transfer-modal">'+
                                        '<div class="transfer-player-icon" style="color:'+colors[playerIdx]+'">'+
                                        icons[playerIdx]+'</div>'+
                                        '<div class="transfer-title" style="color:'+colors[playerIdx]+'">'+
                                        t('ui.hotseat.player_label',{n:playerIdx+1})+'</div>'+
                                        '<div class="transfer-msg">'+msg+'</div>'+
                                        '<button class="transfer-btn" onclick="transferConfirm()">'+
                                        t('ui.hotseat.transfer_btn')+'</button>'+
                                        '</div>';
                                      document.body.appendChild(overlay);
                                    }

                        function transferConfirm(){
                                      var overlay=document.getElementById('hs-transfer-overlay');
                                      if(overlay) overlay.remove();
                                      render();
                                    }

            function renderHotSeatPlaying(el){
                          var hs=G._hsPhase||"";
                          // --- LEADER SELECT ---
                          if(hs==="leader_select"){
                            var p=G.activePlayer;
                            var avail=LEADERS_DATA.filter(function(l){return !G._hsLeaderPicks.some(function(x){return x&&x.id===l.id})});
                            var cardsHtml=avail.map(function(l){
                              var f=FACTIONS[l.faction];
                              var fc=f.color;
                              var sel=G._selectedLeader===l.id;
                              return'<div class="leader-card'+(sel?' selected':'')+'" style="--fc:'+fc+';--fc22:'+fc+'22;--fc11:'+fc+'11;cursor:pointer" onclick="G._selectedLeader='+l.id+';render()">'+
                                '<div class="leader-portrait">'+
                                  '<img src="assets/leaders/leader_L'+l.id+'.png" alt="'+ln(l)+'" onerror="leaderImgFallback(this,\'assets/leaders/leader_L'+l.id+'.png\',\''+fc+'\',\''+ln(l)[0]+'\')" loading="eager" decoding="async"/>'+
                                  '<div class="placeholder-block">'+(ln(l)[0]||'?')+'</div>'+
                                '</div>'+
                                '<div class="leader-info">'+
                                  '<div class="era">'+(l.era_en||l.era)+'</div>'+
                                  '<div class="name">'+ln(l)+'</div>'+
                                  '<span class="faction-tag">'+getFactionName(l.faction)+'</span>'+
                                  '<div class="ability">✦ '+ld(l)+'</div>'+
                                '</div>'+
                              '</div>';
                            }).join('');
                            el.innerHTML='<div class="leader-select">'+
                                                          '<h2>👥 '+t('ui.hotseat.select_leader_title',{player:p+1})+'</h2>'+
                                                          '<p class="subtitle">' + t(G._selectedLeader?'ui.hotseat.confirm_leader_hint':'ui.hotseat.select_leader_hint') + '</p>'+
                                                          '<div class="leader-grid">'+cardsHtml+'</div>'+
                                                          '<div style="text-align:center;margin:20px">'+
                                                            '<button class="btn btn-primary btn-confirm-leader" onclick="hotSeatPickLeader()" '+(G._selectedLeader?'':'disabled')+'>' + t('ui.hotseat.player_label',{n:p+1}) + ' ' + t(G._selectedLeader?'ui.hotseat.confirm_leader':'ui.leader.select_hint') + '</button>'+
                                                          '</div>'+
                                                        '</div>';
                            return;
                          }
              // === MULLIGAN ===
              if(hs==="mulligan"){
                              var a=G.activePlayer;
                              var hnd=G.players[a].hand.filter(function(c){return c;});
                              var sel=G.mulliganSelected;
                              var cardsHtml=hnd.map(function(c,i){
                                var picked=sel.has(i);
                                var f=FACTIONS[c.faction];
                                var cost=getCardCost(c.strength);
                                var rowName=getRowName(c.row);
                                var desc=(cd(c)||'')+(c.protectArmor?' 🛡'+c.protectArmor:'');
                                return'<div class="card '+(picked?'selected':'')+'" onclick="hotSeatToggleMulligan('+i+')" title="'+cn(c)+' - '+cd(c)+'" '+
                                  'style="--faction-color:'+f.color+';--faction-glow:'+f.color+'40;cursor:pointer;width:96px;min-width:96px;max-width:96px;flex:0 0 96px;'+(picked?'transform:translateY(-8px);':'')+'">'+
                                  '<div class="card-cost">'+cost+'</div>'+
                                  '<div class="card-illustration"><img src="'+(CARD_DATA_URIS[c.id]||('assets/cards/card_'+c.id+'.png'))+'" alt="'+cn(c)+'"/><div class="card-art-fallback" style="display:none!important">'+cn(c)+'</div></div>'+
                                  '<div class="card-name">'+cn(c)+'</div>'+
                                  '<div class="card-tags"><span class="card-type-tag">'+rowName+'</span></div>'+
                                  '<div class="card-ability">'+desc+'</div>'+
                                  '<div class="card-stats-bar"><span class="card-atk">⚔ '+c.strength+'</span></div>'+
                                '</div>';
                              }).join('');
                              el.innerHTML='<div class="leader-select">'+
                                '<h2>👥 '+t('ui.hotseat.mulligan_title',{player:a+1})+'</h2>'+
                                '<p class="subtitle">' + t('ui.hotseat.mulligan_hint',{count:sel.size}) + '</p>'+
                                '<div class="hand-cards" style="justify-content:flex-start;flex-wrap:wrap;gap:10px;padding:16px">'+
                                cardsHtml+
                                '</div>'+
                                '<div style="text-align:center;margin-top:20px">'+
                                  '<button class="btn btn-primary" onclick="hotSeatConfirmMulligan()">'+t('ui.hotseat.confirm_mulligan',{count:sel.size})+'</button>'+
                                '</div>'+
                              '</div>';
                              return;
                          }
            // === GAME ===
            if(hs==="game"){
                renderHotSeatGame(el);
                return;
            }
            // === ROUND RESULT ===
                        if(hs==="round_result"){
                            var rr=G._roundResult;
                            var pWin=rr.winner===0;
                            var aWin=rr.winner===1;
                            var tie=rr.winner===-1;
                            G.phase='hot_seat_playing';
                            var wTxt=pWin?'玩家1胜利！':aWin?'玩家2胜利！':'平局！';
                            el.innerHTML='<div class="round-result">'+
                              '<h2>' + t('ui.round_result.title',{round:G.round}) + '</h2>'+
                              '<div class="power-compare">'+
                                '<div class="power-row">'+
                                  '<div class="power-side '+(pWin?'win-side':'lose-side')+'">'+
                                    '<div class="power-label">'+t('ui.hotseat.player1_power')+'</div>'+
                                    '<div class="power-val '+(pWin?'win':'lose')+'">'+rr.playerPower+'</div>'+
                                  '</div>'+
                                  '<div class="power-vs-wrap">'+
                                    '<div class="power-vs">VS</div>'+
                                  '</div>'+
                                  '<div class="power-side '+(aWin?'win-side':'lose-side')+'">'+
                                    '<div class="power-label">'+t('ui.hotseat.player2_power')+'</div>'+
                                    '<div class="power-val '+(aWin?'win':'lose')+'">'+rr.aiPower+'</div>'+
                                  '</div>'+
                                '</div>'+
                                '<div class="power-bar-bg">'+
                                  '<div class="power-bar-fill '+(pWin?'bar-win':aWin?'bar-lose':'')+'" style="width:'+(pWin?'100%':'0%')+'"></div>'+
                                  '<div class="power-bar-divider"></div>'+
                                '</div>'+
                              '</div>'+
                              '<div class="result-text '+(pWin?'result-win':aWin?'result-lose':'result-tie')+'">'+wTxt+'</div>'+
                              '<div class="result-score">' + t('ui.round_result.score',{s0:G.scores[0],s1:G.scores[1]}) + '</div>'+
                              '<button class="btn btn-primary btn-result" onclick="hotSeatCheckGameEnd()">'+(G.scores[0]>=2||G.scores[1]>=2||G.round >= 3?t('ui.round_result.view_final'):t('ui.round_result.next_round'))+'</button>'+
                            '</div>';
                            return;
                        }
            // === GAME RESULT ===
                        if(hs==="game_result"){
                            var winner=G.scores[0]>G.scores[1]?0:G.scores[0]===G.scores[1]?-1:1;
                            var p1Win=winner===0;
                            var p2Win=winner===1;
                            var tie=winner===-1;
                            el.innerHTML='<div class="game-result">'+
                              '<div class="menu-seal-hs" style="margin:0 auto 30px">'+(t(p1Win?'ui.hotseat.player1_win':p2Win?'ui.hotseat.player2_win':'ui.hotseat.draw_round'))+'</div>'+
                              '<h1 class="'+(p1Win?'victory':p2Win?'defeat':'draw')+'">'+(t(p1Win?'ui.game_result.victory_title':p2Win?'ui.game_result.defeat_title':'ui.game_result.draw_title'))+'</h1>'+
                              '<div class="final-score">'+G.scores[0]+' : '+G.scores[1]+'</div>'+
                              '<div class="detail">'+
                                ln(G.players[0].leader)+'（'+getFactionName(G.players[0].leader.faction)+'）VS '+
                                ln(G.players[1].leader)+'（'+getFactionName(G.players[1].leader.faction)+'）'+
                              '</div>'+
                              '<div class="decorative-line" style="width:200px;margin:20px auto"></div>'+
                              '<p style="color:#8B7355;margin:20px 0 30px;letter-spacing:2px;line-height:1.8">'+
                                (t(p1Win?'ui.game_result.victory_message':tie?'ui.game_result.draw_message':'ui.game_result.defeat_message'))+
                              '</p>'+
                              '<button class="btn btn-primary" onclick="resetGame()">' + t('ui.game_result.play_again') + '</button>'+
                            '</div>';
                            return;
                        }
            // Default fallback
            el.innerHTML='<div class="hot-seat-playing"><h2>' + t('ui.hotseat.loading') + '</h2><p>' + t('ui.hotseat.loading') + '</p></div>';
        }

        function renderHotSeatGame(el){
                    var act=G.activePlayer;
                    var p0=G.players[0], p1=G.players[1];
                    var f0=FACTIONS[p0.leader.faction], f1=FACTIONS[p1.leader.faction];
                    var pow0=getBoardPower(p0.board,0), pow1=getBoardPower(p1.board,1);
                    var isP1=act===0;
                    var appearText=isP1?t('ui.game.your_turn'):t('ui.game.opponent_turn');
                    var handClass=isP1?'your-turn':'ai-turn';
                    var lastUid=G._lastPlayedUid||null;
                    var lastR=G._lastPlayedBy||null;

                    function renderPips(v,m,cls){
                        var h='';
                        for(var i=0;i<m;i++){
                            var filled=i<v?'filled '+cls:'';
                            h+='<div class="pip '+filled+'"></div>';
                        }
                        return h;
                    }

                    el.innerHTML='<div id="game-screen" class="hot-seat-playing">'+
                        '<div class="game-header">'+
                        '<div class="player-info" style="text-align:left">'+
                          '<div class="name" style="color:'+f0.color+'">玩家1</div>'+
                  '<div class="leader">'+ln(p0.leader)+'</div>'+
                  '<div class="provisions-bar">'+
                    '<span class="label">粮草</span>'+
                    '<div class="pips">'+renderPips(G.provisions[0],30,'player')+'</div>'+
                    '<span class="count">'+G.provisions[0]+'</span>'+
                  '</div>'+
                  '<div style="font-size:0.85em;color:#B8B8D1;font-weight:500">🃏 '+(act===0?p0.hand.length+' 张手牌':'')+'</div>'+
                '</div>'+
                '<div class="score-center">'+
                  '<div class="rounds">第 '+G.round+' / 3 局</div>'+
                  '<div class="score">'+G.scores[0]+' : '+G.scores[1]+'</div>'+
                  '<div class="rounds-won">玩家1 '+G.scores[0]+'胜 · 玩家2 '+G.scores[1]+'胜</div>'+
                '</div>'+
                '<div class="player-info" style="text-align:right">'+
                  '<div class="name" style="color:'+f1.color+'">玩家2</div>'+
                  '<div class="leader">'+ln(p1.leader)+'</div>'+
                  '<div class="provisions-bar">'+
                    '<span class="label">粮草</span>'+
                    '<div class="pips">'+renderPips(G.provisions[1],30,'ai')+'</div>'+
                    '<span class="count">'+G.provisions[1]+'</span>'+
                  '</div>'+
                  '<div style="font-size:0.85em;color:#B8C9D1;font-weight:500">🃏 '+(act===1?p1.hand.length+' 张手牌':'')+'</div>'+
                '</div>'+
              '</div>'+
              '<div class="battlefield-wrap game-content">'+
                '<div class="battlefield-bg"><img src="assets/battlefield_bg.jpg" alt=""/></div>'+
                '<div class="battlefield">'+
                  '<div class="board-section ai-rows"><div class="section-label">' + t('ui.hotseat.player2_side',{power:pow1}) + '</div>'+
                    renderRow('navy',p1.board.navy,false,lastUid,lastR)+
                    renderRow('cavalry',p1.board.cavalry,false,lastUid,lastR)+
                    renderRow('infantry',p1.board.infantry,false,lastUid,lastR)+
                    renderRow('strategy',p1.board.strategy,false,lastUid,lastR)+
                  '</div>'+
                  '<div class="decorative-line"></div>'+
                  '<div class="board-section player-rows">'+
                    '<div class="section-label">' + t("ui.hotseat.player1_side",{power:pow0}) + '</div>' +
                    renderRow('infantry',p0.board.infantry,true,lastUid,lastR)+
                    renderRow('cavalry',p0.board.cavalry,true,lastUid,lastR)+
                    renderRow('navy',p0.board.navy,true,lastUid,lastR)+
                    renderRow('strategy',p0.board.strategy,true,lastUid,lastR)+
                  '</div>'+
                '</div>'+
              '</div>'+
              '<div class="turn-indicator">'+
                '<span class="'+handClass+'">'+appearText+'</span>'+
                (p0.passed&&!p1.passed?'<span class="waiting"> · 对手已放弃，等待你</span>':'')+
              '</div>'+
                            '<div class="hand-area">'+
                            ((act===0)?'<div class="hand-label">' + t('ui.hotseat.player1_hand',{count:p0.hand.length}) + '</div>':'')+
                            '<div class="hand-cards'+(p0.hand.length===0?' empty':'')+
                                (p0.hand.length>=5?' many-cards':'')+
                                (p0.hand.length>=7?' overflow-cards':'')+'">'+
                                (act!==0?
                                  '<div class="hs-hidden-hand">'+
                                    '<div class="hs-hidden-icon">🔒</div>'+
                                    '<div class="hs-hidden-text">对方回合中</div>'+
                                  '</div>':
                                  (p0.hand.length===0?'<span style="color:#B8A88A">' + t("ui.game.no_hand") + '</span>':
                                                                      p0.hand.map(function(c,i){return handleHotSeatHandCard(c,i,act)}).join(''))) +
                              '</div>'+
                            '</div>'+
                            '<div class="hand-area">'+
                                          ((act===1)?'<div class="hand-label">' + t('ui.hotseat.player2_hand',{count:p1.hand.length}) + '</div>':'')+
                                          '<div class="hand-cards'+(p1.hand.length===0?' empty':'')+
                                            (p1.hand.length>=5?' many-cards':'')+
                                            (p1.hand.length>=7?' overflow-cards':'')+'">'+
                                            (act!==1?
                                              '<div class="hs-hidden-hand">'+
                                                '<div class="hs-hidden-icon">🔒</div>'+
                                                '<div class="hs-hidden-text">对方回合中</div>'+
                                              '</div>':
                                              (p1.hand.length===0?'<span style="color:#B8A88A">' + t("ui.game.no_hand") + '</span>':
                                                p1.hand.map(function(c,i){return handleHotSeatHandCard(c,i,1)}).join('')))+
                                          '</div>'+
                                        '</div>'+
                                        '<div class="action-bar">'+
                                          '<button class="btn btn-sm btn-primary" onclick="useLeaderAbility('+act+')" '+
                                            (G.leaderAbilityUsed[act]?'disabled':'')+'>'+
                                            (G.leaderAbilityUsed[act]?'已使用':'主将技能')+' · '+ln(G.players[act].leader)+'</button>'+
                                          '<button class="btn btn-sm btn-pass" onclick="hotSeatPassTurn()">'+t('ui.hotseat.pass_round')+'</button>'+
                                                                                   '</div>'+
                                                                                   '<div class="log-area">'+
                                                                                                                                                 (G.logs||[]).slice(-4).map(function(l){return'<div class="log-entry">'+l+'</div>'}).join('')+
                                                                                                                                               '</div>'+
                                                                                                                                                                                             '</div>';
                                                                                                                                                                     }

        function handleHotSeatHandCard(card,idx,activeIdx){
            var f=FACTIONS[card.faction];
            var cost=getCardCost(card.strength);
            var myTurn=G.activePlayer===activeIdx;
            var playable=myTurn&&!G.players[activeIdx].passed&&cost<=G.provisions[activeIdx];
            var selected=myTurn&&G.selectedCard===idx;
            var cls=selected?'selected':(!playable?'unplayable':'');
            var rowName=getRowName(card.row);
            var desc=(cd(card)||'')+(card.protectArmor?' 🛡'+card.protectArmor:'');
            return'<div class="card '+cls+'" '+(myTurn?'onclick="onCardClick('+idx+')" ':'')+
              'title="'+cn(card)+' - '+rowName+'" style="'+
              '--faction-color:'+f.color+';--faction-glow:'+f.color+'40;width:96px;min-width:96px;max-width:96px;flex:0 0 96px;overflow:hidden">'+
              '<div class="card-cost">'+cost+'</div>'+
              '<div class="card-illustration"><img src="'+(CARD_DATA_URIS[card.id]||'assets/cards/card_'+card.id+'.png')+
                '" alt="'+cn(card)+'"/></div>'+
              '<div class="card-name">'+cn(card)+'</div>'+
              '<div class="card-tags"><span class="card-type-tag">'+rowName+'</span></div>'+
              '<div class="card-ability">'+desc+'</div>'+
              '<div class="card-stats-bar"><span class="card-atk">⚔ '+card.strength+'</span></div>'+
            '</div>';
        }

            function resetGame(){
              uid=0;
              G.phase='menu';G._menuScreen='main';G.round=0;G.scores=[0,0];
              G.players[0].leader=null;G.players[1].leader=null;
              G.players[0].deck=[];G.players[1].deck=[];
              G.players[0].hand=[];G.players[1].hand=[];
              G.players[0].board={infantry:[],cavalry:[],navy:[],strategy:[]};
              G.players[1].board={infantry:[],cavalry:[],navy:[],strategy:[]};
              G.provisions=[30,30];G.currentTurn='player';
              G.players[0].passed=false;G.players[1].passed=false;
              G.selectedCard=null;G.logs=[];G.turnCount=0;
              G.globalBuffs={playerArmor:0,aiArmor:0,playerUnify:0,aiUnify:0,ambushTriggered:false,playerFarm:0,aiFarm:0,playerBerserkCard:null,aiBerserkCard:null};
              G.graveyard=[];
              G._selectedLeader=null;G._roundResult=null;G._lastPlayedBy=null;
              G.mulliganSelected=new Set();G.leaderAbilityUsed=[false,false];
              // Clear hot-seat state
                            delete G.activePlayer; delete G._hsPhase; delete G._hsLeaderPicks;
                            delete G._rng; delete G._firstPlayer;
                            // Clear p2p state
                            delete G._p2pState;
              render();
            }

// 全局多人辅助函数
function toggleMulligan(idx) {
  if (!G.mulliganSelected) G.mulliganSelected = new Set();
  if (G.mulliganSelected.has(idx)) G.mulliganSelected.delete(idx);
  else G.mulliganSelected.add(idx);
  // No auto render — caller must render
}

function dismissSettlementToast() {
  var t = document.querySelector('.mp-settlement-toast');
  if (t) t.remove();
}

function startMultiplayerHost() {
  console.log('[host] ENTRY');
  G._mpState = G._mpState || {};
  G._mpState._host = 'host';
  G._mpState._status = 'connecting';
  G._mpState._myLocalIdx = 0;
  G._mpState.peerId = null;
  G.phase = 'multiplayer_lobby';
  startMultiplayerPolling();
  render(); // 立即同步 UI (connecting 状态)
  console.log('[host] status=' + G._mpState._status + ', hasEAPI=' + (typeof electronAPI !== 'undefined'));
  // Try to open invite dialog
  if (typeof electronAPI !== 'undefined' && electronAPI.multiplayer) {
    console.log('[host] calling openInviteDialog'); electronAPI.multiplayer.openInviteDialog().then(function(r) {
      // r.ok=false 通常是 steam_not_running (dev 模式无 Steam)
      // 在这种模式下, 我们跳过 waiting_invite 阶段, 但保留 connecting 状态让 polling
      // 检测到 peerQueue 中的消息即可触发 connected (mock 会自动 fill peerQueue)
      console.log('[host] openInviteDialog RESOLVED, r.ok=' + r.ok + ', r=' + JSON.stringify(r));
      if (r.ok) {
        // Dev mock: main.js IPC 返回 ok=true, 直接跳 connected (单人模式自模拟)
        G._mpState._peerName = 'Mock对手(guest)';
        G._mpState.peerId = 'mock-guest';
        G._mpState._status = 'connected';
        render();
      }
    }).catch(function(e) {
      console.log('[host] CATCH: ' + (e && e.message));
      // IPC 调用失败, polling 也会继续, 等 mock 模拟
    });
  }
}

function joinMultiplayerRoom() {
  G._mpState = G._mpState || {};
  G._mpState._host = 'guest';
  G._mpState._status = 'connecting';
  G._mpState._myLocalIdx = 1;
  G.phase = 'multiplayer_lobby';
  startMultiplayerPolling();
  render();
  showNotification('等待游戏邀请...', 2500);
  // Dev mock: 自动配对 (HOST 已经 AUTO-HOST 设了 connected), 我们也设 connected
  // 实际游戏中 join 是被动接收 — dev 模式直接同步
  setTimeout(function(){
    if(G._mpState && G._mpState._status==='connecting'){
      G._mpState._peerName='Mock对手(host)';
      G._mpState.peerId='mock-host';
      G._mpState._status='connected';
      render();
    }
  },300);
}

function cancelMultiplayerInvite() {
  if (G._mpState) G._mpState._status = 'idle';
  stopMultiplayerPolling();
  render();
}

function startLeaderSelect() {
  G._mpState._status = 'picking_leader';
  G._mpPhase = 'leader_select';
  startMultiplayerPolling();
  G.phase = 'multiplayer_playing';
  render();
}

function showMultiplayerMenu() {
  G._mpState = G._mpState || {};
  G._mpState._status = 'idle';
  G._mpState._myLocalIdx = 0;
  G.phase = 'multiplayer_lobby';
  render();
}

function showConfirmModal(title, msg, onYes){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-modal-overlay';
  overlay.innerHTML = `<div class="confirm-modal">
    <div class="confirm-title">${title}</div>
    <div class="confirm-msg">${msg}</div>
    <div class="confirm-btns">
      <button class="confirm-btn confirm-no">${t("ui.dialog.cancel")}</button>
      <button class="confirm-btn confirm-yes">${t("ui.dialog.confirm")}</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.querySelector('.confirm-no').onclick = close;
  overlay.querySelector('.confirm-yes').onclick = () => { close(); onYes(); };
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
}

document.addEventListener('DOMContentLoaded',()=>{
  // Initialize i18n first, then render
  if (window.initLocale) {
    window.initLocale().then(function() {
      // Sync currentLocale after init
      if (window.Locale && window.Locale.getLocale) {
        window.currentLocale = window.Locale.getLocale();
      } else {
        window.currentLocale = 'zh-CN';
      }
      render();
    }).catch(function() {
      // fallback: render with default inline t()
      window.currentLocale = 'zh-CN';
      render();
    });
  } else {
    render();
  }
});
</script>
