<script>
// ===== 确定性 RNG 模块 (mulberry32) =====
// rngFromSeed(seed: number) → { next(): float[0,1), shuffle(arr), pick(arr) }
function rngFromSeed(seed){
  let state=seed|0;
  // mulberry32: fast, good distribution, 32-bit state
  function next(){
    state|=0; state=state+0x6D2B79F5|0;
    let t=Math.imul(state^state>>>15,1|state);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  }
  return{
    next,
    shuffle(arr){
      const a=arr.slice();
      for(let i=a.length-1;i>0;i--){
        const j=Math.floor(next()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
      }
      return a;
    },
    pick(arr){return arr[Math.floor(next()*arr.length)]}
  };
}

function random(){
  return (window.G&&G._rng)?G._rng.next():Math.random();
}

function getCardCategory(card){
  if(!card.ability) return 'commander';
  const abilityType=card.ability.split(':')[0];
  if(abilityType==='boost_row'||abilityType==='weaken_row'||abilityType==='discard'||abilityType==='combo_boost'||abilityType==='destroy'||abilityType==='resurrect'||abilityType==='protect'||abilityType==='spy'||abilityType==='draw_extra') return 'strategy';
  if(abilityType==='draw'||abilityType==='gain_provisions') return 'weather';
  return 'commander';
}

function getCardRarity(card){
  if(card.strength>=8) return 'gold';
  if(card.strength>=6) return 'purple';
  if(card.strength>=4) return 'blue';
  return 'gray';
}

function getCategoryIcon(card){
  return ROW_ICONS[getCardCategory(card)];
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function buildDeck(faction){
  const fc=CARDS_DATA.filter(c=>c.faction===faction);
  const commonCards=CARDS_DATA.filter(c=>c.faction==='common');
  shuffle(commonCards);
  const deck=[...fc,...commonCards];
  shuffle(deck);
  return deck.map(c=>makeCard(c));
}

function applyLeaderDeckAbility(leader,deck){
  const a=leader.ability;
  if(a.type==='row_boost') deck.forEach(c=>{if(c&&c.row===a.row)c.strength+=a.value});
  if(a.type==='all_boost') deck.forEach(c=>{if(c)c.strength+=a.value});
}

function applyRoundStartAbilities(){
  applyLeaderAbilityForRound(G.players[0].leader,0);
  applyLeaderAbilityForRound(G.players[1].leader,1);
}

function applyLeaderAbilityForRound(leader,playerIdx){
  if(!leader)return;
  const a=leader.ability;
  if(a.type==='extra_draw') drawCards(playerIdx,a.value);
  if(a.type==='extra_provisions') G.provisions[playerIdx]+=a.value;
  if(a.type==='opponent_discard'){
    const opp=1-playerIdx;
    const h=getHand(opp);
    for(let i=0;i<a.value&&h.length>0;i++){
      const idx=Math.floor(random()*h.length);
      addLog(t('ui.log.ability_discard', {leader: ln(leader), who: opp===0?t('ui.log.you'):t('ui.log.ai'), card: cn(h[idx])}));
      h.splice(idx,1);
    }
  }
  if(a.type==='row_boost' && a.row==='any'){
    const myBoard=getBoard(playerIdx);
    const rows=['infantry','cavalry','navy','strategy'];
    let maxPower=-1,bestRow='infantry';
    rows.forEach(r=>{
      const p=getRowPower(myBoard[r],playerIdx);
      if(p>maxPower){maxPower=p;bestRow=r}
    });
    myBoard[bestRow].forEach(c=>{if(c)c.strength+=a.value});
    addLog(t('ui.log.ability_row_buff', {leader: ln(leader), row: getRowName(bestRow), value: a.value}));
  }
}

function getHandSafe(p){

  return getHand(p).filter(c=>c&&typeof c==='object');

function getDeck(p){return G.players[p].deck}
function getBoard(p){return G.players[p].board}
function getBoardSafe(p){
  const b=getBoard(p);
  const clean=r=>Array.isArray(r)?r.filter(c=>c&&typeof c==='object'):[];
  return{infantry:clean(b.infantry),cavalry:clean(b.cavalry),navy:clean(b.navy),strategy:clean(b.strategy)};
}

function drawCards(playerIdx,count){
  // 不能用 getHand() 因为它返回 .filter() 的新数组, push 会失败
  // 直接引用 G.players[playerIdx].hand 数组
  const realHand=G.players[playerIdx].hand;
  const deck=G.players[playerIdx].deck;
  for(let i=0;i<count&&realHand.length<10&&deck.length>0;i++) realHand.push(deck.shift());
}

const _comboToastQueue=[];
function showComboToast(title,desc,dur=2500){
  const el=document.createElement('div');
  el.className='combo-toast';
  el.innerHTML=`<div class="combo-toast-title">${title}</div><div class="combo-toast-desc">${desc}</div>`;
  Object.assign(el.style,{
    position:'fixed',top:'80px',left:'50%',transform:'translateX(-50%)',
    background:'linear-gradient(135deg, rgba(218,165,32,0.95), rgba(184,134,11,0.95))',
    color:'#1a1a1a',padding:'16px 32px',borderRadius:'8px',
    border:'2px solid #DAA520',boxShadow:'0 4px 20px rgba(218,165,32,0.6)',
    zIndex:'1100',fontSize:'16px',fontWeight:'bold',textAlign:'center',
    pointerEvents:'none',
    animation:'combo-toast-slide 2.5s ease-out forwards'
  });
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),dur+200);
}
// V4: 触发 combo 触发动画 (一次性) - 给最近触发 combo 的 card-mini 加 class
const _comboActiveCards=new Set();
function flashComboCards(cardIds){
  cardIds.forEach(id=>_comboActiveCards.add(id));
  // Trigger re-render
  if(typeof render==='function') render();
  // Clear after animation
  setTimeout(()=>{
    cardIds.forEach(id=>_comboActiveCards.delete(id));
    if(typeof render==='function') render();
  },900);
}
// V4: 检测 combo 增量, 触发 toast + flash
function checkComboDelta(){
  const cb=window.ComboEngine;
  if(!cb || !cb.diffActiveCombos || !cb.computeAllBonuses) return;
  // 从 board 实时计算 nested bonus 结构（diffActiveCombos 需要的格式）
  const oppIdx=1-(G.currentPlayerIdx||0);
  const playerIdx=G.currentPlayerIdx||0;
  const oppBoard=G.players[oppIdx]&&G.players[oppIdx].board;
  const myBoard=G.players[playerIdx]&&G.players[playerIdx].board;
  const myHand=G.players[playerIdx]&&G.players[playerIdx].hand;
  const myLeader=G.players[playerIdx]&&G.players[playerIdx].leader;
  if(!myBoard) return;
  const all=cb.computeAllBonuses({board:myBoard,opponentBoard:oppBoard,hand:myHand,leader:myLeader});
  // build nested structure for diff
  // IMPORTANT: only include layers that are ACTUALLY active. Empty objects are truthy in JS
  // and would cause diffActiveCombos to falsely fire "added" toasts.
  // For each layer, check the underlying signal/marker:
  // - same_faction / type_synergy / row_stacking: strength has entries?
  // - scholar_circle: signals array has entries?
  // - juzhongqu: result has entries?
  const hasEntries = (o) => o && typeof o === 'object' && Object.keys(o).length > 0;
  const nested={
    same_faction: hasEntries(all.same_faction) ? all.same_faction : null,
    type_synergy: hasEntries(all.type_synergy) ? all.type_synergy : null,
    row_stacking: hasEntries(all.row_stacking) ? all.row_stacking : null,
    scholar_circle: (all.scholar_circle && all.scholar_circle.signals && all.scholar_circle.signals.length > 0) ? all.scholar_circle : null,
    juzhongqu: hasEntries(all.juzhongqu) ? all.juzhongqu : null,
  };
  const diff=cb.diffActiveCombos(nested);
  if(diff.added && diff.added.length>0){
    diff.added.forEach(c=>{
      const labelMap={
        same_faction:c.key||'阵营',
        type_synergy:c.key||'类型',
        row_stacking:`${c.faction||''}·${c.row||''}`,
        scholar_circle:'文臣诗人',
        juzhongqu:'领袖羁绊',
      };
      const desc=labelMap[c.layer]||'组合技';
      const title=`⚔ 触发${c.layer==='same_faction'?'同阵营加成':c.layer==='type_synergy'?'卡牌类型联动':c.layer==='row_stacking'?'同行强化':c.layer==='scholar_circle'?'文人圈联动':'领袖羁绊'}`;
      showComboToast(title,`${desc} +${c.bonus||1}`);
      // Flash affected cards - need to find card ids from the active combos
      if(c.uids && c.uids.length>0) flashComboCards(c.uids);
      else if(c.cardIds && c.cardIds.length>0) flashComboCards(c.cardIds);
    });
  }
}

function getRowPower(cards,playerIdx){
  const buffs=G.globalBuffs;
  const armor=playerIdx===0?buffs.playerArmor:buffs.aiArmor;
  const unify=playerIdx===0?buffs.playerUnify:buffs.aiUnify;
  // Combo Bonus overlay — sees the full board state and applies same-faction / anti-faction / juzhongqu
  const cb=(typeof window!=='undefined' && window.ComboEngine) ? window.ComboEngine : null;
  const oppIdx=1-playerIdx;
  let _bonuses={};
  if(cb){
    const oppBoard = G.players[oppIdx] && G.players[oppIdx].board;
    const myBoard = G.players[playerIdx] && G.players[playerIdx].board;
    const myHand = G.players[playerIdx] && G.players[playerIdx].hand;
    const myLeader = G.players[playerIdx] && G.players[playerIdx].leader;
    if(myBoard){
      const all = cb.computeAllBonuses({board:myBoard,opponentBoard:oppBoard,hand:myHand,leader:myLeader});
      _bonuses = all.total;
      // V4: detect newly triggered combos and show toast + flash
      checkComboDelta();
    }
  }
  return cards.reduce((s,c)=>s+(c?Math.max(1,c.strength+armor+Math.floor(unify*0.5)+(_bonuses[c.id]||0)):0),0);
}
function getBoardPower(board,playerIdx){return getRowPower(board.infantry,playerIdx)+getRowPower(board.cavalry,playerIdx)+getRowPower(board.navy,playerIdx)+getRowPower(board.strategy,playerIdx)}

function weakestOpponentRow(opponentBoard,oppIdx){
  const rows=['infantry','cavalry','navy','strategy'];
  let min=Infinity,wk='infantry';
  rows.forEach(r=>{const p=getRowPower(opponentBoard[r],oppIdx);if(p<min){min=p;wk=r}});
  return wk;
}

function triggerAbility(card,playerIdx){
  if(!card.ability)return;
  const[abilityType,v]=card.ability.split(':');
  const n=parseInt(v);
  const opp=1-playerIdx;
  const myBoard=getBoard(playerIdx);
  const oppBoard=getBoard(opp);
  switch(abilityType){
    case'draw':
      drawCards(playerIdx,n);
      addLog(t('ui.log.card_ability_28568e', {card: cn(card)}));
      break;
    case'discard':{
      const oppH=getHand(opp);
      for(let i=0;i<n&&oppH.length>0;i++){
        const idx=Math.floor(random()*oppH.length);
        addLog(t('ui.log.card_ability_4488c8', {card: cn(card)}));
        oppH.splice(idx,1);
      }
      break;}
    case'boost_row':
      myBoard[card.row].forEach(c=>{if(c&&c.uid!==card.uid)c.strength+=n});
      addLog(t('ui.log.card_ability_af5723', {card: cn(card)}));
      break;
    case'weaken_row':{
      const wk=weakestOpponentRow(oppBoard,opp);
      oppBoard[wk].forEach(c=>{if(c)c.strength=Math.max(1,c.strength-n)});
      addLog(t('ui.log.card_ability_9eaa13', {card: cn(card)}));
      break;}
    case'gain_provisions':
      G.provisions[playerIdx]+=n;
      addLog(t('ui.log.card_ability_d57c37', {card: cn(card)}));
      break;
    case'ambush':
      if(G.turnCount===0&&!G.globalBuffs.ambushTriggered){
        myBoard.infantry.forEach(c=>{if(c)c.strength+=n});
        G.globalBuffs.ambushTriggered=true;
        addLog(t('ui.log.card_ability_f8bcd2', {card: cn(card)}));
      }
      break;
    case'command':{
      const cmdH=getHand(playerIdx);
      if(cmdH.length>0){
        let weakIdx=0,weakStr=Infinity;
        cmdH.forEach((c,i)=>{if(c&&c.strength<weakStr){weakStr=c.strength;weakIdx=i}});
        const discarded=cmdH.splice(weakIdx,1)[0];
        addLog(t('ui.log.card_ability_3b7d5c', {card: cn(card)}));
        if(cmdH.length>0){
          drawCards(playerIdx,n);
          addLog(t('ui.log.card_ability_28568e', {card: cn(card)}));
        }
      }
      break;}
    case'control':{
      let ctrlMaxP=-1,ctrlMaxRow='infantry';
      ['infantry','cavalry','navy','strategy'].forEach(r=>{
        const p=getRowPower(oppBoard[r],opp);
        if(p>ctrlMaxP){ctrlMaxP=p;ctrlMaxRow=r}
      });
      oppBoard[ctrlMaxRow].forEach(c=>{if(c)c.strength=Math.max(1,c.strength-1)});
      addLog(t('ui.log.card_ability_728251', {card: cn(card)}));
      break;}
    case'skirmish':
      if(playerIdx===0) G.players[1].passed=true;
      else G.players[0].passed=true;
      addLog(t('ui.log.card_ability_8cf356', {card: cn(card)}));
      break;
    case'shield':
      ['infantry','cavalry','navy','strategy'].forEach(r=>{
        myBoard[r].forEach(c=>{if(c)c.strength+=n});
      });
      addLog(t('ui.log.card_ability_602aac', {card: cn(card)}));
      break;
    case'navy_boost':
      myBoard.navy.forEach(c=>{if(c&&c.uid!==card.uid)c.strength+=n});
      addLog(t('ui.log.card_ability_8f9607', {card: cn(card)}));
      break;
    case'farm':
      if(playerIdx===0) G.globalBuffs.playerFarm=n;
      else G.globalBuffs.aiFarm=n;
      addLog(t('ui.log.card_ability_9a402e', {card: cn(card)}));
      break;
    case'fortify':
      myBoard[card.row].forEach(c=>{if(c&&c.uid!==card.uid)c.strength+=n});
      addLog(t('ui.log.card_ability_af5723', {card: cn(card)}));
      break;
    case'flex':
      addLog(t('ui.log.card_ability_a7ff4b', {card: cn(card)}));
      break;
    case'assimilate':{
      let aMinCard=null,aMinStr=Infinity,aMinRow=null;
      ['infantry','cavalry','navy','strategy'].forEach(r=>{
        oppBoard[r].forEach(c=>{
          if(c.strength<aMinStr){aMinStr=c.strength;aMinCard=c;aMinRow=r}
        });
      });
      if(aMinCard){
        oppBoard[aMinRow]=oppBoard[aMinRow].filter(c=>c.uid!==aMinCard.uid);
        getHandSafe(playerIdx).push(aMinCard);
        addLog(t('ui.log.card_ability_531e34', {card: cn(card)}));
      }
      break;}
    case'armor':
      if(playerIdx===0) G.globalBuffs.playerArmor+=n;
      else G.globalBuffs.aiArmor+=n;
      addLog(t('ui.log.card_ability_c04ed6', {card: cn(card)}));
      break;
    case'siege':{
      let sMaxP=-1,sMaxRow='infantry';
      ['infantry','cavalry','navy','strategy'].forEach(r=>{
        const p=getRowPower(oppBoard[r],opp);
        if(p>sMaxP){sMaxP=p;sMaxRow=r}
      });
      oppBoard[sMaxRow].forEach(c=>{if(c)c.strength=Math.max(1,c.strength-n)});
      addLog(t('ui.log.card_ability_c2eef3', {card: cn(card)}));
      break;}
    case'coordinate':
      myBoard[card.row].forEach(c=>{
        if(c.uid!==card.uid&&c.faction===card.faction) c.strength+=n;
      });
      addLog(t('ui.log.card_ability_250365', {card: cn(card)}));
      break;
    case'ambush_card':{
      drawCards(playerIdx,1);
      const ambH=getHand(opp);
      if(ambH.length>0){
        const idx=Math.floor(random()*ambH.length);
        addLog(t('ui.log.card_ability_3d3e99', {card: cn(card)}));
        ambH.splice(idx,1);
      }
      addLog(t('ui.log.card_ability_6f7cca', {card: cn(card)}));
      break;}
    case'berserk':
      card.strength*=2;
      if(playerIdx===0) G.globalBuffs.playerBerserkCard=card.uid;
      else G.globalBuffs.aiBerserkCard=card.uid;
      addLog(t('ui.log.card_ability_44fc99', {card: cn(card)}));
      break;
    case'crit':{
      let cMaxCard=null,cMaxStr=-1,cMaxRow=null;
      ['infantry','cavalry','navy','strategy'].forEach(r=>{
        oppBoard[r].forEach(c=>{
          if(c.strength>cMaxStr){cMaxStr=c.strength;cMaxCard=c;cMaxRow=r}
        });
      });
      if(cMaxCard){
        oppBoard[cMaxRow]=oppBoard[cMaxRow].filter(c=>c.uid!==cMaxCard.uid);
        addLog(t('ui.log.card_ability_7f01d0', {card: cn(card)}));
      }
      break;}
    case'unify':
      if(playerIdx===0) G.globalBuffs.playerUnify+=1;
      else G.globalBuffs.aiUnify+=1;
      addLog(t('ui.log.card_ability_eb93e9', {card: cn(card)}));
      break;
    case'anti_south':{
      const southFactions=['song','qi','liang','chen'];
      const oppLeaderFaction=(playerIdx===0?G.players[1].leader:G.players[0].leader)?.faction||'';
      if(southFactions.includes(oppLeaderFaction)){
        card.strength+=n;
        addLog(t('ui.log.card_ability_a2961b', {card: cn(card)}));
      }
      break;}
    case'combo_boost':{
      const sameType=Object.values(myBoard).flat().filter(c=>c.uid!==card.uid&&c.ability&&c.ability.split(':')[0]==='combo_boost');
      sameType.forEach(c=>{if(c)c.strength+=n});
      addLog(t('ui.log.card_ability_dfcee5', {card: cn(card)}));
      break;}
    case'destroy':{
      const oppAll=Object.entries(oppBoard).flatMap(([r,cards])=>cards.map(c=>({...c,_row:r})));
      for(let i=0;i<n&&oppAll.length>0;i++){
        const ri=Math.floor(random()*oppAll.length);
        const target=oppAll.splice(ri,1)[0];
        oppBoard[target._row]=oppBoard[target._row].filter(c=>c.uid!==target.uid);
        G.graveyard.push(target);
        addLog(t('ui.log.card_ability_4a9119', {card: cn(card)}));
      }
      break;}
    case'resurrect':{
      for(let i=0;i<n&&G.graveyard.length>0;i++){
        const ri=Math.floor(random()*G.graveyard.length);
        const card2=G.graveyard.splice(ri,1)[0];
        getHandSafe(playerIdx).push(card2);
        addLog(t('ui.log.card_ability_e2a563', {card: cn(card)}));
      }
      break;}
    case'protect':
      card.protectArmor=(card.protectArmor||0)+n;
      addLog(t('ui.log.card_ability_dfda8c', {card: cn(card)}));
      break;
    case'spy':{
      const oppH2=getHand(opp);
      if(oppH2.length>0){
        let spyMax=-1,spyIdx=0;
        oppH2.forEach((c,i)=>{if(c&&c.strength>spyMax){spyMax=c.strength;spyIdx=i}});
        const discarded=oppH2.splice(spyIdx,1)[0];
        G.graveyard.push(discarded);
        addLog(t('ui.log.card_ability_b75e60', {card: cn(card)}));
      }
      break;}
    case'draw_extra':
      drawCards(playerIdx,n);
      addLog(t('ui.log.card_ability_c25433', {card: cn(card)}));
      break;
  }
}

function triggerAbilityWithFlash(card,playerIdx,row){
  triggerAbility(card,playerIdx);
  render();
  const board=getBoard(playerIdx);
  const cards=board[row];
  const lastCard=cards[cards.length-1];
  if(lastCard){
    setTimeout(()=>{
      const els=document.querySelectorAll('.card-mini');
      for(const el of els){
        const nameEl=el.querySelector('.c-name');
        if(nameEl&&nameEl.textContent===cn(card)){
          el.classList.add('skill-flash');
          setTimeout(()=>el.classList.remove('skill-flash'),700);
          break;
        }
      }
    },50);
  }
}

function playCard(playerIdx,handIdx,row){
  const hand=getHand(playerIdx);
  if(!hand[handIdx])return;  // 防御：手牌索引可能已失效
  const card=hand.splice(handIdx,1)[0];
  if(!card)return;  // 防御：splice 结果不应为 undefined（双保险）

  const berserkKey=playerIdx===0?'playerBerserkCard':'aiBerserkCard';
  const berserkUid=G.globalBuffs[berserkKey];
  if(berserkUid!=null){
    const board=getBoard(playerIdx);
    for(const r of ['infantry','cavalry','navy','strategy']){
      const bCard=board[r].find(c=>c.uid===berserkUid);
      if(bCard){
        bCard.strength=Math.max(1,bCard.strength-2);
        addLog(t('ui.log.fierce_attack_penalty', {card: cn(bCard)}));
        break;
      }
    }
    G.globalBuffs[berserkKey]=null;
  }

  const board=getBoard(playerIdx);
  board[row].push(card);
  G.provisions[playerIdx]-=getCardCost(card.strength);
  G._lastPlayedUid=card.uid;
  G._lastPlayedBy=playerIdx;
  const name=playerIdx===0?'你':'AI';
  addLog(t('ui.log.played_card', {player: name, card: `${cn(card)} (${getRowName(row)} ${card.strength})`}));
  setTimeout(()=>{
    const rowEl=document.querySelector('.row[data-row="'+row+'"]')||document.querySelectorAll('.row')[getRowIdx(row)];
    const cardEl=card.uid?getCardEl(card.uid):null;
    try{playCardEffect(card,rowEl,{cardEl});}catch(e){}
  },50);
  if(playerIdx===1){
    setTimeout(()=>triggerAbilityWithFlash(card,playerIdx,row),650);
  }else{
    triggerAbilityWithFlash(card,playerIdx,row);
  }
}

function startRound(){
  G.round++;
  G.players[0].passed=false;
  G.players[1].passed=false;
  G.selectedCard=null;
  G.turnCount=0;
  // 粮草不再重置——开局30跨局共享（仅 confirmLeader/resetGame 初始化）
  G.players[0].board={infantry:[],cavalry:[],navy:[],strategy:[]};
  G.players[1].board={infantry:[],cavalry:[],navy:[],strategy:[]};
  G.globalBuffs={playerArmor:0,aiArmor:0,playerUnify:0,aiUnify:0,ambushTriggered:false,playerFarm:0,aiFarm:0,playerBerserkCard:null,aiBerserkCard:null};
  G.graveyard=[];
  G.logs=[];
  // 第1局不自动抽牌（换牌阶段已经处理）
  const drawCount=G.round<=1?0:4;
  const extraDraw=(G._comboDrawBonus&&G._comboDrawBonus[0])||0;
  G._comboDrawBonus=G._comboDrawBonus||[0,0];
  if(drawCount>0){
    drawCards(0,drawCount+extraDraw);
    drawCards(1,drawCount+(G._comboDrawBonus[1]||0));
  }
  G._comboDrawBonus=[0,0];
  applyRoundStartAbilities();
  G.currentTurn='player';
  addLog(`═══ `+t("ui.log.round_start",{round:G.round})+` ═══`);
  if(drawCount>0) addLog(t('ui.log.both_draw',{count:drawCount}));
  render();
}

function playerPlayCard(handIdx,row){
  if(G._busy){console.log('[ppc] busy');return;}
  if(G.phase!=='playing'||G.currentTurn!=='player'||G.players[0].passed)return;
  const card=G.players[0].hand[handIdx];
  if(!card)return;
  if(getCardCost(card.strength)>G.provisions[0])return;
  G._busy=true;
  G.selectedCard=null;
  G.turnCount++;
  try{playCard(0,handIdx,row);}catch(e){console.error(e);G._busy=false;return;}
  try{afterPlayerTurn();}catch(e){console.error(e);}
  setTimeout(()=>{G._busy=false;},800);
}

function playerPass(){
  console.log('[playerPass] called, G.phase=', G.phase, 'currentTurn=', G.currentTurn, 'passed=', G.players[0].passed);
  if(G.phase!=='playing')return;
  if(G.players[0].passed)return;
  if(G.currentTurn!=='player')return;
  // 直接放弃：去掉确认弹窗(防止误以为 Pass 没生效),改为 toast 提示
  G.players[0].passed=true;
  G.selectedCard=null;
  addLog(t('ui.log.you_pass'));
  showToast(t('ui.log.pass_wait'));
  if(G.players[1].passed){endRound();return}
  G.currentTurn='ai';
  render();
  setTimeout(aiTurn,800);
}

function afterPlayerTurn(){
  // 如果玩家没有可出的牌，自动Pass
  if(!hasPlayableCard(0)){
    addLog(t('ui.log.no_cards'));
    G.players[0].passed=true;
    G.selectedCard=null;
    if(G.players[1].passed){endRound();return}
    G.currentTurn='ai';
    render();
    setTimeout(aiTurn,600);
    return;
  }
  if(G.players[1].passed){
    if(G.players[0].passed){
      endRound();return;
    }
    G.currentTurn='player';
    render();
    return;
  }
  G.currentTurn='ai';
  if(G.globalBuffs.aiFarm>0){
    G.provisions[1]+=G.globalBuffs.aiFarm;
    addLog(t('ui.log.ai_gain_provisions', {count: G.globalBuffs.aiFarm}));
  }
  render();
  setTimeout(aiTurn,600);
}

function hasPlayableCard(p){
  const hand=getHand(p);
  const prov=G.provisions[p];
  return hand.some(c=>c&&getCardCost(c.strength)<=prov);
}

function aiTurn(){
  console.log('[aiTurn] called, G.phase=', G.phase, 'currentTurn=', G.currentTurn, 'AI passed=', G.players[1].passed);
  try{
  if(G.phase!=='playing')return;
  // 防御性检查: 如果AI粮草为0且手牌无费用可出，立即pass
  if(G.provisions[1]<=0 && !hasPlayableCard(1)){
    G.players[1].passed=true;
    addLog(t('ui.log.ai_no_provisions'));
    if(G.players[0].passed){endRound();return}
    G.currentTurn='player';
    render();return;
  }
  if(G.players[1].passed){
    if(G.players[0].passed){endRound();return}
    G.currentTurn='player';
    render();
    return;
  }
  if(!hasPlayableCard(1)){
    G.players[1].passed=true;
    addLog(t('ui.log.ai_no_cards'));
    if(G.players[0].passed){endRound();return}
    G.currentTurn='player';
    render();return;
  }
  if(G.leaderAbilityUsed[1]===false&&random()<0.4){
    useLeaderAbility(1);
    render();
  }
  if(aiShouldPass()){
    G.players[1].passed=true;
    addLog(t('ui.log.ai_pass'));
    if(G.players[0].passed){endRound();return}
    G.currentTurn='player';
    render();return;
  }
  const choice=aiChooseCard();
  if(!choice){G.players[1].passed=true;addLog(t('ui.log.ai_pass_short'));if(G.players[0].passed){endRound();return}G.currentTurn='player';render();return}
  setTimeout(()=>{
    try{
      if(G.phase!=='playing'||G.players[1].passed)return;
      playCard(1,choice.handIdx,choice.row);
    }catch(e){
      console.error('[AI playCard]',e);
      addLog(t('ui.log.ai_play_failed', {error: e.message}));
    }
    try{
      G.turnCount++;
      if(G.players[0].passed){endRound();return}
      G.currentTurn='player';
      if(G.globalBuffs.playerFarm>0){
        G.provisions[0]+=G.globalBuffs.playerFarm;
        addLog(t('ui.log.you_gain_provisions', {count: G.globalBuffs.playerFarm}));
      }
    }catch(e){}
    render();
  },600);
  }catch(e){
    console.error('[aiTurn outer]',e);
    addLog(t('ui.log.ai_error', {error: e.message}));
    G.currentTurn='player';
    render();
  }
}

function aiShouldPass(){
  // 早期几轮不让 AI 主动放弃(避免一上来就 Pass 太弱)
  if(G.turnCount<3)return false;
  const aiP=getBoardPower(G.players[1].board,1);
  const plP=getBoardPower(G.players[0].board,0);
  const prov=G.provisions[1];
  // 无牌可出必 Pass
  if(!hasPlayableCard(1))return true;
  // 局势判断:AI 落后 5+ 战力,且剩余粮草只够出低费牌 → 战略性 Pass 让 AI 把赢面留给下一局
  if(aiP < plP - 5 && prov <= 4)return true;
  // 双方都已 Pass 会进入结算,这里不必处理
  return false;
}

function aiChooseCard(){
  const hand=G.players[1].hand;
  const prov=G.provisions[1];
  const playable=hand.map((c,i)=>({card:c,idx:i})).filter(x=>x.card&&getCardCost(x.card.strength)<=prov);
  if(!playable.length)return null;
  const aiP=getBoardPower(G.players[1].board,1);
  const plP=getBoardPower(G.players[0].board,0);
  let best=null,bestScore=-9999;
  for(const{card,idx}of playable){
    let score=card.strength;
    const rp={infantry:getRowPower(G.players[1].board.infantry,1),cavalry:getRowPower(G.players[1].board.cavalry,1),navy:getRowPower(G.players[1].board.navy,1),strategy:getRowPower(G.players[1].board.strategy,1)};
    const minR=Object.keys(rp).reduce((a,b)=>rp[a]<rp[b]?a:b);
    let targetRow=card.row;
    if(card.row===minR)score+=4;
    if(card.ability){
      const[t]=card.ability.split(':');
      if(t==='ambush')score+=(G.turnCount===0?5:0);
      if(t==='command')score+=3;
      if(t==='control')score+=5;
      if(t==='skirmish')score+=4;
      if(t==='shield')score+=4;
      if(t==='navy_boost')score+=3;
      if(t==='farm')score+=3;
      if(t==='fortify')score+=3;
      if(t==='flex'){score+=2;targetRow=minR}
      if(t==='assimilate')score+=5;
      if(t==='armor')score+=4;
      if(t==='siege')score+=4;
      if(t==='coordinate')score+=3;
      if(t==='ambush_card')score+=3;
      if(t==='berserk')score+=(aiP<plP?5:2);
      if(t==='crit')score+=6;
      if(t==='unify')score+=3;
      if(t==='anti_south'){
        const oppFaction=G.players[0].leader?G.players[0].leader.faction:'';
        if(['song','qi','liang','chen'].includes(oppFaction))score+=4;
      }
      if(t==='boost_row')score+=3;
      if(t==='weaken_row')score+=4;
      if(t==='discard')score+=3;
      if(t==='draw')score+=2;
      if(t==='gain_provisions')score+=1;
      if(t==='combo_boost')score+=3;
      if(t==='destroy')score+=5;
      if(t==='resurrect')score+=4;
      if(t==='protect')score+=3;
      if(t==='spy')score+=5;
      if(t==='draw_extra')score+=3;
    }
    if(aiP<plP)score+=card.strength*0.5;
    score+=random()*2;
    if(score>bestScore){bestScore=score;best={handIdx:idx,row:targetRow}}
  }
  return best;
}

function endRound(){
  const pP=getBoardPower(G.players[0].board,0);
  const aP=getBoardPower(G.players[1].board,1);
  let winner;
  if(pP>aP){winner=0;G.scores[0]++}
  else if(aP>pP){winner=1;G.scores[1]++}
  else{winner=-1}
  const winText=winner===0?t('ui.log.you_win_round'):winner===1?t('ui.log.ai_win_round'):t('ui.log.tie_round');
  addLog(`═══ `+t('ui.log.round_end',{round:G.round})+` ═══`);
  addLog(t('ui.log.power_compare',{player:pP,ai:aP})+` → `+winText);
  // Log combo triggers
  const cb=(typeof window!=='undefined'&&window.ComboEngine)?window.ComboEngine:null;
  if(cb){
    [0,1].forEach(pIdx=>{
      const oppIdx=1-pIdx;
      const myBoard=G.players[pIdx]&&G.players[pIdx].board;
      const oppBoard=G.players[oppIdx]&&G.players[oppIdx].board;
      const myHand=G.players[pIdx]&&G.players[pIdx].hand;
      const myLeader=G.players[pIdx]&&G.players[pIdx].leader;
      if(myBoard){
        const all=cb.computeAllBonuses({board:myBoard,opponentBoard:oppBoard,hand:myHand,leader:myLeader});
        all.signals.forEach(sig=>{
                  const faction=(myLeader&&myLeader.faction)||'';
                  switch(sig){
            case'weaken_opponent':addLog(t('ui.log.combo_weaken',{faction}));break;
            case'discard_opponent':addLog(t('ui.log.combo_discard',{faction}));break;
            case'draw_card':addLog(t('ui.log.combo_draw',{faction}));break;
            case'armor_all':addLog(t('ui.log.combo_armor',{faction}));break;
            case'combo_type_synergy:minister':addLog(t('ui.log.combo_type_synergy',{type:'文臣'}));break;
            case'combo_type_synergy:poet':addLog(t('ui.log.combo_type_synergy',{type:'诗人'}));break;
            case'combo_type_synergy:industry':addLog(t('ui.log.combo_type_synergy',{type:'行业'}));break;
            case'combo_type_synergy:monk':addLog(t('ui.log.combo_type_synergy',{type:'僧侣'}));break;
            case'combo_row_stacking:infantry':addLog(t('ui.log.combo_row_stacking',{row:'步兵'}));break;
            case'combo_row_stacking:cavalry':addLog(t('ui.log.combo_row_stacking',{row:'骑兵'}));break;
            case'combo_row_stacking:navy':addLog(t('ui.log.combo_row_stacking',{row:'水军'}));break;
            case'combo_row_stacking:strategy':addLog(t('ui.log.combo_row_stacking',{row:'谋略'}));break;
            case'combo_scholar_circle':addLog(t('ui.log.combo_scholar_circle'));break;
          }
        });
        // Apply extra effects after round结算
        applyComboExtras(pIdx,all.signals);
      }
    });
  }
  G.phase='round_result';
  G._roundResult={playerPower:pP,aiPower:aP,winner};
  render();
  showNotification(winText);
}

function applyComboExtras(playerIdx,signals){
  if(!signals||!signals.length)return;
  signals.forEach(sig=>{
    const oppIdx=1-playerIdx;
    switch(sig){
      case'weaken_opponent':{
        const oppBoard=G.players[oppIdx].board;
        const rows=['infantry','cavalry','navy','strategy'];
        let maxPower=-1,maxRow='infantry';
        rows.forEach(r=>{
          const p=oppBoard[r].reduce((s,c)=>s+(c?c.strength:0),0);
          if(p>maxPower){maxPower=p;maxRow=r;}
        });
        oppBoard[maxRow].forEach(c=>{if(c)c.strength=Math.max(1,c.strength-1);});
        break;
      }
      case'discard_opponent':{
        const oppHand=G.players[oppIdx].hand;
        if(oppHand.length>0){
          const idx=Math.floor(Math.random()*oppHand.length);
          oppHand.splice(idx,1);
        }
        break;
      }
      case'draw_card':
        G._comboDrawBonus=G._comboDrawBonus||[0,0];
        G._comboDrawBonus[playerIdx]=(G._comboDrawBonus[playerIdx]||0)+1;
        break;
      case'armor_all':{
        const myBoard=G.players[playerIdx].board;
        const leader=G.players[playerIdx].leader;
        if(!leader)return;
        ['infantry','cavalry','navy','strategy'].forEach(r=>{
          myBoard[r].forEach(c=>{
            if(c&&c.faction===leader.faction){
              c.protectArmor=(c.protectArmor||0)+1;
            }
          });
        });
        break;
      }
    }
  });
}

function checkGameEnd(){
  if(G.scores[0]>=2||G.scores[1]>=2||G.round >= 3){
    G.phase='game_result';
    render();
    const winText=t("ui.log.game_over_"+(G.scores[0]>G.scores[1]?"you_win":G.scores[0]===G.scores[1]?"tie":"ai_win"));
    showNotification(winText,3000);

    G.phase='playing';
    setTimeout(startRound,1500);
  }
}

function playCardEffect(card,rowEl,opts={}){
  const color=getCardElColor(card);
  const cardEl=opts.cardEl||null;
  const start=cardEl?getRectCenter(cardEl):{x:window.innerWidth/2,y:window.innerHeight-100};
  const end=rowEl?getRectCenter(rowEl):{x:window.innerWidth/2,y:window.innerHeight/2};
  if(!start||!end)return;
  playArcParticles(start.x,start.y,end.x,end.y,color,8);
  if(card.row==='navy')playNavyWave(end.x,end.y);
  const ab=card.ability||'';const abType=ab.split(':')[0];
  switch(abType){
    case'draw':{const ha=document.querySelector('.hand-area');if(ha){const r=ha.getBoundingClientRect();playDrawTalismans(start.x,start.y,r.left+r.width/2,r.top+30,Math.min(parseInt(ab.split(':')[1]||'1',10)*2,6));}break;}
    case'draw_extra':{const ha=document.querySelector('.hand-area');if(ha){const r=ha.getBoundingClientRect();playDrawBurst(start.x,start.y,r.left+r.width/2,r.top+30,12);}break;}
    case'boost_row':case'navy_boost':case'combo_boost':{playRowArrows(start.x,start.y,end.x,end.y,color,8);break;}
    case'destroy':{playDestroyVortex(end.x,end.y);break;}
    case'shield':case'protect':{playShield(end.x,end.y);break;}
    case'gain_provisions':{const n=parseInt(ab.split(':')[1]||'1',10);for(let i=0;i<n;i++)setTimeout(()=>playProvisionsBag(start.x+10*(i%3-1),start.y+5*(i-Math.floor(n/2))),i*200);break;}
    case'ambush':{playAmbushParticles(start.x,start.y,end.x,end.y,6);break;}
    case'crit':{playCritStar(end.x,end.y);break;}
    case'berserk':{playBerserkFlash(end.x,end.y);break;}
    case'resurrect':{playResurrectBeam(end.x,end.y);break;}
    case'discard':{playDiscardChains(start.x,start.y,end.x,end.y,3);break;}
    case'skirmish':{playSkirmishRing(end.x,end.y);break;}
    case'weaken_row':{playWeakenShadow(end.x,end.y);break;}
    case'command':{playCommandBanner(end.x,end.y);break;}
    case'assimilate':{playAssimilateTentacles(end.x,end.y,3);break;}
    case'spy':{playSpySmoke(end.x,end.y);break;}
    case'control':{playControlChain(end.x,end.y);break;}
    case'fortify':{playFortifyBlocks(end.x,end.y);break;}
    case'siege':{playSiegeRocks(start.x,start.y,end.x,end.y);break;}
    case'farm':{playFarmGrains(end.x,end.y);break;}
    case'unify':{playUnifyOrbs(end.x,end.y);break;}
    case'flex':{playFlexFlip(end.x,end.y);break;}
    case'anti_south':{playAntiFire(end.x,end.y);break;}
    case'ambush_card':{playAmbushGrass(end.x,end.y);break;}
    case'coordinate':{playCoordinateLines(start.x,start.y,end.x,end.y,color);break;}
    case'armor':{playArmorPlates(end.x,end.y);break;}
  }
}

function leaderImgFallback(img, fallbackSrc, color, initial){
  // Three-level fallback: PNG -> existing PNG -> placeholder color block
  if(img._fallbackLevel === undefined) img._fallbackLevel = 0;
  img._fallbackLevel++;
  if(img._fallbackLevel === 1){
    img.onerror=null;
    img.src=fallbackSrc;
    img.onerror=function(){leaderImgFallback(this, null, color, initial)};
  } else {
    img.style.display='none';
    const ph=img.parentNode.querySelector('.placeholder-block');
    if(ph) ph.style.display='flex';
  }
}

function useLeaderAbility(playerIdx){
  if(G.leaderAbilityUsed[playerIdx])return;
  const leader=playerIdx===0?G.players[0].leader:G.players[1].leader;
  if(!leader)return;
  const ability=leader.ability;
  switch(ability.type){
    case'row_boost':
      getBoard(playerIdx)[ability.row].forEach(c=>{if(c)c.strength+=ability.value});
      addLog(t('ui.log.leader_ability_row', {leader: ln(leader), row: getRowName(ability.row), value: ability.value}));
      break;
    case'extra_draw':
      drawCards(playerIdx,ability.value);
      addLog(t('ui.log.leader_ability_draw', {leader: ln(leader), count: ability.value}));
      break;
    case'opponent_discard':{
      const opp=1-playerIdx;
      const oppH=getHand(opp);
      for(let i=0;i<ability.value&&oppH.length>0;i++){
        const ri=Math.floor(random()*oppH.length);
        addLog(t('ui.log.leader_ability_opp_discard', {leader: ln(leader), card: cn(oppH[ri])}));
        oppH.splice(ri,1);
      }
      break;}
    case'extra_provisions':
      G.provisions[playerIdx]+=ability.value;
      addLog(t('ui.log.leader_ability_provisions', {leader: ln(leader), value: ability.value}));
      break;
    case'all_boost':
      ['infantry','cavalry','navy','strategy'].forEach(r=>getBoard(playerIdx)[r].forEach(c=>{if(c)c.strength+=ability.value}));
      addLog(t('ui.log.leader_ability_all_buff', {leader: ln(leader), value: ability.value}));
      break;
    case'double_edge':{
      const myBoard=getBoard(playerIdx);
      const rows=['infantry','cavalry','navy','strategy'];
      let maxP=-1,bestR='infantry',minP=Infinity,worstR='infantry';
      rows.forEach(r=>{
        const p=getRowPower(myBoard[r],playerIdx);
        if(p>maxP){maxP=p;bestR=r}
        if(p<minP){minP=p;worstR=r}
      });
      if(bestR===worstR) bestR=rows.find(r=>r!==worstR)||'infantry';
      myBoard[bestR].forEach(c=>{if(c)c.strength+=ability.value});
      myBoard[worstR].forEach(c=>{if(c)c.strength=Math.max(1,c.strength-1)});
      addLog(t('ui.log.leader_ability_best_worst', {leader: ln(leader), bestRow: getRowName(bestR), value: ability.value, worstRow: getRowName(worstR)}));
      break;}
    case'hand_boost':{
      const hand=getHand(playerIdx);
      const shuffled=[...hand].sort(()=>random()-0.5);
      const cnt=Math.min(ability.value,shuffled.length);
      for(let i=0;i<cnt;i++) shuffled[i].strength+=2;
      addLog(t('ui.log.leader_ability_hand_buff', {leader: ln(leader), count: cnt}));
      break;}
  }
  G.leaderAbilityUsed[playerIdx]=true;
  render();
}

function renderRow(rowType,cards,isPlayer,lastUid,lastBy){
  const playerIdx=isPlayer?0:1;
  const power=getRowPower(cards,playerIdx);
  const isHotSeat=G._hsPhase==='game';
  const act=isHotSeat?G.activePlayer:(isPlayer?0:1);
  const isMyTurn=isHotSeat?(act===playerIdx):(G.currentTurn==='player'&&isPlayer);
  const highlight=isMyTurn&&!G.players[playerIdx].passed&&G.selectedCard!==null;
      const canPlay=highlight;
    // Compute combo bonuses for display
    const cb=(typeof window!=='undefined'&&window.ComboEngine)?window.ComboEngine:null;
    let _bonuses={};
    if(cb&&!isHotSeat){
      const oppIdx=1-playerIdx;
      const oppBoard=G.players[oppIdx]&&G.players[oppIdx].board;
      const myBoard=G.players[playerIdx]&&G.players[playerIdx].board;
      const myHand=G.players[playerIdx]&&G.players[playerIdx].hand;
      const myLeader=G.players[playerIdx]&&G.players[playerIdx].leader;
      if(myBoard){
        const all=cb.computeAllBonuses({board:myBoard,opponentBoard:oppBoard,hand:myHand,leader:myLeader});
        _bonuses=all.total;
      }
    }
    const cardsHtml=cards.length===0?'<span style="color:#B8A88A;font-size:.75em">空</span>':
    cards.map(c=>{
      const f=FACTIONS[c.faction];
      const animClass=c.uid===lastUid?(lastBy===1?' ai-play-card':' play-animation'):'';
      // V4: highlight cards that just triggered a combo
      const comboClass=(_comboActiveCards&&_comboActiveCards.has(c.id))?' combo-active':'';
      const bonus=_bonuses[c.id]||0;
      const bonusHtml=bonus>0?`<span class="bonus-num" style="color:#DAA520;font-size:.7em;font-weight:bold;margin-left:3px">+${bonus}</span>`:'';
        return`<div class="card-mini ${c.ability?'has-ability':''}${animClass}${comboClass}" style="perspective:600px">
          <div class="c-faction-dot" style="background:${f.color}"></div>
          <div class="c-name" title="${cn(c)}">${cn(c)}</div>
          <div class="c-str">${c.strength}${bonusHtml}${c.protectArmor?`<span style="color:#4A90D9;font-size:.7em">🛡${c.protectArmor}</span>`:''}</div>
        </div>`;
      }).join('');
    const isMatch=G.selectedCard!==null&&G.selectedCard!==undefined&&G.players[playerIdx].hand[G.selectedCard]&&G.players[playerIdx].hand[G.selectedCard].row===rowType;
  const canPlayRow=isMatch&&canPlay;
  // Only bind onclick to the matching row to prevent accidental clicks on other rows
  return`<div class="row ${canPlayRow?'highlight':''}" ${canPlay&&isMatch?`onclick="onRowClick('${rowType}')"`:''}>
    <div class="row-label">${t('ui.row.'+rowType)}</div>
    <div class="row-cards">${cardsHtml}</div>
    <div class="row-power"><div class="val">${power}</div></div>
  </div>`;
}

function renderHandCard(card,idx){
  const f=FACTIONS[card.faction];
  const cost=getCardCost(card.strength);
  const playable=G.currentTurn==='player'&&!G.players[0].passed&&cost<=G.provisions[0];
  const selected=G.selectedCard===idx;
  const cls=selected?'selected':(!playable?'unplayable':'');
  const rowName=t("ui.row."+card.row);
  const desc=cd(card)+(card.protectArmor?` 🛡${card.protectArmor}`:'');
  return`<div class="card ${cls}" onclick="onCardClick(${idx})" title="${cn(card)} - ${cd(card)}"
    style="--faction-color:${f.color};--faction-glow:${f.color}40;width:96px;min-width:96px;max-width:96px;flex:0 0 96px;overflow:hidden">
    <div class="card-cost">${cost}</div>

        <div class="card-name">${cn(card)}</div>
    <div class="card-tags"><span class="card-type-tag">${rowName}</span></div>
    <div class="card-ability">${desc}</div>
    <div class="card-stats-bar"><span class="card-atk">⚔ ${card.strength}</span></div>
  </div>`;
}

function onCardClick(idx){
  // Hot-seat mode
  if(G._hsPhase==='game'){
      let act=G.activePlayer;
      let c=G.players[act].hand[idx];
      if(!c)return;
      if(getCardCost(c.strength)>G.provisions[act])return;
      if(G.selectedCard===idx){G.selectedCard=null}else{G.selectedCard=idx}
      render();return;
  }
  if(G.phase!=='playing'||G.currentTurn!=='player'||G.players[0].passed)return;
  const card=G.players[0].hand[idx];
  if(!card)return;  // 防御：手牌数组可能有空洞（AI 连锁效应导致 splice 后索引错位）
  if(getCardCost(card.strength)>G.provisions[0])return;
  if(G.selectedCard===idx){
    G.selectedCard=null;
  }else{
    G.selectedCard=idx;
  }
  render();
}

function onRowClick(rowType){
  console.log('[onRowClick] rowType=', rowType, 'selectedCard=', G.selectedCard, 'busy=', G._busy, 'typeof t=', typeof t);
  // Hot-seat 模式
  if(G._hsPhase==='game'){
      if(G.selectedCard===null||G.selectedCard===undefined){console.log('[onRowClick] RET: hs no sel');return;}
      let act=G.activePlayer;
      let c=G.players[act].hand[G.selectedCard];
      if(!c){console.log('[onRowClick] RET: hs card null');return;}
      console.log('[onRowClick] hs card', cn(c), 'row=', c.row, 'vs', rowType);
      if(c.row!==rowType){addLog(t('ui.log.card_row_only', {row: getRowName(c.row)}));return}
      hotSeatPlayCard(G.selectedCard,rowType);
      return;
  }
  if(G.selectedCard===null||G.selectedCard===undefined){console.log('[onRowClick] RET: no sel');return;}
  const card=G.players[0].hand[G.selectedCard];
  if(!card){console.log('[onRowClick] RET: card null idx=', G.selectedCard, 'hand.length=', G.players[0].hand.length);return;}
  console.log('[onRowClick] card', cn(card), 'id=', card.id, 'row=', card.row, 'vs rowType=', rowType, 'match=', card.row===rowType);
  // 只能放到对应行
  if(card.row!==rowType){
    addLog(t('ui.log.card_row_only', {row: getRowName(card.row)}));
    return;
  }
  console.log('[onRowClick] calling playerPlayCard');
  playerPlayCard(G.selectedCard,rowType);
}

                renderRow('cavalry', p1.board.cavalry, false, lastUid, lastR) +
                renderRow('infantry', p1.board.infantry, false, lastUid, lastR) +
                renderRow('strategy', p1.board.strategy, false, lastUid, lastR) +
              '</div>' +
              '<div class="decorative-line"></div>' +
              '<div class="board-section player-rows">' +
                '<div class="section-label">' + t("ui.game.your_side",{power:pow0}) + '</div>' +
                renderRow('infantry', p0.board.infantry, true, lastUid, lastR) +
                renderRow('cavalry', p0.board.cavalry, true, lastUid, lastR) +
                renderRow('navy', p0.board.navy, true, lastUid, lastR) +
                renderRow('strategy', p0.board.strategy, true, lastUid, lastR) +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="turn-indicator"><span>' + appearText + '</span></div>' +
          '<div class="hand-area">' +
            '<div class="hand-label">' + t("ui.game.your_hand",{count:p0.hand.length}) + '</div>' +
            '<div class="hand-cards' + (p0.hand.length === 0 ? ' empty' : '') +
                (p0.hand.length >= 5 ? ' many-cards' : '') +
                (p0.hand.length >= 7 ? ' overflow-cards' : '') + '">' +
              (p0.hand.length === 0 ? '<span style="color:#B8A88A">' + t("ui.game.no_hand") + '</span>' :
               p0.hand.map(function(c, i) { return handleHotSeatHandCard(c, i, 0); }).join('')) +
            '</div>' +
          '</div>' +
          '<div class="action-bar">' +
            '<button class="btn btn-sm btn-primary" onclick="useLeaderAbility(0)" ' +
              (G.leaderAbilityUsed[0] ? 'disabled' : '') + '>' +
              (G.leaderAbilityUsed[0] ? '已使用' : '主将技能') + ' · ' + (p0.leader ? ln(p0.leader) : '') + '</button>' +
            '<button class="btn btn-sm btn-pass" onclick="multiplayerPassTurn()">放弃本局</button>' +
          '</div>' +
          '<div class="log-area">' +
            (G.logs || []).slice(-4).map(function(l) { return '<div class="log-entry">' + l + '</div>'; }).join('') +
          '</div>';
        }

                        // ===== 10: p2p-protocol — 消息协议层 (7 种消息) =====
                        // spec: 10-redo-p2p-protocol.md + spec.md §消息协议
                        const MSG_SCHEMA = {
                          state_init:       { fields: ['rngSeed','deckHashP0','deckHashP1','leaderP0','leaderP1','firstTurnIdx'] },
                          action:           { fields: ['type','payload'] },
                          state_diff:       { fields: ['seq','beforeHash','afterHash','publicEffects'] },
                          ack:              { fields: ['ref_seq','ok','error'] },
                          match_result:     { fields: ['winnerIdx','finalScore','settlementHash'] },
                          concede:          { fields: ['reason'] },
                          reconnect_resume: { fields: ['missedSeqs','catchupDiffs'] }
                        };

                        var MAX_STATE_DIFF_BYTES = 4096;
                        var MAX_STATE_INIT_BYTES = 256;

                        function ensureP2PState() {
                          if (!G._p2pState) G._p2pState = { clientSeq: {}, missedSeqs: {}, lastReceivedSeq: {} };
                        }

                        function getNextSeq(steamId64) {
                          ensureP2PState();
                          if (!G._p2pState.clientSeq[steamId64]) G._p2pState.clientSeq[steamId64] = 0;
                          return ++G._p2pState.clientSeq[steamId64];
                        }

                        function recordReceivedSeq(steamId64, seq) {
                          ensureP2PState();
                          var last = G._p2pState.lastReceivedSeq[steamId64] || 0;
                          G._p2pState.lastReceivedSeq[steamId64] = seq;
                          if (seq > last + 1) {
                            var missed = [];
                            for (var s = last + 1; s < seq; s++) missed.push(s);
                            if (!G._p2pState.missedSeqs[steamId64]) G._p2pState.missedSeqs[steamId64] = [];
                            G._p2pState.missedSeqs[steamId64].push.apply(G._p2pState.missedSeqs[steamId64], missed);
                          }
                        }

                        /**
                         * packMessage(type, payload) → JSON string
                         * 序列化一条消息。校验类型合法性 + 大小预算。
                         * @param {string} type — 7 种消息类型之一
                         * @param {object} payload — 消息体
                         * @returns {string} JSON 字符串
                         * @throws {Error} 未知类型 / state_diff > 4KB / state_init > 256B
                         */
                        function packMessage(type, payload) {
                          if (!MSG_SCHEMA[type]) throw new Error('packMessage: unknown message type "' + type + '"');
                          var json = JSON.stringify({ type: type, payload: payload, ts: Date.now() });
                          if (type === 'state_diff' && json.length > MAX_STATE_DIFF_BYTES)
                            throw new Error('packMessage: state_diff exceeds 4 KB (' + json.length + ' bytes)');
                          if (type === 'state_init' && json.length > MAX_STATE_INIT_BYTES)
                            throw new Error('packMessage: state_init exceeds 256 bytes (' + json.length + ' bytes)');
                          return json;
                        }

                        /**
                         * unpackMessage(input) → { type, payload, ts }
                         * 反序列化消息。支持 string / Buffer / ArrayBuffer 三种输入。
                         * @param {string|Buffer|ArrayBuffer} input
                         * @returns {{ type: string, payload: object, ts: number }}
                         * @throws {Error} JSON 解析失败 / 空输入 / 缺 type 字段
                         */
                        function unpackMessage(input) {
                          if (!input) throw new Error('unpackMessage: empty input');
                          if (typeof input === 'string') {
                            if (input.length === 0) throw new Error('unpackMessage: empty input');
                            var parsed; try { parsed = JSON.parse(input); } catch (e) {
                              throw new Error('unpackMessage: JSON parse error — ' + e.message);
                            }
                            if (!parsed || typeof parsed !== 'object') throw new Error('unpackMessage: parsed value is not an object');
                            if (!parsed.type || typeof parsed.type !== 'string') throw new Error('unpackMessage: missing or invalid "type" field');
                            return { type: parsed.type, payload: parsed.payload || {}, ts: parsed.ts || 0 };
                          }
                          var buf;
                          if (typeof Buffer !== 'undefined' && input instanceof Buffer) buf = input;
                          else if (input instanceof ArrayBuffer) buf = Buffer.from(new Uint8Array(input));
                          else throw new Error('unpackMessage: unsupported input type: ' + typeof input);
                          var jsonStr = buf.toString('utf-8');
                          if (jsonStr.length === 0) throw new Error('unpackMessage: empty buffer');
                          var parsed; try { parsed = JSON.parse(jsonStr); } catch (e) {
                            throw new Error('unpackMessage: JSON parse error — ' + e.message);
                          }
                          if (!parsed || typeof parsed !== 'object') throw new Error('unpackMessage: parsed value is not an object');
                          if (!parsed.type || typeof parsed.type !== 'string') throw new Error('unpackMessage: missing or invalid "type" field');
                          return { type: parsed.type, payload: parsed.payload || {}, ts: parsed.ts || 0 };
                        }

                        /**
                         * packStateInit(seed, deckHashP0, deckHashP1, leaderP0, leaderP1, firstTurnIdx) → JSON
                         * 打包 state_init 消息，携带 RNG seed + deck hash + leader info + firstTurnIdx。
                         */
                        function packStateInit(seed, hash0, hash1, leader0, leader1, firstIdx) {
                          return packMessage('state_init', {
                            rngSeed: seed, deckHashP0: hash0 || '', deckHashP1: hash1 || '',
                            leaderP0: leader0 || '', leaderP1: leader1 || '', firstTurnIdx: firstIdx
                          });
                        }

                        /**
                         * host 端：发送 state_diff
                         * @param {string} beforeHash
                         * @param {string} afterHash
                         * @param {Array} publicEffects
                         * @param {string} steamId64 — 目标玩家 Steam ID
                         */
                        function sendStateDiff(beforeHash, afterHash, publicEffects, steamId64) {
                          if (!steamId64) return null;
                          return packMessage('state_diff', {
                            seq: getNextSeq(steamId64),
                            beforeHash: beforeHash || '',
                            afterHash: afterHash || '',
                            publicEffects: publicEffects || []
                          });
                        }

                        /**
                         * guest 端：收到 state_diff 后调用
                         * @param {object} msg — unpacked message, 需要 _fromSteamId 字段
                         * @param {function} handler — 处理 publicEffects 的回调
                         */
                        function onStateDiff(msg, handler) {
                          var p = msg.payload;
                          if (!p || !p.seq) return;
                          recordReceivedSeq(msg._fromSteamId || '', p.seq);
                          if (typeof handler === 'function') { try { handler(p.publicEffects || []); } catch (e) {} }
                        }

                                                // ===== 11: host-authority — 多人对战主流程 =====
                                                // spec: 11-redo-host-authority-full.md
                                                // 组合 T8 (hot-seat) + T9 (steam-invite IPC) + T10 (p2p-protocol)
                                                // 流程: Steam连接 → RNG比大小决定host → state_init握手 → 回合循环 → 结算

                                                /**
                                                 * 初始化多人模式：建立连接 → RNG比大小 → state_init握手
                                                 * host 调用 initMultiplayerHost()，guest 调用 initMultiplayerGuest()
                                                 * 在 lobby 阶段双方 leader 选完后自动推进
                                                 */
                                                function initMultiplayerHost() {
                                                  if (!G._mpState || !G._mpState.peerId) {
                                                    showNotification('连接尚未建立', 2000);
                                                    return;
                                                  }
                                                  // 生成 host RNG 值 (crypto.getRandomValues)
                                                  var arr = new Uint32Array(1);
                                                  crypto.getRandomValues(arr);
                                                  G._mpState.myRngValue = arr[0];
                                                  G._mpState.isHost = null;
                                                  G._mpState._mpPhase = 'rng_exchange';
                                                  // 发送自己的 RNG 值给 guest
                                                  var pkt = packMessage('action', { action: 'rng_value', data: {
                                                    v: '' + arr[0],
                                                    leaderP0: G.players[0].leader && (G.players[0].leader.id || G.players[0].leader.id),
                                                    leaderP1: G.players[1].leader && (G.players[1].leader.id || G.players[1].leader.id)
                                                  } });
                                                  sendP2P(pkt, G._mpState.peerId);
                                                  if (G._mpState._host === 'host') {
                                                    // host: set up RNG, wait for guest
                                                    var seed = Math.floor(Math.random() * 2147483647);
                                                    G._rng = rngFromSeed(seed);
                                                    G._mpSeed = seed;
                                                  }
                                                  showNotification('已发送随机数...等待对方', 2000);
                                                }

                                                function initMultiplayerGuest() {
                                                  if (!G._mpState || !G._mpState.peerId) {
                                                    showNotification('连接尚未建立', 2000);
                                                    return;
                                                  }
                                                  G._mpState._host = 'guest';
                                                  showNotification('已加入房间，等待主机确认...', 2000);
                                                }

                                                /**
                                                 * 处理 P2P 消息：根据当前 mpPhase 路由
                                                 */
                                                function handleMultiplayerMessage(msg) {
                                                  var type = msg.type;
                                                  var payload = msg.payload || {};
                                                  var mp = G._mpState;
                                                  if (!mp) return;

                                                  // --- RNG 比大小阶段 ---
                                                  // 收到对方的 rng_value
                                                  if (type === 'action' && (payload.type === 'rng_value' || payload.action === 'rng_value')) {
                                                    var v = payload.v || (payload.payload && payload.payload.v) || (payload.data && payload.data.v);
                                                    var rngData = payload.data || payload.payload || payload;
                                                    if (!G.players[0].leader && rngData.leaderP0) {
                                                      G.players[0].leader = LEADERS_DATA.find(function(l) { return l.id === rngData.leaderP0 || l.name === rngData.leaderP0; }) || null;
                                                    }
                                                    if (!G.players[1].leader && rngData.leaderP1) {
                                                      G.players[1].leader = LEADERS_DATA.find(function(l) { return l.id === rngData.leaderP1 || l.name === rngData.leaderP1; }) || null;
                                                    }
                                                                                                      if (!mp._host || mp._host === 'guest') {
                                                                                                        // I'm guest, got host's rng value
                                                                                                        var arr = new Uint32Array(1);
                                                                                                        crypto.getRandomValues(arr);
                                                                                                        mp.peerRngValue = v;
                                                                                                        mp.myRNGValue = arr[0];
                                                                                                        mp.isHost = (arr[0] > v);
                                                                                                        mp._host = mp.isHost ? 'host' : 'guest';
                                                                                                        // 发回我的 RNG 值
                                                                                                        var pkt = packMessage('action', { action: 'rng_value', data: { v: arr[0] } });
                                                                                                        sendP2P(pkt, mp.peerId);
                                                                                                        if (mp.isHost) {
                                                                                                          showNotification(t('ui.multiplayer.host_init'), 2000);
                                                                                                          sendMultiplayerStateInit();
                                                                                                        } else {
                                                                                                          showNotification('已回复随机数，等待主机初始化...', 2000);
                                                                                                        }
                                                                                                        return;
                                                                                                      }
                                                                                                      // host got guest's rng_value reply
                                                                                                      mp.peerRngValue = v;
                                                                                                      mp.isHost = (mp.myRngValue > v);
                                                                                                      mp._host = mp.isHost ? 'host' : 'guest';
                                                                                                      if (mp.isHost) {
                                                                                                        showNotification(t('ui.multiplayer.host_init'), 2000);
                                                                                                        sendMultiplayerStateInit();
                                                                                                      } else {
                                                                                                        mp._host = 'guest';
                                                                                                        showNotification(t('ui.multiplayer.guest_wait'), 2500);
                                                                                                      }
                                                                                                      return;
                                                                                                    }

                                                  // --- state_init 握手 ---
                                                  if (type === 'state_init') {
                                                    // guest 收到：用 host 给的 seed 初始化本地 RNG，同步初始 state
                                                    G._rng = rngFromSeed(payload.rngSeed);
                                                    G._mpSeed = payload.rngSeed;
                                                    G._mpState.rngSeed = payload.rngSeed;
                                                    G._mpState.isHost = false;
                                                    G._mpState._host = 'guest';
                                                    G.players[0].leader = LEADERS_DATA.find(function(l) {
                                                                                                        return (l.name||'') === (payload.leaderP0||'') || l.id === payload.leaderP0;
                                                                                                      }) || G.players[0].leader;
                                                                                                      G.players[1].leader = LEADERS_DATA.find(function(l) {
                                                                                                        return (l.name||'') === (payload.leaderP1||'') || l.id === payload.leaderP1;
                                                                                                      }) || G.players[1].leader;
                                                                                                      G.activePlayer = payload.firstTurnIdx || 0;
                                                                                                      G._firstPlayer = G.activePlayer;
                                                                                                      G.currentTurn = G.activePlayer === 0 ? 'player' : 'player';
                                                                                                      _setupMultiplayerGameState();
                                                                                                      // 发 ack
                                                    var ack = packMessage('ack', { ref_seq: 0, ok: true, error: '' });
                                                    sendP2P(ack, G._mpState.peerId);
                                                    G.phase = 'multiplayer_playing';
                                                    G._mpPhase = 'mulligan';
                                                    render();
                                                    return;
                                                  }

                                                  // --- action (guest → host) ---
                                                                                                    if (type === 'action' && mp._host === 'host') {
                                                                                                      handleMultiplayerAction(payload);
                                                                                                      return;
                                                                                                    }

                                                  // --- state_diff (host → guest) ---
                                                  if (type === 'state_diff' && mp._host === 'guest') {
                                                    onStateDiff(msg, function(effects) {
                                                      applyMultiplayerEffects(effects);
                                                    });
                                                    sendP2P(packMessage('ack', { ref_seq: payload.seq || 0, ok: true, error: '' }), mp.peerId);
                                                    return;
                                                  }

                                                  // --- ack (host 收到 guest 确认) ---
                                                                                                    if (type === 'ack' && mp._host === 'host') {
                                                                                                      // Host 收到 guest 的 ack — 推进回合
                                                                                                      if (!payload.ok && payload.error) {
                                                                                                        showNotification('对方出错: ' + payload.error, 3000);
                                                                                                      }
                                                                                                      // guest confirmed — check next player
                                                                                                      checkBothPassed();
                                                                                                      return;
                                                                                                    }

                                                  // --- match_result (guest 收到) ---
                                                  if (type === 'match_result' && mp._host === 'guest') {
                                                    processMatchResult(payload);
                                                    return;
                                                  }

                                                  // --- concede ---
                                                  if (type === 'concede') {
                                                    showNotification('对手投降！', 3000);
                                                    G._multiForfeit = true;
                                                    if (mp._host === 'host') G.scores[0] = 2;
                                                    else G.scores[1] = 2;
                                                    G._mpPhase = 'game_result';
                                                    G.phase = 'multiplayer_playing';
                                                    render();
                                                    return;
                                                  }
                                                }

                                                /**
                                                 * host 端：双方 leader 都选好后，发送 state_init 给 guest
                                                 */
                                                function sendMultiplayerStateInit() {
                                                  var mp = G._mpState;
                                                  if (!mp || !mp.isHost) return;
                                                  var seed = Math.floor(Math.random() * 2147483647);
                                                  G._rng = rngFromSeed(seed);
                                                  G._mpSeed = seed;
                                                  // 随机先手方
                                                  G.activePlayer = G._rng.next() < 0.5 ? 0 : 1;
                                                  G._firstPlayer = G.activePlayer;
                                                  G.currentTurn = G.activePlayer === 0 ? 'player' : 'player';
                                                  var p0 = G.players[0], p1 = G.players[1];
                                                  var deckHashP0 = _multiplayerDeckHash(buildDeck(p0.leader.faction));
                                                  var deckHashP1 = _multiplayerDeckHash(buildDeck(p1.leader.faction));
                                                  var msg = packStateInit(seed, deckHashP0, deckHashP1, p0.leader.id||p0.leader.id, p1.leader.id||p1.leader.id, G.activePlayer);
                                                  sendP2P(msg, mp.peerId);
                                                  _setupMultiplayerGameState();
                                                  G.phase = 'multiplayer_playing';
                                                  G._mpPhase = 'mulligan';
                                                  showNotification(t('ui.multiplayer.state_init_sent'), 2000);
                                                  render();
                                                }

                                                function _setupMultiplayerGameState() {
                                                  var p0 = G.players[0], p1 = G.players[1];
                                                  p0.deck = buildDeck(p0.leader.faction);
                                                  p1.deck = buildDeck(p1.leader.faction);
                                                  applyLeaderDeckAbility(p0.leader, p0.deck);
                                                  applyLeaderDeckAbility(p1.leader, p1.deck);
                                                  G.scores = [0, 0]; G.round = 0;
                                                  G.players[0].passed = false; G.players[1].passed = false;
                                                  G.selectedCard = null; G.logs = []; G.turnCount = 0;
                                                  G.globalBuffs = {playerArmor:0,aiArmor:0,playerUnify:0,aiUnify:0,ambushTriggered:false,
                                                    playerFarm:0,aiFarm:0,playerBerserkCard:null,aiBerserkCard:null};
                                                  G.graveyard = [];
                                                  G.mulliganSelected = new Set();
                                                  G.leaderAbilityUsed = [false, false];
                                                  drawCards(0, 7); drawCards(1, 7);
                                                  G.provisions = [30, 30];
                                                  G._mpPhase = 'mulligan';
                                                  addLog(t('ui.log.mp_mulligan_start'));
                                                }

                                                function _multiplayerDeckHash(deck) {
                                                  var text = (deck || []).map(function(card) {
                                                    return [card.id, cn(card), card.strength, card.row, card.faction].join(':');
                                                  }).join('|');
                                                  var hash = 2166136261;
                                                  for (var i = 0; i < text.length; i++) {
                                                    hash ^= text.charCodeAt(i);
                                                    hash = Math.imul(hash, 16777619);
                                                  }
                                                  return ('00000000' + (hash >>> 0).toString(16)).slice(-8);
                                                }

                                                /**
                                                 * guest 端：收到 state_init 后调用
                                                 */
                                                function _handleMultiplayerStateInit(payload) {
                                                  G._rng = rngFromSeed(payload.rngSeed);
                                                  G._mpSeed = payload.rngSeed;
                                                  G.activePlayer = payload.firstTurnIdx || 0;
                                                  G._firstPlayer = G.activePlayer;
                                                  G.currentTurn = G.activePlayer === 0 ? 'player' : 'player';
                                                  _setupMultiplayerGameState();
                                                  G.phase = 'multiplayer_playing';
                                                  G._mpPhase = 'mulligan';
                                                  render();
                                                }

                                                /**
                                                 * host 端：收到 guest 的 action 后处理
                                                 */
                                                function handleMultiplayerAction(payload) {
                                                  var mp = G._mpState;
                                                  if (!mp || !mp.isHost) return;
                                                  var actType = payload.action || payload.type;
                                                  var data = payload.data || payload.payload || {};

                                                  if (actType === 'play_card') {
                                                    var cardIdx = data.handIdx !== undefined ? data.handIdx : data.cardIdx, row = data.row;
                                                    var hand = G.players[1].hand.filter(function(c) { return c; });
                                                    if (cardIdx < hand.length) {
                                                      playCard(1, cardIdx, row);
                                                      G.turnCount++;
                                                    }
                                                  } else if (actType === 'pass') {
                                                    G.players[1].passed = true;
                                                    addLog(t('ui.log.guest_pass'));
                                                  } else if (actType === 'use_leader_ability') {
                                                    useLeaderAbility(1);
                                                  } else if (actType === 'mulligan_confirm') {
                                                                                                      // guest 换牌确认 — host 侧处理
                                                                                                      multiplayerMulliganConfirm(1);
                                                                                                    }

                                                  // 生成 state_diff (simplified: send all public state)
                                                  var effects = collectPublicEffects();
                                                  var diff = sendStateDiff('', '', effects, mp.peerId);
                                                  if (diff) sendP2P(diff, mp.peerId);
                                                  render();
                                                }

                                                function collectPublicEffects() {
                                                  return {
                                                    t: G.turnCount,
                                                    p: G.players[1].passed ? 1 : 0,
                                                    b: G.players[1].board,
                                                    h: G.players[1].hand.length,
                                                    prov: G.provisions[1],
                                                    la: G.leaderAbilityUsed[1] ? 1 : 0,
                                                    logs: (G.logs || []).slice(-3)
                                                  };
                                                }

                                                /**
                                                 * guest 端应用 state_diff 带来的 effects
                                                 */
                                                function applyMultiplayerEffects(effects) {
                                                  if (!effects) return;
                                                  if (effects.t !== undefined) G.turnCount = effects.t;
                                                  if (effects.p !== undefined) G.players[1].passed = effects.p === 1;
                                                  if (effects.b) G.players[1].board = effects.b;
                                                  if (effects.h !== undefined) { /* hand count only — privacy */ }
                                                  if (effects.prov !== undefined) G.provisions[1] = effects.prov;
                                                  if (effects.la !== undefined) G.leaderAbilityUsed[1] = effects.la === 1;
                                                  if (effects.logs) { effects.logs.forEach(function(l) { addLog(l); }); }
                                                }

                                                function sendP2P(data, steamId64) {
                                                  if (!steamId64) return;
                                                  var api = typeof electronAPI !== 'undefined' && electronAPI.multiplayer;
                                                  if (!api) return;
                                                  var str = typeof data === 'string' ? data : JSON.stringify(data);
                                                  api.sendP2PMessage(steamId64, str).catch(function(e) {
                                                    console.log('[P2P] send failed:', e.message);
                                                  });
                                                }

                                                /**
                                                 * 定时轮询 P2P 消息
                                                 */
                                                function startMultiplayerPolling() {
                                                  if (G._mpPollTimer) return;
                                                  G._mpPollTimer = setInterval(function() {
