                        // ===== 10: p2p-protocol — 消息协议层 (7 种消息) =====
                        // spec: 10-redo-p2p-protocol.md + spec.md §消息协议
                        const MSG_SCHEMA = {
                          state_init:       { fields: ['rngSeed','deckHashP0','deckHashP1','leaderP0','leaderP1','firstTurnIdx'] },
                          action:           { fields: ['type','payload'] },
                          state_diff:       { fields: ['seq','beforeHash','afterHash','publicEffects'] },
                          ack:              { fields: ['ref_seq','ok','error'] },
                          match_result:     { fields: ['winnerIdx','finalScore','settlementHash'] },
                          concede:          { fields: ['reason'] },
                          reconnect_resume: { fields: ['missedSeqs','catchupDiffs'] }
                        };

                        var MAX_STATE_DIFF_BYTES = 4096;
                        var MAX_STATE_INIT_BYTES = 256;

                        function ensureP2PState() {
                          if (!G._p2pState) G._p2pState = { clientSeq: {}, missedSeqs: {}, lastReceivedSeq: {} };
                        }

                        function getNextSeq(steamId64) {
                          ensureP2PState();
                          if (!G._p2pState.clientSeq[steamId64]) G._p2pState.clientSeq[steamId64] = 0;
                          return ++G._p2pState.clientSeq[steamId64];
                        }

                        function recordReceivedSeq(steamId64, seq) {
                          ensureP2PState();
                          var last = G._p2pState.lastReceivedSeq[steamId64] || 0;
                          G._p2pState.lastReceivedSeq[steamId64] = seq;
                          if (seq > last + 1) {
                            var missed = [];
                            for (var s = last + 1; s < seq; s++) missed.push(s);
                            if (!G._p2pState.missedSeqs[steamId64]) G._p2pState.missedSeqs[steamId64] = [];
                            G._p2pState.missedSeqs[steamId64].push.apply(G._p2pState.missedSeqs[steamId64], missed);
                          }
                        }

                        /**
                         * packMessage(type, payload) → JSON string
                         * 序列化一条消息。校验类型合法性 + 大小预算。
                         * @param {string} type — 7 种消息类型之一
                         * @param {object} payload — 消息体
                         * @returns {string} JSON 字符串
                         * @throws {Error} 未知类型 / state_diff > 4KB / state_init > 256B
                         */
                        function packMessage(type, payload) {
                          if (!MSG_SCHEMA[type]) throw new Error('packMessage: unknown message type "' + type + '"');
                          var json = JSON.stringify({ type: type, payload: payload, ts: Date.now() });
                          if (type === 'state_diff' && json.length > MAX_STATE_DIFF_BYTES)
                            throw new Error('packMessage: state_diff exceeds 4 KB (' + json.length + ' bytes)');
                          if (type === 'state_init' && json.length > MAX_STATE_INIT_BYTES)
                            throw new Error('packMessage: state_init exceeds 256 bytes (' + json.length + ' bytes)');
                          return json;
                        }

                        /**
                         * unpackMessage(input) → { type, payload, ts }
                         * 反序列化消息。支持 string / Buffer / ArrayBuffer 三种输入。
                         * @param {string|Buffer|ArrayBuffer} input
                         * @returns {{ type: string, payload: object, ts: number }}
                         * @throws {Error} JSON 解析失败 / 空输入 / 缺 type 字段
                         */
                        function unpackMessage(input) {
                          if (!input) throw new Error('unpackMessage: empty input');
                          if (typeof input === 'string') {
                            if (input.length === 0) throw new Error('unpackMessage: empty input');
                            var parsed; try { parsed = JSON.parse(input); } catch (e) {
                              throw new Error('unpackMessage: JSON parse error — ' + e.message);
                            }
                            if (!parsed || typeof parsed !== 'object') throw new Error('unpackMessage: parsed value is not an object');
                            if (!parsed.type || typeof parsed.type !== 'string') throw new Error('unpackMessage: missing or invalid "type" field');
                            return { type: parsed.type, payload: parsed.payload || {}, ts: parsed.ts || 0 };
                          }
                          var buf;
                          if (typeof Buffer !== 'undefined' && input instanceof Buffer) buf = input;
                          else if (input instanceof ArrayBuffer) buf = Buffer.from(new Uint8Array(input));
                          else throw new Error('unpackMessage: unsupported input type: ' + typeof input);
                          var jsonStr = buf.toString('utf-8');
                          if (jsonStr.length === 0) throw new Error('unpackMessage: empty buffer');
                          var parsed; try { parsed = JSON.parse(jsonStr); } catch (e) {
                            throw new Error('unpackMessage: JSON parse error — ' + e.message);
                          }
                          if (!parsed || typeof parsed !== 'object') throw new Error('unpackMessage: parsed value is not an object');
                          if (!parsed.type || typeof parsed.type !== 'string') throw new Error('unpackMessage: missing or invalid "type" field');
                          return { type: parsed.type, payload: parsed.payload || {}, ts: parsed.ts || 0 };
                        }

                        /**
                         * packStateInit(seed, deckHashP0, deckHashP1, leaderP0, leaderP1, firstTurnIdx) → JSON
                         * 打包 state_init 消息，携带 RNG seed + deck hash + leader info + firstTurnIdx。
                         */
                        function packStateInit(seed, hash0, hash1, leader0, leader1, firstIdx) {
                          return packMessage('state_init', {
                            rngSeed: seed, deckHashP0: hash0 || '', deckHashP1: hash1 || '',
                            leaderP0: leader0 || '', leaderP1: leader1 || '', firstTurnIdx: firstIdx
                          });
                        }

                        /**
                         * host 端：发送 state_diff
                         * @param {string} beforeHash
                         * @param {string} afterHash
                         * @param {Array} publicEffects
                         * @param {string} steamId64 — 目标玩家 Steam ID
                         */
                        function sendStateDiff(beforeHash, afterHash, publicEffects, steamId64) {
                          if (!steamId64) return null;
                          return packMessage('state_diff', {
                            seq: getNextSeq(steamId64),
                            beforeHash: beforeHash || '',
                            afterHash: afterHash || '',
                            publicEffects: publicEffects || []
                          });
                        }

                        /**
                         * guest 端：收到 state_diff 后调用
                         * @param {object} msg — unpacked message, 需要 _fromSteamId 字段
                         * @param {function} handler — 处理 publicEffects 的回调
                         */
                        function onStateDiff(msg, handler) {
                          var p = msg.payload;
                          if (!p || !p.seq) return;
                          recordReceivedSeq(msg._fromSteamId || '', p.seq);
                          if (typeof handler === 'function') { try { handler(p.publicEffects || []); } catch (e) {} }
                        }

                                                // ===== 11: host-authority — 多人对战主流程 =====
                                                // spec: 11-redo-host-authority-full.md
                                                // 组合 T8 (hot-seat) + T9 (steam-invite IPC) + T10 (p2p-protocol)
                                                // 流程: Steam连接 → RNG比大小决定host → state_init握手 → 回合循环 → 结算

                                                /**
                                                 * 初始化多人模式：建立连接 → RNG比大小 → state_init握手
                                                 * host 调用 initMultiplayerHost()，guest 调用 initMultiplayerGuest()
                                                 * 在 lobby 阶段双方 leader 选完后自动推进
                                                 */
                                                function initMultiplayerHost() {
                                                  if (!G._mpState || !G._mpState.peerId) {
                                                    showNotification('连接尚未建立', 2000);
                                                    return;
                                                  }
                                                  // 生成 host RNG 值 (crypto.getRandomValues)
                                                  var arr = new Uint32Array(1);
                                                  crypto.getRandomValues(arr);
                                                  G._mpState.myRngValue = arr[0];
                                                  G._mpState.isHost = null;
                                                  G._mpState._mpPhase = 'rng_exchange';
                                                  // 发送自己的 RNG 值给 guest
                                                  var pkt = packMessage('action', { action: 'rng_value', data: {
                                                    v: '' + arr[0],
                                                    leaderP0: G.players[0].leader && (G.players[0].leader.id || G.players[0].leader.name),
                                                    leaderP1: G.players[1].leader && (G.players[1].leader.id || G.players[1].leader.name)
                                                  } });
                                                  sendP2P(pkt, G._mpState.peerId);
                                                  if (G._mpState._host === 'host') {
                                                    // host: set up RNG, wait for guest
                                                    var seed = Math.floor(Math.random() * 2147483647);
                                                    G._rng = rngFromSeed(seed);
                                                    G._mpSeed = seed;
                                                  }
                                                  showNotification('已发送随机数...等待对方', 2000);
                                                }

                                                function initMultiplayerGuest() {
                                                  if (!G._mpState || !G._mpState.peerId) {
                                                    showNotification('连接尚未建立', 2000);
                                                    return;
                                                  }
                                                  G._mpState._host = 'guest';
                                                  showNotification('已加入房间，等待主机确认...', 2000);
                                                }

                                                /**
                                                 * 处理 P2P 消息：根据当前 mpPhase 路由
                                                 */
                                                function handleMultiplayerMessage(msg) {
                                                  var type = msg.type;
                                                  var payload = msg.payload || {};
                                                  var mp = G._mpState;
                                                  if (!mp) return;

                                                  // --- RNG 比大小阶段 ---
                                                  // 收到对方的 rng_value
                                                  if (type === 'action' && (payload.type === 'rng_value' || payload.action === 'rng_value')) {
                                                    var v = payload.v || (payload.payload && payload.payload.v) || (payload.data && payload.data.v);
                                                    var rngData = payload.data || payload.payload || payload;
                                                    if (!G.players[0].leader && rngData.leaderP0) {
                                                      G.players[0].leader = LEADERS_DATA.find(function(l) { return l.id === rngData.leaderP0 || l.name === rngData.leaderP0; }) || null;
                                                    }
                                                    if (!G.players[1].leader && rngData.leaderP1) {
                                                      G.players[1].leader = LEADERS_DATA.find(function(l) { return l.id === rngData.leaderP1 || l.name === rngData.leaderP1; }) || null;
                                                    }
                                                                                                      if (!mp._host || mp._host === 'guest') {
                                                                                                        // I'm guest, got host's rng value
                                                                                                        var arr = new Uint32Array(1);
                                                                                                        crypto.getRandomValues(arr);
                                                                                                        mp.peerRngValue = v;
                                                                                                        mp.myRNGValue = arr[0];
                                                                                                        mp.isHost = (arr[0] > v);
                                                                                                        mp._host = mp.isHost ? 'host' : 'guest';
                                                                                                        // 发回我的 RNG 值
                                                                                                        var pkt = packMessage('action', { action: 'rng_value', data: { v: arr[0] } });
                                                                                                        sendP2P(pkt, mp.peerId);
                                                                                                        if (mp.isHost) {
                                                                                                          showNotification('你是主机！初始化对局中...', 2000);
                                                                                                          sendMultiplayerStateInit();
                                                                                                        } else {
                                                                                                          showNotification('已回复随机数，等待主机初始化...', 2000);
                                                                                                        }
                                                                                                        return;
                                                                                                      }
                                                                                                      // host got guest's rng_value reply
                                                                                                      mp.peerRngValue = v;
                                                                                                      mp.isHost = (mp.myRngValue > v);
                                                                                                      mp._host = mp.isHost ? 'host' : 'guest';
                                                                                                      if (mp.isHost) {
                                                                                                        showNotification('你是主机！初始化对局中...', 2000);
                                                                                                        sendMultiplayerStateInit();
                                                                                                      } else {
                                                                                                        mp._host = 'guest';
                                                                                                        showNotification('你是客机，等待主机初始化...', 2500);
                                                                                                      }
                                                                                                      return;
                                                                                                    }

                                                  // --- state_init 握手 ---
                                                  if (type === 'state_init') {
                                                    // guest 收到：用 host 给的 seed 初始化本地 RNG，同步初始 state
                                                    G._rng = rngFromSeed(payload.rngSeed);
                                                    G._mpSeed = payload.rngSeed;
                                                    G._mpState.rngSeed = payload.rngSeed;
                                                    G._mpState.isHost = false;
                                                    G._mpState._host = 'guest';
                                                    G.players[0].leader = LEADERS_DATA.find(function(l) {
                                                                                                        return (l.name||'') === (payload.leaderP0||'') || l.id === payload.leaderP0;
                                                                                                      }) || G.players[0].leader;
                                                                                                      G.players[1].leader = LEADERS_DATA.find(function(l) {
                                                                                                        return (l.name||'') === (payload.leaderP1||'') || l.id === payload.leaderP1;
                                                                                                      }) || G.players[1].leader;
                                                                                                      G.activePlayer = payload.firstTurnIdx || 0;
                                                                                                      G._firstPlayer = G.activePlayer;
                                                                                                      G.currentTurn = G.activePlayer === 0 ? 'player' : 'player';
                                                                                                      _setupMultiplayerGameState();
                                                                                                      // 发 ack
                                                    var ack = packMessage('ack', { ref_seq: 0, ok: true, error: '' });
                                                    sendP2P(ack, G._mpState.peerId);
                                                    G.phase = 'multiplayer_playing';
                                                    G._mpPhase = 'mulligan';
                                                    render();
                                                    return;
                                                  }

                                                  // --- action (guest → host) ---
                                                                                                    if (type === 'action' && mp._host === 'host') {
                                                                                                      handleMultiplayerAction(payload);
                                                                                                      return;
                                                                                                    }

                                                  // --- state_diff (host → guest) ---
                                                  if (type === 'state_diff' && mp._host === 'guest') {
                                                    onStateDiff(msg, function(effects) {
                                                      applyMultiplayerEffects(effects);
                                                    });
                                                    sendP2P(packMessage('ack', { ref_seq: payload.seq || 0, ok: true, error: '' }), mp.peerId);
                                                    return;
                                                  }

                                                  // --- ack (host 收到 guest 确认) ---
                                                                                                    if (type === 'ack' && mp._host === 'host') {
                                                                                                      // Host 收到 guest 的 ack — 推进回合
                                                                                                      if (!payload.ok && payload.error) {
                                                                                                        showNotification('对方出错: ' + payload.error, 3000);
                                                                                                      }
                                                                                                      // guest confirmed — check next player
                                                                                                      checkBothPassed();
                                                                                                      return;
                                                                                                    }

                                                  // --- match_result (guest 收到) ---
                                                  if (type === 'match_result' && mp._host === 'guest') {
                                                    processMatchResult(payload);
                                                    return;
                                                  }

                                                  // --- concede ---
                                                  if (type === 'concede') {
                                                    showNotification('对手投降！', 3000);
                                                    G._multiForfeit = true;
                                                    if (mp._host === 'host') G.scores[0] = 2;
                                                    else G.scores[1] = 2;
                                                    G._mpPhase = 'game_result';
                                                    G.phase = 'multiplayer_playing';
                                                    render();
                                                    return;
                                                  }
                                                }

                                                /**
                                                 * host 端：双方 leader 都选好后，发送 state_init 给 guest
                                                 */
                                                function sendMultiplayerStateInit() {
                                                  var mp = G._mpState;
                                                  if (!mp || !mp.isHost) return;
                                                  var seed = Math.floor(Math.random() * 2147483647);
                                                  G._rng = rngFromSeed(seed);
                                                  G._mpSeed = seed;
                                                  // 随机先手方
                                                  G.activePlayer = G._rng.next() < 0.5 ? 0 : 1;
                                                  G._firstPlayer = G.activePlayer;
                                                  G.currentTurn = G.activePlayer === 0 ? 'player' : 'player';
                                                  var p0 = G.players[0], p1 = G.players[1];
                                                  var deckHashP0 = _multiplayerDeckHash(buildDeck(p0.leader.faction));
                                                  var deckHashP1 = _multiplayerDeckHash(buildDeck(p1.leader.faction));
                                                  var msg = packStateInit(seed, deckHashP0, deckHashP1, p0.leader.id||p0.leader.name, p1.leader.id||p1.leader.name, G.activePlayer);
                                                  sendP2P(msg, mp.peerId);
                                                  _setupMultiplayerGameState();
                                                  G.phase = 'multiplayer_playing';
                                                  G._mpPhase = 'mulligan';
                                                  showNotification('state_init 已发送！对局开始', 2000);
                                                  render();
                                                }

                                                function _setupMultiplayerGameState() {
                                                  var p0 = G.players[0], p1 = G.players[1];
                                                  p0.deck = buildDeck(p0.leader.faction);
                                                  p1.deck = buildDeck(p1.leader.faction);
                                                  applyLeaderDeckAbility(p0.leader, p0.deck);
                                                  applyLeaderDeckAbility(p1.leader, p1.deck);
                                                  G.scores = [0, 0]; G.round = 0;
                                                  G.players[0].passed = false; G.players[1].passed = false;
                                                  G.selectedCard = null; G.logs = []; G.turnCount = 0;
                                                  G.globalBuffs = {playerArmor:0,aiArmor:0,playerUnify:0,aiUnify:0,ambushTriggered:false,
                                                    playerFarm:0,aiFarm:0,playerBerserkCard:null,aiBerserkCard:null};
                                                  G.graveyard = [];
                                                  G.mulliganSelected = new Set();
                                                  G.leaderAbilityUsed = [false, false];
                                                  drawCards(0, 7); drawCards(1, 7);
                                                  G.provisions = [30, 30];
                                                  G._mpPhase = 'mulligan';
                                                  addLog('═══ 多人对战 · 换牌阶段 ═══');
                                                }

                                                function _multiplayerDeckHash(deck) {
                                                  var text = (deck || []).map(function(card) {
                                                    return [card.id, card.name, card.strength, card.row, card.faction].join(':');
                                                  }).join('|');
                                                  var hash = 2166136261;
                                                  for (var i = 0; i < text.length; i++) {
                                                    hash ^= text.charCodeAt(i);
                                                    hash = Math.imul(hash, 16777619);
                                                  }
                                                  return ('00000000' + (hash >>> 0).toString(16)).slice(-8);
                                                }

                                                /**
                                                 * guest 端：收到 state_init 后调用
                                                 */
                                                function _handleMultiplayerStateInit(payload) {
                                                  G._rng = rngFromSeed(payload.rngSeed);
                                                  G._mpSeed = payload.rngSeed;
                                                  G.activePlayer = payload.firstTurnIdx || 0;
                                                  G._firstPlayer = G.activePlayer;
                                                  G.currentTurn = G.activePlayer === 0 ? 'player' : 'player';
                                                  _setupMultiplayerGameState();
                                                  G.phase = 'multiplayer_playing';
                                                  G._mpPhase = 'mulligan';
                                                  render();
                                                }

                                                /**
                                                 * host 端：收到 guest 的 action 后处理
                                                 */
                                                function handleMultiplayerAction(payload) {
                                                  var mp = G._mpState;
                                                  if (!mp || !mp.isHost) return;
                                                  var actType = payload.action || payload.type;
                                                  var data = payload.data || payload.payload || {};

                                                  if (actType === 'play_card') {
                                                    var cardIdx = data.handIdx !== undefined ? data.handIdx : data.cardIdx, row = data.row;
                                                    var hand = G.players[1].hand.filter(function(c) { return c; });
                                                    if (cardIdx < hand.length) {
                                                      playCard(1, cardIdx, row);
                                                      G.turnCount++;
                                                    }
                                                  } else if (actType === 'pass') {
                                                    G.players[1].passed = true;
                                                    addLog('客机放弃本局');
                                                  } else if (actType === 'use_leader_ability') {
                                                    useLeaderAbility(1);
                                                  } else if (actType === 'mulligan_confirm') {
                                                                                                      // guest 换牌确认 — host 侧处理
                                                                                                      multiplayerMulliganConfirm(1);
                                                                                                    }

                                                  // 生成 state_diff (simplified: send all public state)
                                                  var effects = collectPublicEffects();
                                                  var diff = sendStateDiff('', '', effects, mp.peerId);
                                                  if (diff) sendP2P(diff, mp.peerId);
                                                  render();
                                                }

                                                function collectPublicEffects() {
                                                  return {
                                                    t: G.turnCount,
                                                    p: G.players[1].passed ? 1 : 0,
                                                    b: G.players[1].board,
                                                    h: G.players[1].hand.length,
                                                    prov: G.provisions[1],
                                                    la: G.leaderAbilityUsed[1] ? 1 : 0,
                                                    logs: (G.logs || []).slice(-3)
                                                  };
                                                }

                                                /**
                                                 * guest 端应用 state_diff 带来的 effects
                                                 */
                                                function applyMultiplayerEffects(effects) {
                                                  if (!effects) return;
                                                  if (effects.t !== undefined) G.turnCount = effects.t;
                                                  if (effects.p !== undefined) G.players[1].passed = effects.p === 1;
                                                  if (effects.b) G.players[1].board = effects.b;
                                                  if (effects.h !== undefined) { /* hand count only — privacy */ }
                                                  if (effects.prov !== undefined) G.provisions[1] = effects.prov;
                                                  if (effects.la !== undefined) G.leaderAbilityUsed[1] = effects.la === 1;
                                                  if (effects.logs) { effects.logs.forEach(function(l) { addLog(l); }); }
                                                }

                                                function sendP2P(data, steamId64) {
                                                  if (!steamId64) return;
                                                  var api = typeof electronAPI !== 'undefined' && electronAPI.multiplayer;
                                                  if (!api) return;
                                                  var str = typeof data === 'string' ? data : JSON.stringify(data);
                                                  api.sendP2PMessage(steamId64, str).catch(function(e) {
                                                    console.log('[P2P] send failed:', e.message);
                                                  });
                                                }

                                                /**
                                                 * 定时轮询 P2P 消息
                                                 */
                                                function startMultiplayerPolling() {
                                                  if (G._mpPollTimer) return;
                                                  G._mpPollTimer = setInterval(function() {
                                                    var api = typeof electronAPI !== 'undefined' && electronAPI.multiplayer;
                                                    if (!api) return;
                                                    api.onP2PMessage().then(function(r) {
                                                      if (r.ok && r.messages) {
                                                        r.messages.forEach(function(m) {
                                                          var msg;
                                                          try {
                                                            msg = typeof m.data === 'string' ? JSON.parse(m.data) : m.data;
                                                          } catch (e) { return; }
                                                          msg._fromSteamId = m.steamId;
                                                          handleMultiplayerMessage(msg);
                                                        });
                                                      }
                                                    }).catch(function() {});
                                                  }, 100);
                                                }

                                                function stopMultiplayerPolling() {
                                                  if (G._mpPollTimer) {
                                                    clearInterval(G._mpPollTimer);
                                                    G._mpPollTimer = null;
                                                  }
                                                }

                                                /**
                                                 * 多人 leader select / mulligan 流程
                                                 */
                                                function multiplayerPickLeader() {
                                                  if (!G._selectedLeader) return;
                                                  var mp = G._mpState;
                                                  var l = LEADERS_DATA.find(function(x) { return x.id === G._selectedLeader; });
                                                  G.players[mp._myLocalIdx].leader = l;
                                                  G._selectedLeader = null;
                                                  // 本地 leader 确认
                                                  var pkt = packMessage('action', { action: 'leader_pick', data: { leader: l.id, n: l.name } });
                                                  sendP2P(pkt, mp.peerId);
                                                  // 等待对方
                                                  G._mpLeaderPhase = 1;
                                                  showNotification('主将已选，等待对方...', 2000);
                                                  render();
                                                }

                                                /**
                                                 * 玩家换牌确认 (host-authority)
                                                 */
                                                function multiplayerMulliganConfirm(p) {
                                                  var sel = G.mulliganSelected;
                                                  var hand = getHand(p);
                                                  var keeperIdx = new Set();
                                                  sel.forEach(function(idx) { if (idx < hand.length) keeperIdx.add(idx); });
                                                  var i = 0;
                                                  while (i < hand.length) {
                                                    if (keeperIdx.has(i)) { i++; continue; }
                                                    hand.splice(i, 1);
                                                  }
                                                  var cnt = 7 - keeperIdx.size;
                                                  if (cnt > 0) drawCards(p, cnt);
                                                  addLog('换了' + cnt + '张牌');
                                                  G.mulliganSelected = new Set();
                                                  if (p === 0 && G._mpState.isHost) {
                                                    // host 等 guest mulligan
                                                    showNotification('等待对方换牌...', 2000);
                                                    return;
                                                  }

                                                  // 广播换牌结果
                                                  var pkt = packMessage('action', {
                                                    action: 'mulligan_done',
                                                    data: { idx: p, r: cnt }
                                                  });
                                                  sendP2P(pkt, G._mpState.peerId);
                                                  if (G.otherMulliganDone || p !== 0) {
                                                    startMultiplayerGame();
                                                  }
                                                }

                                                function startMultiplayerGame() {
                                                  G._mpPhase = 'game';
                                                  G.activePlayer = G._firstPlayer || 0;
                                                  G.players[0].passed = false; G.players[1].passed = false;
                                                  G.selectedCard = null;
                                                  G.turnCount = 0;
                                                  G.playerTurn = G.activePlayer === 0;
                                                  // 记录 settlement 中…
                                                  G._settlementLogs = [];
                                                  // host 不等待 guest 确认时跳过
                                                  if (!G._mpState.isHost) {
                                                    // guest 等待 host 的 state_diff
                                                  }
                                                  addLog('═══ 对战开始 ═══');
                                                  render();
                                                }

                                                function handleMultiplayerPlayCard(handIdx, row) {
                                                  if (!G.players[0].passed && !G.players[1].passed) {
                                                    if (G._mpState && G.playerTurn) {
                                                      var localIdx = G._mpState.localPlayerIdx !== undefined ? G._mpState.localPlayerIdx :
                                                        (G._mpState._myLocalIdx !== undefined ? G._mpState._myLocalIdx : 0);
                                                      var card = getHand(localIdx)[handIdx];
                                                      if (!card) return;
                                                      if (getCardCost(card.strength) > G.provisions[localIdx]) return;
                                                      if (card.row !== row) return;
                                                      if (!G._mpState.isHost) {
                                                        sendP2P(packMessage('action', {
                                                          type: 'play_card',
                                                          payload: { cardId: card.id, row: row, handIdx: handIdx }
                                                        }), G._mpState.peerId);
                                                        return;
                                                      }
                                                      playCard(localIdx, handIdx, row);
                                                      G.selectedCard = null;
                                                      G.turnCount++;
                                                      G._playerTurn = false;
                                                      checkBothPassed();
                                                    }
                                                  }
                                                }

                                                function multiplayerPassTurn() {
                                                  var p = 0;
                                                  G.players[p].passed = true;
                                                  addLog('放弃本局');
                                                  G.selectedCard = null;
                                                  if (G._mpState && !G._mpState.isHost) {
                                                    sendP2P(packMessage('action', { action: 'pass', data: { i: p } }), G._mpState.peerId);
                                                  }
                                                  checkBothPassed();
                                                }

                                                function checkBothPassed() {
                                                  if (G.players[0].passed && G.players[1].passed) {
                                                    endMultiplayerRound();
                                                  } else {
                                                    render();
                                                  }
                                                }

                                                function endMultiplayerRound() {
                                                  var pP = getBoardPower(G.players[0].board, 0);
                                                  var aP = getBoardPower(G.players[1].board, 1);
                                                  var winner;
                                                  if (pP > aP) { winner = 0; G.scores[0]++; }
                                                  else if (aP > pP) { winner = 1; G.scores[1]++; }
                                                  else { winner = -1; }
                                                  addLog('═══ 第' + (G.round+1) + '局结束 ═══');
                                                  if (winner === 0) addLog('你战力:' + pP + ' vs 对方:' + aP + ' → 你胜利！');
                                                  else if (winner === 1) addLog('你战力:' + pP + ' vs 对方:' + aP + ' → 对方胜利！');
                                                  else addLog('你战力:' + pP + ' vs 对方:' + aP + ' → 平局！');
                                                  G._roundResult = { playerPower: pP, aiPower: aP, winner: winner };

                                                  // host sends match_result
                                                  if (G._mpState.isHost) {
                                                    var gameOver = G.scores[0] >= 2 || G.scores[1] >= 2 || G.round >= 3;
                                                    var sh = gameOver ? _computeSettlementHash() : '';
                                                    var msg = packMessage('match_result', {
                                                      winnerIdx: winner,
                                                      finalScore: G.scores,
                                                      settlementHash: sh
                                                    });
                                                    sendP2P(msg, G._mpState.peerId);
                                                  }

                                                  G._mpPhase = 'round_result';
                                                  render();
                                                }

                                                function checkMultiplayerGameEnd() {
                                                  if (G.scores[0] >= 2 || G.scores[1] >= 2 || G.round >= 3) {
                                                    G._mpPhase = 'game_result';
                                                    render();
                                                    var txt = G.scores[0] > G.scores[1] ? '你赢得了天下！' :
                                                      G.scores[0] === G.scores[1] ? '棋逢对手，不分胜负！' : '对方赢得了天下！';
                                                    showNotification(txt, 4000);
                                                    return true;
                                                  } else {
                                                    G.round++;
                                                    G.players[0].passed = false; G.players[1].passed = false;
                                                    G.selectedCard = null; G.turnCount = 0;
                                                    G.players[0].board = {infantry:[],cavalry:[],navy:[],strategy:[]};
                                                    G.players[1].board = {infantry:[],cavalry:[],navy:[],strategy:[]};
                                                    G.globalBuffs = {playerArmor:0,aiArmor:0,playerUnify:0,aiUnify:0,ambushTriggered:false,
                                                      playerFarm:0,aiFarm:0,playerBerserkCard:null,aiBerserkCard:null};
                                                    G.graveyard = [];
                                                    G.logs = [];
                                                    G.leaderAbilityUsed = [false, false];
                                                    G.activePlayer = 0;
                                                    G.currentTurn = 'player';
                                                    var drawCount = G.round <= 1 ? 0 : 4;
                                                    if (drawCount > 0) { drawCards(0, drawCount); drawCards(1, drawCount); }
                                                    applyRoundStartAbilities();
                                                    addLog('═══ 第' + (G.round) + '局开始 ═══');
                                                    if (drawCount > 0) addLog('双方各抽' + drawCount + '张牌');
                                                    G._mpPhase = 'playing';
                                                    render();
                                                    return false;
                                                  }
                                                }

                                                function _computeSettlementHash() {
                                                  var s = '';
                                                  G.logs.slice(-20).forEach(function(l) { s += l; });
                                                  s += 'score:' + G.scores[0] + '-' + G.scores[1];
                                                  return _quickHash(s);
                                                }

                                                function _quickHash(s) {
                                                  var hash = 0;
                                                  for (var i = 0; i < s.length; i++) {
                                                    hash = ((hash << 5) - hash + s.charCodeAt(i)) | 0;
                                                  }
                                                  return 'h' + (hash >>> 0).toString(36);
                                                }

                                                function processMatchResult(payload) {
                                                  // guest 端校验 settlement hash
                                                  G._remoteWinner = payload.winnerIdx;
                                                  var remoteHash = payload.settlementHash || '';
                                                  var localHash = _computeSettlementHash();
                                                  G._mpRemoteHash = remoteHash;
                                                  G._mpLocalHash = localHash;
                                                  if (remoteHash !== localHash) {
                                                    showSettlementToast(remoteHash, localHash);
                                                  }
                                                  G._mpPhase = 'game_result';
                                                  G.scores = payload.finalScore || G.scores;
                                                  G.phase = 'multiplayer_playing';
                                                  render();
                                                }

                                                function showSettlementToast(remoteHash, localHash) {
                                                  // 非阻塞 toast
                                                  var toast = document.createElement('div');
                                                  toast.className = 'mp-settlement-toast';
                                                  toast.innerHTML = '<div class="mp-toast-title">🛡 结算不一致</div>' +
                                                    '<div class="mp-toast-msg">对手终局战力与你的回合过程不一致</div>' +
                                                    '<div class="mp-toast-details">对方: ' + remoteHash + ' vs 你: ' + localHash + '</div>' +
                                                    '<div class="mp-toast-actions">' +
                                                      '<button class="mp-toast-btn" onclick="dismissSettlementToast()">我知道了</button>' +
                                                    '</div>';
                                                  document.body.appendChild(toast);
                                                  setTimeout(function() { if (toast.parentNode) toast.remove(); }, 12000);
                                                }

                                                // 30s 重连等待 UI + concede 投降
                                                G._mpReconnectTimer = null;

                                                function startReconnectWaiting() {
                                                  if (G._mpReconnectTimer) return;
                                                  G._mpReconnectCountdown = 30;
                                                  G._mpReconnectTimer = setInterval(function() {
                                                    G._mpReconnectCountdown--;
                                                    if (G._mpReconnectCountdown <= 0) {
                                                      timeoutReconnect();
                                                    }
                                                    render();
                                                  }, 1000);
                                                }

                                                function stopReconnectTimer() {
  if (G._mpReconnectTimer) {
    clearInterval(G._mpReconnectTimer);
    G._mpReconnectTimer = null;
  }
}

function timeoutReconnect() {
                                                  stopReconnectTimer();
                                                  showNotification('对方超时未响应，判定你获胜', 5000);
                                                  // concede host
                                                  var msg = packMessage('concede', { reason: 'timeout' });
                                                  sendP2P(msg, G._mpState.peerId);
                                                  var localIdx = G._mpState && G._mpState.localPlayerIdx !== undefined ? G._mpState.localPlayerIdx : 0;
                                                  G.scores[localIdx] = 2;
                                                  G._mpPhase = 'game_result';
                                                  G.phase = 'multiplayer_playing';
                                                  render();
                                                }

                                                function multipConcede() {
                                                  var msg = packMessage('concede', { reason: 'forfeit' });
                                                  sendP2P(msg, G._mpState.peerId);
                                                  G.scores[1] = 2;
                                                  G._mpPhase = 'game_result';
                                                  G.phase = 'multiplayer_playing';
                                                  render();
                                                }

                                                // ===== 08: hot-seat — 同机双人完整流程 =====
            function initHotSeat(){
                          // RNG seed 在双方 leader 选完后生成 (spec T8 §5)
                          delete G._rng;  // 清除旧 seed，leader_select 后用 Math.random()
                          G.phase='hot_seat_playing';
                          G.activePlayer=0;
                          G._hsPhase='leader_select';
                          G._hsLeaderPicks=[null,null];
                          G.scores=[0,0]; G.round=0;
                          G.provisions=[30,30];
                          G.leaderAbilityUsed=[false,false];
                          render();
                        }

            function hotSeatPickLeader(){
                          if(!G._selectedLeader)return;
                          var p=G.activePlayer;
                          var l=LEADERS_DATA.find(function(x){return x.id===G._selectedLeader});
                          G._hsLeaderPicks[p]=l;
                          G.players[p].leader=l;
                          G._selectedLeader=null;
                          if(p===0){
                            G.activePlayer=1;
                            showTransferModal(1, '请将设备交给玩家 2 选择主将', 'leaderselect');
                            render();
                            return;
                          }
                          // Both done: setup game
                          hotSeatSetup();
                        }

    function hotSeatSetup(){
                  // Called after both leaders confirmed
                  // RNG seed: 双方 leader 选完后再生成 (spec T8 §5)
                  const p0=G.players[0].leader, p1=G.players[1].leader;
                  G.players[0].deck=buildDeck(p0.faction);
                  G.players[1].deck=buildDeck(p1.faction);
                  applyLeaderDeckAbility(p0,G.players[0].deck);
                  applyLeaderDeckAbility(p1,G.players[1].deck);
                  G.scores=[0,0]; G.round=0;
                  G.players[0].passed=false; G.players[1].passed=false;
                  G.selectedCard=null; G.logs=[]; G.turnCount=0;
                  G.globalBuffs={playerArmor:0,aiArmor:0,playerUnify:0,aiUnify:0,ambushTriggered:false,
                    playerFarm:0,aiFarm:0,playerBerserkCard:null,aiBerserkCard:null};
                  G.graveyard=[];
                  G.mulliganSelected=new Set();
                  G.leaderAbilityUsed=[false,false];
                                    // 双方依次换牌 (玩家1 先 → 玩家2 后) — 不随机先手
                                    G.activePlayer=0;
                                    // 生成确定性 RNG seed（用于对局内所有随机调用）
                                    const seed=Math.floor(Math.random()*2147483647);
                                    G._rng=rngFromSeed(seed);
                                    // Mulligan-like: both draw 7
                                    drawCards(0,7); drawCards(1,7);
                                    G._hsPhase='mulligan';
                                    G._firstPlayer=0;
                                    addLog('═══ 热座模式：双方换牌 ═══');
                                    addLog('玩家1先换牌');
                                    render();
                                  }

                              function hotSeatConfirmMulligan(){
                                                                var p=G.activePlayer;
                                                                var hand=getHand(p);
                                                                // 玩家 1 模式: 删除未保留的牌 + 每删一张补一张 (与 AI 对战 confirmMulligan 一致)
                                                                var sortedIdx=Array.from(G.mulliganSelected||new Set()).sort(function(a,b){return b-a});
                                                                var cnt=sortedIdx.length;
                                                                if(cnt>0){
                                                                  sortedIdx.forEach(function(idx){
                                                                    if(hand.length>idx) hand.splice(idx,1);
                                                                    drawCards(p,1);
                                                                  });
                                                                }else{
                                                                  // 玩家没选任何保留 — 按 spec 默认换 3 张
                                                                  for(var k=0;k<3&&hand.length>0;k++){
                                                                    hand.splice(0,1);
                                                                    drawCards(p,1);
                                                                  }
                                                                  cnt=3;
                                                                }
                                                                addLog((p===0?'玩家1':'玩家2')+'换了'+cnt+'张牌');
                                                                G.mulliganSelected=new Set();
                                                                // 玩家1 换完 → 切到玩家2
                                                                if(G.activePlayer===0){
                                                                  G.activePlayer=1;
                                                                  showTransferModal(1,'换牌阶段 — 请将设备交给玩家 2','mulligan');
                                                                  render();
                                                                  return;
                                                                }
                                                                // 玩家2 换完 → 随机决定先手 + 进入 game
                                                                                                  G._firstPlayer=Math.floor(Math.random()*2);
                                                                                                  G.round=1;
                                                                                                  G._hsPhase='game';
                                                                                                  G.activePlayer=G._firstPlayer;
                                                                                                  G.players[0].passed=false; G.players[1].passed=false;
                                                                                                  G.selectedCard=null;
                                                                                                  G.turnCount=0;
                                                                                                  addLog('═══ 换牌结束，玩家'+(G._firstPlayer+1)+'先手 ═══');
                                                                                                  render();
                                                                                                  // 双方移交控制: 先手方需点"开始我的回合"才能进入主界面
                                                                                                  showTransferModal(G._firstPlayer,'对局开始 — 请将设备交给玩家'+(G._firstPlayer+1),'gamestart');
                                                                                                }

            function hotSeatToggleMulligan(idx){
              if(G.mulliganSelected.has(idx)) G.mulliganSelected.delete(idx);
              else G.mulliganSelected.add(idx);
              render();
            }

            function hotSeatPassTurn(){
                          const a=G.activePlayer;
                          G.players[a].passed=true;
                          addLog((a===0?'玩家1':'玩家2')+'放弃了本局');
                          G.selectedCard=null;
                          const b=1-a;
                          if(G.players[b].passed){
                            hotSeatEndRound();
                          }else{
                            G.activePlayer=b;
                            showTransferModal(b,'请将设备交给玩家'+(b+1),'turnevent');
                            render();
                          }
                        }

            function hotSeatEndRound(){
              const pP=getBoardPower(G.players[0].board,0);
              const aP=getBoardPower(G.players[1].board,1);
              let winner;
              if(pP>aP){winner=0;G.scores[0]++}
              else if(aP>pP){winner=1;G.scores[1]++}
              else{winner=-1}
              addLog('═══ 第'+G.round+'局结束 ═══');
              if(winner===0) addLog('玩家1战力:'+pP+' vs 玩家2战力:'+aP+' → 玩家1胜利！');
              else if(winner===1) addLog('玩家1战力:'+pP+' vs 玩家2战力:'+aP+' → 玩家2胜利！');
              else addLog('玩家1战力:'+pP+' vs 玩家2战力:'+aP+' → 平局！');

              G._hsPhase='round_result';

            function hotSeatCheckGameEnd(){
              if(G.scores[0]>=2||G.scores[1]>=2||G.round>=3){
                G._hsPhase='game_result';
                render();
                const txt=G.scores[0]>G.scores[1]?'玩家1赢得了天下！':
                  G.scores[0]===G.scores[1]?'棋逢对手，不分胜负！':'玩家2赢得了天下！';
                showNotification(txt,3000);
              }else{
                G.round++;
                G.players[0].passed=false; G.players[1].passed=false;
                G.selectedCard=null; G.turnCount=0;
                G.players[0].board={infantry:[],cavalry:[],navy:[],strategy:[]};
                G.players[1].board={infantry:[],cavalry:[],navy:[],strategy:[]};
                G.globalBuffs={playerArmor:0,aiArmor:0,playerUnify:0,aiUnify:0,ambushTriggered:false,
                  playerFarm:0,aiFarm:0,playerBerserkCard:null,aiBerserkCard:null};
                G.graveyard=[];
                G.logs=[];
                G.leaderAbilityUsed=[false,false];
                G.activePlayer=0;
                G.currentTurn='player';
                const drawCount=G.round<=1?0:4;
                if(drawCount>0){drawCards(0,drawCount);drawCards(1,drawCount);}
                applyRoundStartAbilities();
                addLog('═══ 第'+G.round+'局开始 ═══');
                if(drawCount>0) addLog('双方各抽'+drawCount+'张牌');
                G._hsPhase='game';
                render();
              }
            }

            function hotSeatPlayCard(handIdx,row){
                          if(G._hsPhase!=='game')return;
                          const a=G.activePlayer;
                          const card=getHand(a)[handIdx];
                          if(!card)return;
                          if(getCardCost(card.strength)>G.provisions[a])return;
                          if(card.row!==row)return;
                          playCard(a,handIdx,row);
                          G.selectedCard=null;
                          G.turnCount++;
                          // check if opponent has any playable card
                          const opp=1-a;
                          if(!hasPlayableCard(opp)){
                            G.players[opp].passed=true;
                            addLog('玩家'+(opp+1)+'无牌可出，自动放弃');
                          }
                          if(G.players[0].passed&&G.players[1].passed){
                            hotSeatEndRound();
                          }else{
                            // Switch player
                            let next=1-a;
                            // Skip passed player
                            if(G.players[next].passed) next=1-next;
                            if(G.players[next].passed){
                              hotSeatEndRound();
                            return;
                            }
                            G.activePlayer=next;
                            // force re-render game + modal overlay
                            render();
                            showTransferModal(next,'请将设备交给玩家'+(next+1),'turnevent');
                          }
                        }

        function handleHotSeatHandCard(card,idx,activeIdx){

            var selected=myTurn&&G.selectedCard===idx;
            var cls=selected?'selected':(!playable?'unplayable':'');
            var rowName=ROW_NAMES[card.row];
            var desc=(card.desc||'')+(card.protectArmor?' 🛡'+card.protectArmor:'');
            return'<div class="card '+cls+'" '+(myTurn?'onclick="onCardClick('+idx+')" ':'')+
              'title="'+card.name+' - '+rowName+'" style="'+
              '--faction-color:'+f.color+';--faction-glow:'+f.color+'40;width:96px;min-width:96px;max-width:96px;flex:0 0 96px">'+
              '<div class="card-cost">'+cost+'</div>'+

  startMultiplayerPolling();
  render(); // 立即同步 UI (connecting 状态)
  console.log('[host] status=' + G._mpState._status + ', hasEAPI=' + (typeof electronAPI !== 'undefined'));
  // Try to open invite dialog
  if (typeof electronAPI !== 'undefined' && electronAPI.multiplayer) {
    console.log('[host] calling openInviteDialog'); electronAPI.multiplayer.openInviteDialog().then(function(r) {
      // r.ok=false 通常是 steam_not_running (dev 模式无 Steam)
      // 在这种模式下, 我们跳过 waiting_invite 阶段, 但保留 connecting 状态让 polling
      // 检测到 peerQueue 中的消息即可触发 connected (mock 会自动 fill peerQueue)
      console.log('[host] openInviteDialog RESOLVED, r.ok=' + r.ok + ', r=' + JSON.stringify(r));
      if (r.ok) {
        // Dev mock: main.js IPC 返回 ok=true, 直接跳 connected (单人模式自模拟)
        G._mpState._peerName = 'Mock对手(guest)';
        G._mpState.peerId = 'mock-guest';
        G._mpState._status = 'connected';
        render();
      }
    }).catch(function(e) {
      console.log('[host] CATCH: ' + (e && e.message));
      // IPC 调用失败, polling 也会继续, 等 mock 模拟
    });
  }
}

function joinMultiplayerRoom() {
  G._mpState = G._mpState || {};
  G._mpState._host = 'guest';
  G._mpState._status = 'connecting';
  G._mpState._myLocalIdx = 1;
  G.phase = 'multiplayer_lobby';
  startMultiplayerPolling();
  render();
  showNotification('等待游戏邀请...', 2500);
  // Dev mock: 自动配对 (HOST 已经 AUTO-HOST 设了 connected), 我们也设 connected
  // 实际游戏中 join 是被动接收 — dev 模式直接同步
  setTimeout(function(){
    if(G._mpState && G._mpState._status==='connecting'){
      G._mpState._peerName='Mock对手(host)';
      G._mpState.peerId='mock-host';
      G._mpState._status='connected';
      render();
    }
  },300);
}

function cancelMultiplayerInvite() {
  if (G._mpState) G._mpState._status = 'idle';
  stopMultiplayerPolling();
  render();
}

function startLeaderSelect() {
  G._mpState._status = 'picking_leader';
  G._mpPhase = 'leader_select';
  startMultiplayerPolling();
  G.phase = 'multiplayer_playing';
  render();
}

function showMultiplayerMenu() {
  G._mpState = G._mpState || {};
  G._mpState._status = 'idle';
  G._mpState._myLocalIdx = 0;
  G.phase = 'multiplayer_lobby';
  render();
}

function showConfirmModal(title, msg, onYes){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-modal-overlay';
  overlay.innerHTML = `<div class="confirm-modal">
    <div class="confirm-title">${title}</div>
    <div class="confirm-msg">${msg}</div>
    <div class="confirm-btns">
      <button class="confirm-btn confirm-no">取消</button>
      <button class="confirm-btn confirm-yes">确认</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.querySelector('.confirm-no').onclick = close;
  overlay.querySelector('.confirm-yes').onclick = () => { close(); onYes(); };
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
}

document.addEventListener('DOMContentLoaded',()=>render());
</script>
</body>
</html>
